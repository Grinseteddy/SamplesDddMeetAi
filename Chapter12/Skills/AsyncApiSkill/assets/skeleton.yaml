asyncapi: 3.1.0
info:
  title: <API Name>
  version: 1.0.0
  description: |
    <One or more sentences describing what this event-driven API does and who uses it.>
  contact:
    name: <Owning team or person>
    url: <https://example.org>
    email: <team@example.org>

servers:
  production:
    host: "<broker-host:port>"          # Kafka events.example.com:9092 | RabbitMQ rabbitmq.example.com:5672 — no scheme here
    protocol: "<kafka|mqtt|amqp|amqps|ws|...>"
    # protocolVersion: "0.9.1"          # AMQP/RabbitMQ only
    description: "Production broker"
    security:
      - $ref: '#/components/securitySchemes/user-password'
    # Kafka only (AMQP has no server binding):
    # bindings:
    #   kafka:
    #     schemaRegistryUrl: "<https://schema-registry.example.com>"
    #     schemaRegistryVendor: "confluent"
    #     bindingVersion: "0.5.0"

defaultContentType: application/json

channels:
  <resourceEvents>:                      # camelCase channel key
    address: "<resource-area/resources>" # kebab-case: Kafka/MQTT "area/resources"; AMQP routing key "resource.{eventType}"
    messages:
      <resourceCreated>:
        $ref: '#/components/messages/<resourceCreated>'
      <resourceUpdated>:
        $ref: '#/components/messages/<resourceUpdated>'
    # Every channel carries the binding for its protocol — keep ONE of these. See conventions.md §12.
    # bindings:
    #   kafka:
    #     topic: <resource-area.resources>   # only if different from address
    #     partitions: 6
    #     replicas: 3
    #     topicConfiguration:
    #       cleanup.policy: ["delete"]
    #       retention.ms: 604800000
    #     bindingVersion: "0.5.0"
    #
    #   amqp:
    #     is: routingKey                 # publisher: address is the routing key on this exchange
    #     exchange:
    #       name: <resource-area>
    #       type: topic
    #       durable: true
    #       autoDelete: false
    #       vhost: /
    #     bindingVersion: "0.3.0"
    #
    #   For a CONSUMER channel use instead:
    #   amqp:
    #     is: queue                      # consumer: address is the queue name
    #     queue:
    #       name: <consumer-context>.<purpose>
    #       durable: true
    #       exclusive: false
    #       autoDelete: false
    #       vhost: /
    #     bindingVersion: "0.3.0"

operations:
  # action is from THIS application's perspective:
  #   send    = this app publishes the message
  #   receive = this app consumes the message
  publish<ResourceCreated>:
    action: send
    channel:
      $ref: '#/channels/<resourceEvents>'
    messages:
      - $ref: '#/channels/<resourceEvents>/messages/<resourceCreated>'
    # Keep ONE of these:
    # bindings:
    #   kafka:
    #     clientId:                      # a `receive` operation carries `groupId` instead
    #       type: string
    #       enum: [<this-service-name>]
    #     bindingVersion: "0.5.0"
    #
    #   amqp:
    #     deliveryMode: 2                # 2 = persistent; 1 = transient
    #     mandatory: true
    #     bindingVersion: "0.3.0"        # a `receive` operation carries `ack: true` instead

  publish<ResourceUpdated>:
    action: send
    channel:
      $ref: '#/channels/<resourceEvents>'
    messages:
      - $ref: '#/channels/<resourceEvents>/messages/<resourceUpdated>'

components:
  messages:
    <resourceCreated>:
      name: <ResourceCreated>            # PascalCase
      title: <Resource Created Event>    # human-readable
      summary: Indicates that a new <resource> has been created
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/<ResourceCreated>Payload'
      # Keep ONE of these:
      # bindings:
      #   kafka:
      #     key:                             # partition key = aggregate id
      #       type: string
      #       format: uuid
      #     schemaIdLocation: header
      #     bindingVersion: "0.5.0"
      #
      #   amqp:
      #     contentEncoding: identity
      #     messageType: <ResourceCreated>   # mirror `name`
      #     bindingVersion: "0.3.0"

    <resourceUpdated>:
      name: <ResourceUpdated>
      title: <Resource Updated Event>
      summary: Indicates that a <resource> has been updated
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/<ResourceUpdated>Payload'

  schemas:
    # Shared by EVERY message — cross-cutting tracing/routing metadata.
    MessageHeader:
      type: object
      required:
        - correlationId
        - messageId
        - source
      properties:
        correlationId:
          type: string
          format: uuid
          description: Identifier to trace the end-to-end journey
        messageId:
          type: string
          format: uuid
          description: Unique identifier for this message
        source:
          type: string
          description: Source system generating the event
          minLength: 2
          maxLength: 20

    <ResourceCreated>Payload:
      type: object
      required:
        - <resource>Id
        - status
      properties:
        <resource>Id:
          type: string
          format: uuid
        status:
          type: string
          enum: [CREATED]                # single-value enum models the state machine
        # ... domain fields with constraints (minLength/maxLength, format, etc.) ...
        createdAt:
          type: string
          format: date-time

    <ResourceUpdated>Payload:
      type: object
      required:
        - <resource>Id
        - status
      properties:
        <resource>Id:
          type: string
          format: uuid
        status:
          type: string
          enum: [UPDATED]

  securitySchemes:
    user-password:
      type: userPassword
      description: Basic authentication for event broker