            HelpNotProvided:
              summary: The help has already been accepted or rejected
              value:
                type: https://larder.org/problems/cook-assistance/help-not-provided
                title: HelpNotProvided
                status: 409
                detail: help 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e is ACCEPTED
                code: HelpNotProvided
                rule: INV-13
            ConcurrencyConflict:
              summary: Someone else changed the resource, or a generated identity was already taken
              value:
                type: https://larder.org/problems/cook-assistance/concurrency-conflict
                title: ConcurrencyConflict
                status: 409
                detail: the help request was changed by someone else; load it again and retry
                code: ConcurrencyConflict
                rule: null

    DomainRuleViolationResponse:
      description: The request is well-formed but violates a rule of Cook Assistance
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            StepNotInRecipe:
              summary: The step does not exist in the recipe
              value:
                type: https://larder.org/problems/cook-assistance/step-not-in-recipe
                title: StepNotInRecipe
                status: 422
                detail: Sunday scones has 8 steps; step 9 does not exist
                code: StepNotInRecipe
                rule: INV-18
            ChefOnlyForMenu:
              summary: A Chef was addressed for another topic
              value:
                type: https://larder.org/problems/cook-assistance/chef-only-for-menu
                title: ChefOnlyForMenu
                status: 422
                detail: Chefs are only allowed for Meal plan
                code: ChefOnlyForMenu
                rule: INV-20
            TopicNotYetSupported:
              summary: The topic is not served yet
              value:
                type: https://larder.org/problems/cook-assistance/topic-not-yet-supported
                title: TopicNotYetSupported
                status: 422
                detail: help with MENU is not offered yet
                code: TopicNotYetSupported
                rule: null
            SubstituteCountOutOfRange:
              summary: Too many or no substitutes
              value:
                type: https://larder.org/problems/cook-assistance/substitute-count-out-of-range
                title: SubstituteCountOutOfRange
                status: 422
                detail: an answer contains 1 to 3 substitutes, not 4
                code: SubstituteCountOutOfRange
                rule: INV-12

    ServiceUnavailableResponse:
      description: A dependency (database, Recipe Catalog) is unavailable; retry later
      headers:
        Retry-After:
          description: Seconds after which the client may retry.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    UnsupportedMediaTypeResponse:
      description: The request body is not in a content type this operation accepts (application/json)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    InternalErrorResponse:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  links:
    GetHelpRequestLink:
      operationId: getHelpRequestById
      description: Retrieve this help request again.
      parameters:
        helpRequestId: $response.body#/helpRequestId
    ListHelpsLink:
      operationId: listHelpsForHelpRequest
      description: List the helps given to this help request.
      parameters:
        helpRequestId: $response.body#/helpRequestId
    ProvideHelpLink:
      operationId: provideHelp
      description: Answer this help request.
      parameters:
        helpRequestId: $response.body#/helpRequestId
    CancelHelpRequestLink:
      operationId: cancelHelpRequest
      description: Cancel this help request.
      parameters:
        helpRequestId: $response.body#/helpRequestId
    GetHelpLink:
      operationId: getHelpById
      description: Retrieve this help again.
      parameters:
        helpId: $response.body#/helpId
    AcceptHelpLink:
      operationId: acceptHelp
      description: Accept this help.
      parameters:
        helpId: $response.body#/helpId
    RejectHelpLink:
      operationId: rejectHelp
      description: Reject this help.
      parameters:
        helpId: $response.body#/helpId
    GetHelpRequestOfHelpLink:
      operationId: getHelpRequestById
      description: Retrieve the help request this help answers.
      parameters:
        helpRequestId: $response.body#/helpRequestId

  requestBodies:
    HelpRequestCreateRequest:
      description: Help request creation request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HelpRequestCreate'

    ChefReviewCreateRequest:
      description: Chef review request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChefReviewCreate'

    HelpCreateRequest:
      description: Help creation request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HelpCreate'

  securitySchemes:
    oAuth2:
      type: oauth2
      description: OAuth 2.0 Authorization Code Flow with PKCE
      flows:
        authorizationCode:
          authorizationUrl: https://larder.org/auth
          tokenUrl: https://larder.org/tokens
          refreshUrl: https://larder.org/refresh
          scopes:
            cooking-assistance:read: Grants read access to help requests and helps
            cooking-assistance:write: Grants permission to request, provide, accept and reject help and to cancel help requests
            cooking-assistance:admin: Grants administrative access
