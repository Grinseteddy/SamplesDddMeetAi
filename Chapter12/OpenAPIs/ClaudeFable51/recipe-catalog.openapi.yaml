openapi: 3.1.0
info:
  title: Recipe Catalog API
  description: |
    API for managing recipes and searching them by meal, ingredients and diet.
    Cooks create and maintain their own recipes; any authenticated user can search the catalog and download a recipe.
  version: 1.0.0
  contact:
    name: Annegret Junker
    email: annegret.junker@larder.org
  x-api-id: 5b8d3c2e-6f41-4a9b-9c7e-2d1f0a8b4e63
  x-audience: external-public

servers:
  - url: 'https://larder.org/recipe-catalog'

security:
  - oAuth2:
      - recipe:read
      - recipe:write
      - recipe:admin

tags:
  - name: Recipes
    description: Recipe management and search operations
  - name: Ingredients
    description: Ingredient operations on a recipe
  - name: How-To Steps
    description: Preparation step operations on a recipe
  - name: Meals
    description: Meal assignment of a recipe

paths:
  /recipes:
    get:
      operationId: searchRecipes
      tags:
        - Recipes
      summary: Search recipes
      description: |
        Search the catalog for recipes by meal, diet and ingredients.
        All filters are optional and combined with AND; without filters the whole catalog is returned.
        The ingredients filter matches recipes containing every listed ingredient name.
      parameters:
        - $ref: '#/components/parameters/DietParameter'
        - $ref: '#/components/parameters/MealParameter'
        - $ref: '#/components/parameters/IngredientsParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/RecipesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

    post:
      operationId: createRecipe
      tags:
        - Recipes
      summary: Create a new recipe
      description: |
        Create a new recipe in the catalog.
        The authenticated caller becomes the owner of the recipe.
        A recipe must be created with at least one ingredient and at least one how-to step;
        identifiers of the recipe, its ingredients and its steps are generated by the server.
      security:
        - oAuth2:
            - recipe:write
      parameters:
        - $ref: '#/components/parameters/VersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/RecipeCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/RecipeLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

  /recipes/{recipeId}:
    get:
      operationId: getRecipeById
      tags:
        - Recipes
      summary: Get recipe by ID
      description: |
        Retrieve a complete recipe by its unique identifier, including its ingredients, how-to steps, meal and diet.
        This is the download operation of the catalog.
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/RecipeResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

    patch:
      operationId: updateRecipe
      tags:
        - Recipes
      summary: Update recipe
      description: |
        Partially update the details of an existing recipe.
        Only the owner of the recipe can change it; any other caller receives 403.
        The recipe identifier and the owner cannot be changed.
        Ingredients and how-to steps are maintained through their own sub-resources, not through this operation.
      security:
        - oAuth2:
            - recipe:write
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/RecipeUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/RecipeLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

    delete:
      operationId: deleteRecipe
      tags:
        - Recipes
      summary: Delete recipe
      description: |
        Delete a recipe together with all of its ingredients and how-to steps.
        Only the owner of the recipe can delete it; any other caller receives 403.
        This operation is irreversible.
      security:
        - oAuth2:
            - recipe:write
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '204':
          description: Recipe deleted successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

  /recipes/{recipeId}/ingredients:
    get:
      operationId: getRecipeIngredients
      tags:
        - Ingredients
      summary: Get ingredients of a recipe
      description: |
        Retrieve all ingredients of a recipe. A recipe always has at least one ingredient.
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/IngredientsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

    post:
      operationId: addRecipeIngredient
      tags:
        - Ingredients
      summary: Add an ingredient to a recipe
      description: |
        Add a new ingredient to an existing recipe.
        Only the owner of the recipe can add ingredients; any other caller receives 403.
        The ingredient identifier is generated by the server.
      security:
        - oAuth2:
            - recipe:write
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/IngredientCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/IngredientLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

  /recipes/{recipeId}/ingredients/{ingredientId}:
    get:
      operationId: getRecipeIngredientById
      tags:
        - Ingredients
      summary: Get ingredient by ID
      description: |
        Retrieve a single ingredient of a recipe by its unique identifier.
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/IngredientIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/IngredientResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

    patch:
      operationId: updateRecipeIngredient
      tags:
        - Ingredients
      summary: Update ingredient
      description: |
        Partially update the name, value or unit of an ingredient.
        Only the owner of the recipe can change its ingredients; any other caller receives 403.
      security:
        - oAuth2:
            - recipe:write
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/IngredientIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/IngredientUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/IngredientLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

    delete:
      operationId: deleteRecipeIngredient
      tags:
        - Ingredients
      summary: Delete ingredient
      description: |
        Remove an ingredient from a recipe.
        Only the owner of the recipe can delete its ingredients; any other caller receives 403.
        A recipe must keep at least one ingredient, so removing the last one is rejected with 400.
      security:
        - oAuth2:
            - recipe:write
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/IngredientIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '204':
          description: Ingredient deleted successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

  /recipes/{recipeId}/how-to-steps:
    get:
      operationId: getRecipeHowToSteps
      tags:
        - How-To Steps
      summary: Get how-to steps of a recipe
      description: |
        Retrieve all how-to steps of a recipe, ordered by sequence number.
        A recipe always has at least one step.
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/HowToStepsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

    post:
      operationId: addRecipeHowToStep
      tags:
        - How-To Steps
      summary: Add a how-to step to a recipe
      description: |
        Add a new how-to step to an existing recipe.
        Only the owner of the recipe can add steps; any other caller receives 403.
        The step identifier is generated by the server; the sequence number must be unique within the recipe.
      security:
        - oAuth2:
            - recipe:write
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/HowToStepCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/HowToStepLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

  /recipes/{recipeId}/how-to-steps/{howToStepId}:
    get:
      operationId: getRecipeHowToStepById
      tags:
        - How-To Steps
      summary: Get how-to step by ID
      description: |
        Retrieve a single how-to step of a recipe by its unique identifier.
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/HowToStepIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/HowToStepResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

    patch:
      operationId: updateRecipeHowToStep
      tags:
        - How-To Steps
      summary: Update how-to step
      description: |
        Partially update the sequence number, description or illustration of a how-to step.
        Only the owner of the recipe can change its steps; any other caller receives 403.
        Changing the sequence number to one already used by another step of the same recipe is rejected with 400.
      security:
        - oAuth2:
            - recipe:write
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/HowToStepIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/HowToStepUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/HowToStepLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

    delete:
      operationId: deleteRecipeHowToStep
      tags:
        - How-To Steps
      summary: Delete how-to step
      description: |
        Remove a how-to step from a recipe.
        Only the owner of the recipe can delete its steps; any other caller receives 403.
        A recipe must keep at least one how-to step, so removing the last one is rejected with 400.
      security:
        - oAuth2:
            - recipe:write
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/HowToStepIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '204':
          description: How-to step deleted successfully
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

  /recipes/{recipeId}/meals:
    get:
      operationId: getRecipeMeal
      tags:
        - Meals
      summary: Get meal of a recipe
      description: |
        Retrieve the meal (breakfast, lunch, dinner or supper) a recipe is intended for.
        Every recipe is assigned to exactly one meal.
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/MealResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

    put:
      operationId: updateRecipeMeal
      tags:
        - Meals
      summary: Set meal of a recipe
      description: |
        Replace the meal a recipe is intended for.
        Only the owner of the recipe can change it; any other caller receives 403.
      security:
        - oAuth2:
            - recipe:write
      parameters:
        - $ref: '#/components/parameters/RecipeIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/MealUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/MealLinkResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/ServiceNotAvailableResponse'
        default:
          $ref: '#/components/responses/DefaultErrorResponse'

components:
  parameters:
    RecipeIdParameter:
      name: recipeId
      in: path
      description: Unique identifier of the recipe.
      required: true
      schema:
        type: string
        format: uuid

    IngredientIdParameter:
      name: ingredientId
      in: path
      description: Unique identifier of the ingredient within its recipe.
      required: true
      schema:
        type: string
        format: uuid

    HowToStepIdParameter:
      name: howToStepId
      in: path
      description: Unique identifier of the how-to step within its recipe.
      required: true
      schema:
        type: string
        format: uuid

    DietParameter:
      name: diet
      in: query
      description: Only return recipes suitable for this diet.
      required: false
      schema:
        $ref: '#/components/schemas/Diet'

    MealParameter:
      name: meal
      in: query
      description: Only return recipes intended for this meal.
      required: false
      schema:
        $ref: '#/components/schemas/Meal'

    IngredientsParameter:
      name: ingredients
      in: query
      description: Only return recipes that contain every one of these ingredient names, e.g. ingredients=Flour&ingredients=Butter.
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 100

    VersionParameter:
      name: version
      in: header
      description: Version of the API contract the client was built against.
      required: true
      schema:
        type: string
        default: "1.0.0"
        enum: ["1.0.0"]

  schemas:
    Recipe:
      description: A recipe in the catalog, owned by one cook, with its ingredients, preparation steps, meal, diet and images.
      type: object
      required:
        - recipeId
        - owner
        - name
        - preparationTime
        - ingredients
        - howToSteps
        - meal
        - diet
        - servings
      properties:
        recipeId:
          description: Unique identifier of the recipe, generated by the server.
          type: string
          format: uuid
        owner:
          description: Identifier of the cook who owns the recipe and is the only one allowed to change or delete it; taken from the authenticated caller on creation.
          type: string
          format: uuid
        name:
          description: Name under which the recipe is presented in the catalog, e.g. "Scones for Sunday".
          type: string
          minLength: 1
          maxLength: 200
        subtitle:
          description: Optional short tagline that supplements the name, e.g. "Easy to prepare on Saturday".
          type: [string, "null"]
          maxLength: 300
        mainImage:
          description: Optional link to the image shown as the recipe's main picture.
          type: [string, "null"]
          format: uri
        furtherImages:
          description: Additional images of the recipe; a recipe carries at most ten of them.
          type: array
          maxItems: 10
          items:
            description: Link to one additional image of the recipe.
            type: string
            format: uri
        preparationTime:
          description: Total time needed to prepare the recipe, as hours and minutes in the form HH:MM, e.g. "02:00".
          type: string
          pattern: '^[0-9]{2}:[0-5][0-9]$'
        servings:
          description: Number of portions the recipe yields with the given ingredient values.
          type: integer
          minimum: 1
        meal:
          description: The meal of the day this recipe is intended for.
          $ref: '#/components/schemas/Meal'
        diet:
          description: The diet this recipe is suitable for.
          $ref: '#/components/schemas/Diet'
        ingredients:
          description: The ingredients needed for the recipe; every recipe has at least one.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Ingredient'
        howToSteps:
          description: The preparation steps of the recipe in the order given by their sequence numbers; every recipe has at least one.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/HowToStep'

    RecipeCreate:
      description: Data a cook supplies to create a new recipe; identifiers and the owner are set by the server.
      type: object
      required:
        - name
        - preparationTime
        - ingredients
        - howToSteps
        - meal
        - diet
        - servings
      properties:
        name:
          description: Name under which the recipe is presented in the catalog, e.g. "Scones for Sunday".
          type: string
          minLength: 1
          maxLength: 200
        subtitle:
          description: Optional short tagline that supplements the name, e.g. "Easy to prepare on Saturday".
          type: [string, "null"]
          maxLength: 300
        mainImage:
          description: Optional link to the image shown as the recipe's main picture.
          type: [string, "null"]
          format: uri
        furtherImages:
          description: Additional images of the recipe; a recipe carries at most ten of them.
          type: array
          maxItems: 10
          items:
            description: Link to one additional image of the recipe.
            type: string
            format: uri
        preparationTime:
          description: Total time needed to prepare the recipe, as hours and minutes in the form HH:MM, e.g. "02:00".
          type: string
          pattern: '^[0-9]{2}:[0-5][0-9]$'
        servings:
          description: Number of portions the recipe yields with the given ingredient values.
          type: integer
          minimum: 1
        meal:
          description: The meal of the day this recipe is intended for.
          $ref: '#/components/schemas/Meal'
        diet:
          description: The diet this recipe is suitable for.
          $ref: '#/components/schemas/Diet'
        ingredients:
          description: The ingredients needed for the recipe; at least one must be supplied.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IngredientCreate'
        howToSteps:
          description: The preparation steps of the recipe; at least one must be supplied, with unique sequence numbers.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/HowToStepCreate'

    RecipeUpdate:
      description: Partial update of a recipe's own details; ingredients, steps and meal are changed through their sub-resources.
      type: object
      properties:
        name:
          description: Name under which the recipe is presented in the catalog, e.g. "Scones for Sunday".
          type: string
          minLength: 1
          maxLength: 200
        subtitle:
          description: Optional short tagline that supplements the name, e.g. "Easy to prepare on Saturday".
          type: [string, "null"]
          maxLength: 300
        mainImage:
          description: Optional link to the image shown as the recipe's main picture.
          type: [string, "null"]
          format: uri
        furtherImages:
          description: Additional images of the recipe; replaces the whole list, at most ten entries.
          type: array
          maxItems: 10
          items:
            description: Link to one additional image of the recipe.
            type: string
            format: uri
        preparationTime:
          description: Total time needed to prepare the recipe, as hours and minutes in the form HH:MM, e.g. "02:00".
          type: string
          pattern: '^[0-9]{2}:[0-5][0-9]$'
        servings:
          description: Number of portions the recipe yields with the given ingredient values.
          type: integer
          minimum: 1
        diet:
          description: The diet this recipe is suitable for.
          $ref: '#/components/schemas/Diet'

    Ingredient:
      description: One ingredient of a recipe with the quantity needed for the recipe's servings.
      type: object
      required:
        - ingredientId
        - name
        - value
        - unit
      properties:
        ingredientId:
          description: Unique identifier of the ingredient within its recipe, generated by the server.
          type: string
          format: uuid
        name:
          description: What the ingredient is, e.g. "Flour".
          type: string
          minLength: 1
          maxLength: 100
        value:
          description: Quantity of the ingredient, expressed in the given unit, e.g. 0.5.
          type: number
          exclusiveMinimum: 0
        unit:
          description: Unit of measurement the value is expressed in.
          $ref: '#/components/schemas/Unit'

    IngredientCreate:
      description: Data a cook supplies to add an ingredient; the identifier is set by the server.
      type: object
      required:
        - name
        - value
        - unit
      properties:
        name:
          description: What the ingredient is, e.g. "Flour".
          type: string
          minLength: 1
          maxLength: 100
        value:
          description: Quantity of the ingredient, expressed in the given unit, e.g. 0.5.
          type: number
          exclusiveMinimum: 0
        unit:
          description: Unit of measurement the value is expressed in.
          $ref: '#/components/schemas/Unit'

    IngredientUpdate:
      description: Partial update of an ingredient.
      type: object
      properties:
        name:
          description: What the ingredient is, e.g. "Flour".
          type: string
          minLength: 1
          maxLength: 100
        value:
          description: Quantity of the ingredient, expressed in the given unit, e.g. 0.5.
          type: number
          exclusiveMinimum: 0
        unit:
          description: Unit of measurement the value is expressed in.
          $ref: '#/components/schemas/Unit'

    HowToStep:
      description: One step of the recipe's preparation instructions.
      type: object
      required:
        - howToStepId
        - sequenceNumber
        - description
      properties:
        howToStepId:
          description: Unique identifier of the how-to step within its recipe, generated by the server.
          type: string
          format: uuid
        sequenceNumber:
          description: Position of the step in the preparation order, starting at 1 and unique within the recipe.
          type: integer
          minimum: 1
        description:
          description: Instruction the cook follows in this step, e.g. "Carefully mix the water with the flour".
          type: string
          minLength: 1
          maxLength: 2000
        illustration:
          description: Optional link to an image illustrating this step.
          type: [string, "null"]
          format: uri

    HowToStepCreate:
      description: Data a cook supplies to add a how-to step; the identifier is set by the server.
      type: object
      required:
        - sequenceNumber
        - description
      properties:
        sequenceNumber:
          description: Position of the step in the preparation order, starting at 1 and unique within the recipe.
          type: integer
          minimum: 1
        description:
          description: Instruction the cook follows in this step, e.g. "Carefully mix the water with the flour".
          type: string
          minLength: 1
          maxLength: 2000
        illustration:
          description: Optional link to an image illustrating this step.
          type: [string, "null"]
          format: uri

    HowToStepUpdate:
      description: Partial update of a how-to step.
      type: object
      properties:
        sequenceNumber:
          description: Position of the step in the preparation order, starting at 1 and unique within the recipe.
          type: integer
          minimum: 1
        description:
          description: Instruction the cook follows in this step, e.g. "Carefully mix the water with the flour".
          type: string
          minLength: 1
          maxLength: 2000
        illustration:
          description: Optional link to an image illustrating this step.
          type: [string, "null"]
          format: uri

    MealAssignment:
      description: The meal a recipe is assigned to.
      type: object
      required:
        - meal
      properties:
        meal:
          description: The meal of the day the recipe is intended for.
          $ref: '#/components/schemas/Meal'

    Meal:
      description: The meal of the day a recipe is intended for.
      type: string
      enum:
        - BREAKFAST
        - LUNCH
        - DINNER
        - SUPPER

    Diet:
      description: The diet a recipe is suitable for.
      type: string
      enum:
        - VEGETARIAN
        - VEGAN
        - NORMAL

    Unit:
      description: Unit of measurement for an ingredient quantity.
      type: string
      enum:
        - PIECE
        - CUP
        - TABLE_SPOON
        - TEA_SPOON
        - FLUID_OUNCES
        - PINT
        - QUART
        - POUND
        - KILOGRAM
        - GRAM
        - LITER
        - MILLILITER
        - PINCH

    Error:
      description: Error information returned with every non-success response.
      type: object
      required:
        - code
        - message
      properties:
        code:
          description: Machine-readable error code.
          type: string
        message:
          description: Human-readable explanation of the error.
          type: string
        details:
          description: Additional, error-specific information.
          type: object

  responses:
    RecipesResponse:
      description: List of recipes matching the search
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Recipe'

    RecipeResponse:
      description: Single recipe response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Recipe'

    RecipeLinkResponse:
      description: Link to the created or changed recipe
      content:
        application/json:
          schema:
            type: object
            required:
              - recipeLink
            properties:
              recipeLink:
                description: Link to the recipe resource.
                type: string
                format: uri

    IngredientsResponse:
      description: Ingredients of a recipe
      content:
        application/json:
          schema:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/Ingredient'

    IngredientResponse:
      description: Single ingredient response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Ingredient'

    IngredientLinkResponse:
      description: Link to the created or changed ingredient
      content:
        application/json:
          schema:
            type: object
            required:
              - ingredientLink
            properties:
              ingredientLink:
                description: Link to the ingredient resource within its recipe.
                type: string
                format: uri

    HowToStepsResponse:
      description: How-to steps of a recipe
      content:
        application/json:
          schema:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/HowToStep'

    HowToStepResponse:
      description: Single how-to step response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HowToStep'

    HowToStepLinkResponse:
      description: Link to the created or changed how-to step
      content:
        application/json:
          schema:
            type: object
            required:
              - howToStepLink
            properties:
              howToStepLink:
                description: Link to the how-to step resource within its recipe.
                type: string
                format: uri

    MealResponse:
      description: Meal of a recipe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MealAssignment'

    MealLinkResponse:
      description: Link to the recipe whose meal was changed
      content:
        application/json:
          schema:
            type: object
            required:
              - recipeMealLink
            properties:
              recipeMealLink:
                description: Link to the meal resource of the recipe.
                type: string
                format: uri

    BadRequestResponse:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnauthorizedResponse:
      description: Authentication missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ForbiddenResponse:
      description: Access forbidden, e.g. the caller is not the owner of the recipe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFoundResponse:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServiceNotAvailableResponse:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    DefaultErrorResponse:
      description: Unexpected error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  requestBodies:
    RecipeCreateRequest:
      description: Recipe creation request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecipeCreate'

    RecipeUpdateRequest:
      description: Recipe partial update request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RecipeUpdate'

    IngredientCreateRequest:
      description: Ingredient creation request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngredientCreate'

    IngredientUpdateRequest:
      description: Ingredient partial update request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IngredientUpdate'

    HowToStepCreateRequest:
      description: How-to step creation request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HowToStepCreate'

    HowToStepUpdateRequest:
      description: How-to step partial update request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HowToStepUpdate'

    MealUpdateRequest:
      description: Meal assignment request
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MealAssignment'

  securitySchemes:
    oAuth2:
      type: oauth2
      description: OAuth 2.0 Authorization Code Flow with PKCE
      flows:
        authorizationCode:
          authorizationUrl: https://larder.org/auth
          tokenUrl: https://larder.org/tokens
          refreshUrl: https://larder.org/refresh
          scopes:
            recipe:read: Grants read access to recipes and their parts
            recipe:write: Grants write access to create and change the caller's own recipes
            recipe:admin: Grants administrative access to all recipes