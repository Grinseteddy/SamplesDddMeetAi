asyncapi: 3.1.0
info:
  title: Task Management System
  version: 1.0.0
  description: |
    Async API specification for Task Management System that handles task lifecycle 
    between Creators, Freelancers, and Assignees.
    The API evolves additively within a major version: consumers must ignore
    unknown message types, unknown properties and unknown enumeration values.
  contact:
    name: Task Management Team
    url: https://taskmanagement.org
    email: team@taskmanagement.org

servers:
  production:
    host: "events.taskmanagement.com:9092"
    protocol: "kafka"
    description: "Production broker"
    security:
      - $ref: '#/components/securitySchemes/user-password'

defaultContentType: application/json

channels:
  taskEvents:
    address: "task-management/tasks"
    messages:
      taskCreated:
        $ref: '#/components/messages/taskCreated'
      taskAssigned:
        $ref: '#/components/messages/taskAssigned'
      taskProcessed:
        $ref: '#/components/messages/taskProcessed'
      taskCompleted:
        $ref: '#/components/messages/taskCompleted'

operations:
  publishTaskCreated:
    action: send
    description: |
      Published once when a creator has created a task. Starts the task lifecycle (status NEW).
    channel:
      $ref: '#/channels/taskEvents'
    messages:
      - $ref: '#/channels/taskEvents/messages/taskCreated'

  publishTaskAssigned:
    action: send
    description: |
      Published when a freelancer has accepted a task and named its assignee (status ASSIGNED).
    channel:
      $ref: '#/channels/taskEvents'
    messages:
      - $ref: '#/channels/taskEvents/messages/taskAssigned'

  publishTaskProcessed:
    action: send
    description: |
      Published each time the assignee reports progress on a task (status IN_PROGRESS); may occur several times per task.
    channel:
      $ref: '#/channels/taskEvents'
    messages:
      - $ref: '#/channels/taskEvents/messages/taskProcessed'

  publishTaskCompleted:
    action: send
    description: |
      Published once when a task has been marked as done (status DONE). Ends the task lifecycle.
    channel:
      $ref: '#/channels/taskEvents'
    messages:
      - $ref: '#/channels/taskEvents/messages/taskCompleted'

components:
  messages:
    taskCreated:
      name: TaskCreated
      title: Task Created Event
      summary: Indicates that a new task has been created
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/TaskCreatedPayload'
      examples:
        - name: newTaskCreated
          summary: A creator files a new translation task.
          headers:
            correlationId: 7d0c7a6e-4b8e-4a8b-9a43-1f0b8f9d2c11
            messageId: 2b9f1c3e-5d6a-4e7f-8a9b-0c1d2e3f4a5b
            source: task-service
          payload:
            taskId: 5f1d2c3b-4a59-4e6f-8d7c-9b0a1e2f3d4c
            title: Translate product sheet
            status: NEW
            dueDate: "2026-11-02T17:00:00Z"
            creatorId: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d

    taskAssigned:
      name: TaskAssigned
      title: Task Assigned Event
      summary: Indicates that a task has been assigned to a freelancer
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/TaskAssignedPayload'
      examples:
        - name: taskAssignedToAssignee
          summary: A freelancer accepts the task and names the assignee.
          headers:
            correlationId: 7d0c7a6e-4b8e-4a8b-9a43-1f0b8f9d2c11
            messageId: 3c0a2d4f-6e7b-4f80-9bac-1d2e3f4a5b6c
            source: task-service
          payload:
            taskId: 5f1d2c3b-4a59-4e6f-8d7c-9b0a1e2f3d4c
            freelancerId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            assigneeId: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            status: ASSIGNED

    taskProcessed:
      name: TaskProcessed
      title: Task Processed Event
      summary: Indicates that a task is being processed
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/TaskProcessedPayload'
      examples:
        - name: taskHalfDone
          summary: The assignee reports half of the work done.
          headers:
            correlationId: 7d0c7a6e-4b8e-4a8b-9a43-1f0b8f9d2c11
            messageId: 4d1b3e5a-7f8c-4091-acbd-2e3f4a5b6c7d
            source: task-service
          payload:
            taskId: 5f1d2c3b-4a59-4e6f-8d7c-9b0a1e2f3d4c
            status: IN_PROGRESS
            progress: 50

    taskCompleted:
      name: TaskCompleted
      title: Task Completed Event
      summary: Indicates that a task has been completed
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/TaskCompletedPayload'
      examples:
        - name: taskDone
          summary: The assignee marks the task as done.
          headers:
            correlationId: 7d0c7a6e-4b8e-4a8b-9a43-1f0b8f9d2c11
            messageId: 5e2c4f6b-8a9d-41a2-bdce-3f4a5b6c7d8e
            source: task-service
          payload:
            taskId: 5f1d2c3b-4a59-4e6f-8d7c-9b0a1e2f3d4c
            status: DONE
            completedBy: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
            completedAt: "2026-10-30T15:42:00Z"

  schemas:
    MessageHeader:
      description: Tracing and routing metadata shared by every message of this API.
      type: object
      required:
        - correlationId
        - messageId
        - source
      properties:
        correlationId:
          type: string
          format: uuid
          description: Identifier to trace end-to-end task journey
        messageId:
          type: string
          format: uuid
          description: Unique identifier for this message
        source:
          type: string
          description: Source system generating the event
          minLength: 2
          maxLength: 20

    TaskCreatedPayload:
      description: Facts about a task at the moment the creator created it.
      type: object
      required:
        - taskId
        - title
        - status
        - creatorId
      properties:
        taskId:
          description: Identifier of the task this event is about; also the partition key that keeps a task's events in order.
          type: string
          format: uuid
        title:
          description: Short name of the task as the creator entered it.
          type: string
          minLength: 1
          maxLength: 200
        description:
          description: Free-text explanation of what the task requires.
          type: string
          maxLength: 2000
        status:
          description: Lifecycle state after creation; always NEW for this event.
          type: string
          enum: [NEW]
        dueDate:
          description: Date and time by which the creator expects the task to be completed.
          type: string
          format: date-time
        creatorId:
          description: Identifier of the creator who created the task.
          type: string
          format: uuid
        inboxId:
          description: Identifier of the inbox the new task was placed in, if any.
          type: string
          format: uuid

    TaskAssignedPayload:
      description: Facts about who took on a task and who will carry it out.
      type: object
      required:
        - taskId
        - freelancerId
        - assigneeId
        - status
      properties:
        taskId:
          description: Identifier of the task this event is about; also the partition key that keeps a task's events in order.
          type: string
          format: uuid
        freelancerId:
          description: Identifier of the freelancer who accepted the task.
          type: string
          format: uuid
        assigneeId:
          description: Identifier of the assignee who will carry out the task.
          type: string
          format: uuid
        status:
          description: Lifecycle state after assignment; always ASSIGNED for this event.
          type: string
          enum: [ASSIGNED]

    TaskProcessedPayload:
      description: Progress report for a task that is being worked on.
      type: object
      required:
        - taskId
        - status
      properties:
        taskId:
          description: Identifier of the task this event is about; also the partition key that keeps a task's events in order.
          type: string
          format: uuid
        status:
          description: Lifecycle state while work is ongoing; always IN_PROGRESS for this event.
          type: string
          enum: [IN_PROGRESS]
        progress:
          description: Share of the work done so far, in percent, as reported by the assignee.
          type: integer
          minimum: 0
          maximum: 100

    TaskCompletedPayload:
      description: Facts about a task at the moment it was marked as done.
      type: object
      required:
        - taskId
        - status
        - completedBy
      properties:
        taskId:
          description: Identifier of the task this event is about; also the partition key that keeps a task's events in order.
          type: string
          format: uuid
        status:
          description: Lifecycle state after completion; always DONE for this event.
          type: string
          enum: [DONE]
        completedBy:
          description: Identifier of the person who marked the task as done.
          type: string
          format: uuid
        completedAt:
          description: Date and time at which the task was marked as done.
          type: string
          format: date-time

  securitySchemes:
    user-password:
      type: userPassword
      description: Basic authentication for event broker
