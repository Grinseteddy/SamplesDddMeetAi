openapi: 3.1.0
info:
  title: Cook Assistance – Help API
  description: |
    Lets cooks ask the community, the Grandma Avatar or — for meal planning — a Chef for help with a
    menu, a preparation step, an ingredient or a kitchen catastrophe, and lets the addressed helpers
    answer. The requester accepts or rejects each help; accepting closes the request, and a request
    nobody answers in time is cancelled by the system. Used by the Larder cooking apps and by
    helper tools. The Grandma Avatar answers through messages, not through this API.

    Derived from the Cook Assistance design brief, invariants sheet (INV-nn) and slice plan
    (B<board>-S<slice>) of the implementation blueprint; every operation names the slices and rules
    it serves. Version 2.0.0 replaces 1.0.0 ("Cooking Assistance – Help API"), which is deprecated
    and sunsets on 2027-04-30.

    Errors are RFC 9457 Problem Details (`application/problem+json`) with the extensions `code` and
    `rule`. An undeclared path answers 404, an undeclared method 405 with `Allow`, an undeclared
    content type 415 and an unparsable body 400 — always as a Problem.

    The API evolves additively within a major version: clients must ignore unknown response fields
    and handle unknown enumeration values in responses.
  version: 2.0.0
  contact:
    name: Annegret Junker
  x-api-id: 75b96609-03bd-48b3-8f3f-db38fc964122
  x-audience: external-public

servers:
  - url: 'https://larder.org/cooking-assistance'

security:
  - oAuth2:
      - cooking-assistance:read
      - cooking-assistance:write
      - cooking-assistance:admin

tags:
  - name: Help Requests
    description: |
      A cook asks for help on one topic, follows the request (REQUESTED, CLOSED, CANCELLED),
      cancels it or asks a Chef to review a Grandma Avatar menu. Aggregate root `HelpRequest`.
  - name: Helps
    description: |
      An addressed helper answers a help request; the requester accepts or rejects the answer.
      Aggregate root `Help`.

paths:
  /help-requests:
    post:
      operationId: requestHelp
      tags:
        - Help Requests
      summary: Request help
      description: |
        A cook asks for help on one topic. Slices B1-S01 (Menu), B2-S01 (Preparation step),
        B3-S01 (Ingredients), B4-S01 (Catastrophe). The server assigns the `helpRequestId`, takes
        the `requester` from the authenticated cook, sets the status to `REQUESTED` and starts the
        answer deadline (Menu 48 h, Ingredients 24 h, Catastrophe 10 min, Preparation step 5 h).

        Refused with `403` and code `PremiumRequiredForChef` when a cook who is not premium
        addresses a Chef (INV-02). Refused with `422` and the rule as `code`:
        - `QuestionRequired` — the cook's question is missing (INV-19).
        - `RecipeRequired` — a recipe is required for Preparation step, Ingredients and
          Catastrophe (INV-17, INV-21, INV-23).
        - `StepRequired` — Preparation step needs exactly one step (INV-17).
        - `StepNotInRecipe` — the named step does not exist in the recipe (INV-18, INV-23).
        - `IngredientRequired` — Ingredients needs exactly one ingredient (INV-21).
        - `IngredientNotInRecipe` — the ingredient does not exist in the recipe (INV-22).
        - `AddresseeRequired` — at least one addressee (INV-20).
        - `ChefOnlyForMenu` — a Chef can only be asked for meal planning (INV-01, INV-20).
        - `ChefMustBeExclusive` — a Chef is never addressed together with others (SADR0001).
        - `ChefRequired` — a Chef-addressed Menu request names exactly one Chef (INV-03).
        - `ChefNotLocal`, `ChefNotTimelyAvailable` — the selected Chef is not in the cook's city or
          not free before the planned meal (INV-03).
        - `PicturesOnlyForCatastrophe`, `TooManyPictures` — 0 to 10 pictures, Catastrophe only
          (INV-24).
        - `TopicNotYetSupported` — the service does not serve this topic yet (rule `null`); topics
          are added one at a time, Preparation step first.

        Refused with `409` and code `ConcurrencyConflict` in the rare case that the generated
        identity is already taken (ADR-CA-005); the client may retry.
      security:
        - oAuth2:
            - cooking-assistance:write
      parameters:
        - $ref: '#/components/parameters/VersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/HelpRequestCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/HelpRequestCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeResponse'
        '422':
          $ref: '#/components/responses/DomainRuleViolationResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

    get:
      operationId: listHelpRequests
      tags:
        - Help Requests
      summary: List help requests
      description: |
        Retrieve a page of help requests (read model "Help request"), optionally filtered by
        status, topic, addressee or requester. Helpers use it to find requests addressed to them
        that are still `REQUESTED`; cooks use it with `requester` to follow their own requests.
        An empty result is a `200` with no items.
      parameters:
        - $ref: '#/components/parameters/VersionParameter'
        - $ref: '#/components/parameters/StatusParameter'
        - $ref: '#/components/parameters/TopicParameter'
        - $ref: '#/components/parameters/AddresseeParameter'
        - $ref: '#/components/parameters/RequesterParameter'
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/SizeParameter'
      responses:
        '200':
          $ref: '#/components/responses/HelpRequestPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /help-requests/{helpRequestId}:
    get:
      operationId: getHelpRequestById
      tags:
        - Help Requests
      summary: Get a help request by ID
      description: |
        Retrieve a single help request (read model "Help request") including its status and its
        answer deadline.
      parameters:
        - $ref: '#/components/parameters/HelpRequestIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/HelpRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /help-requests/{helpRequestId}/cancellation:
    post:
      operationId: cancelHelpRequest
      tags:
        - Help Requests
      summary: Cancel a help request
      description: |
        The requester cancels their help request at any time while it is `REQUESTED`
        (slice B1-S06). `CANCELLED` is terminal. The system cancels a request the same way when
        its answer deadline passes (slice B1-S07, not exposed).

        Refused with `403` and code `NotTheRequester` (INV-06), and with `409` and code
        `HelpRequestNotRequested` when the request is already closed or cancelled (INV-05).

        Returns `200` with the updated help request, because the cancellation is a state
        transition and not a new resource.
      security:
        - oAuth2:
            - cooking-assistance:write
      parameters:
        - $ref: '#/components/parameters/HelpRequestIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/HelpRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /help-requests/{helpRequestId}/chef-review:
    post:
      operationId: requestChefReview
      tags:
        - Help Requests
      summary: Ask a Chef to review a Grandma Avatar menu
      description: |
        The requester asks one Chef to review a menu the Grandma Avatar proposed for one of the
        cook's own Menu requests (slice B1-S02). The request stays `REQUESTED`; the Chef answers
        through `provideHelp`.

        Refused with `403` and code `NotTheRequester` (INV-04) or `PremiumRequiredForChef`
        (INV-02); with `409` and code `HelpRequestNotRequested` (INV-05); with `422` and code
        `NoGrandmaAvatarMenuToReview` (INV-04), `ChefNotLocal` or `ChefNotTimelyAvailable`
        (INV-03).

        Returns `200` with the updated help request.
      security:
        - oAuth2:
            - cooking-assistance:write
      parameters:
        - $ref: '#/components/parameters/HelpRequestIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/ChefReviewCreateRequest'
      responses:
        '200':
          $ref: '#/components/responses/HelpRequestResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeResponse'
        '422':
          $ref: '#/components/responses/DomainRuleViolationResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /help-requests/{helpRequestId}/helps:
    post:
      operationId: provideHelp
      tags:
        - Helps
      summary: Provide help for a help request
      description: |
        An addressed community cook or Chef answers a help request (slice B1-S03). The server
        assigns the `helpId`, copies the `helpRequester` from the request, takes the provider and
        its type from the authenticated caller and sets the status to `PROVIDED`. The Grandma
        Avatar answers through the `grandma-avatar.help.provided` message instead (slice B1-S04).

        Refused with `403` and code `NotAnAddressee` — the caller's provider type was not
        addressed, or a Chef who was not selected (INV-09). Refused with `409` and code
        `HelpRequestNotRequested` when the request is closed or cancelled (INV-11). Refused with
        `422` and the rule as `code`:
        - `AnswerTopicNotAsRequested` — the answer's topic must equal the request's (INV-10).
        - `RecipeNotAsInRequest`, `StepNotAsInRequest`, `IngredientNotAsInRequest` — same recipe,
          step or ingredient as the request (INV-10).
        - `SubstituteCountOutOfRange` — 1 to 3 substitutes (INV-12).
      security:
        - oAuth2:
            - cooking-assistance:write
      parameters:
        - $ref: '#/components/parameters/HelpRequestIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      requestBody:
        $ref: '#/components/requestBodies/HelpCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/HelpCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '415':
          $ref: '#/components/responses/UnsupportedMediaTypeResponse'
        '422':
          $ref: '#/components/responses/DomainRuleViolationResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

    get:
      operationId: listHelpsForHelpRequest
      tags:
        - Helps
      summary: List the helps for a help request
      description: |
        Retrieve a page of the helps given to one help request (read model "Help"), optionally
        filtered by status. A help given by a Chef is visible only to the original requester.
        Answered with `404` when the help request does not exist.
      parameters:
        - $ref: '#/components/parameters/HelpRequestIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
        - $ref: '#/components/parameters/HelpStatusParameter'
        - $ref: '#/components/parameters/PageParameter'
        - $ref: '#/components/parameters/SizeParameter'
      responses:
        '200':
          $ref: '#/components/responses/HelpPageResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /helps/{helpId}:
    get:
      operationId: getHelpById
      tags:
        - Helps
      summary: Get a help by ID
      description: |
        Retrieve a single help (read model "Help") including its answer, its status and a link to
        the help request it answers. A help given by a Chef is visible only to the original
        requester.
      parameters:
        - $ref: '#/components/parameters/HelpIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/HelpResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /helps/{helpId}/acceptance:
    post:
      operationId: acceptHelp
      tags:
        - Helps
      summary: Accept a help
      description: |
        The requester accepts a help (slice B1-S05). The help becomes `ACCEPTED` (terminal); its
        help request is then closed by the service (slice B1-S08, INV-14) — shortly after, not in
        the same response.

        Refused with `403` and code `NotTheRequester`, and with `409` and code `HelpNotProvided`
        when the help is already accepted or rejected (INV-13).

        Returns `200` with the updated help.
      security:
        - oAuth2:
            - cooking-assistance:write
      parameters:
        - $ref: '#/components/parameters/HelpIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/HelpResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

  /helps/{helpId}/rejection:
    post:
      operationId: rejectHelp
      tags:
        - Helps
      summary: Reject a help
      description: |
        The requester rejects a help (slice B1-S09). The help becomes `REJECTED` (terminal; it can
        never be accepted later), and the answer deadline of its help request restarts
        (slice B1-S10, INV-08).

        Refused with `403` and code `NotTheRequester`, and with `409` and code `HelpNotProvided`
        when the help is already accepted or rejected (INV-15).

        Returns `200` with the updated help.
      security:
        - oAuth2:
            - cooking-assistance:write
      parameters:
        - $ref: '#/components/parameters/HelpIdParameter'
        - $ref: '#/components/parameters/VersionParameter'
      responses:
        '200':
          $ref: '#/components/responses/HelpResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '409':
          $ref: '#/components/responses/ConflictResponse'
        '500':
          $ref: '#/components/responses/InternalErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailableResponse'

components:
  parameters:
    HelpRequestIdParameter:
      name: helpRequestId
      in: path
      required: true
      description: Unique identifier of the help request.
      schema:
        type: string
        format: uuid
      example: 3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c0d

    HelpIdParameter:
      name: helpId
      in: path
      required: true
      description: Unique identifier of the help.
      schema:
        type: string
        format: uuid
      example: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e

    StatusParameter:
      name: status
      in: query
      required: false
      description: Only return help requests in this status.
      schema:
        $ref: '#/components/schemas/HelpRequestStatus'

    TopicParameter:
      name: topic
      in: query
      required: false
      description: Only return help requests on this topic.
      schema:
        $ref: '#/components/schemas/HelpTopic'

    AddresseeParameter:
      name: addressee
      in: query
      required: false
      description: Only return help requests addressed to this kind of helper.
      schema:
        $ref: '#/components/schemas/HelpProviderType'

    RequesterParameter:
      name: requester
      in: query
      required: false
      description: Only return help requests raised by this cook (Cook Profile context).
      schema:
        type: string
        format: uuid

    HelpStatusParameter:
      name: status
      in: query
      required: false
      description: Only return helps in this status.
      schema:
        $ref: '#/components/schemas/HelpStatus'

    PageParameter:
      name: page
      in: query
      required: false
      description: Zero-based number of the page to return.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0

    SizeParameter:
      name: size
      in: query
      required: false
      description: Maximum number of entries on one page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

    VersionParameter:
      name: version
      in: header
      required: true
      description: Version of the API contract the client was built against.
      schema:
        type: string
        default: "2.0.0"
        enum: ["2.0.0"]

  headers:
    AgeHeader:
      description: |
        Present only when the response was served from the service's cache because the database was
        unreachable (ADR-CA-013): seconds since the cached representation was read. The data may be stale.
      schema:
        type: integer
        minimum: 0
    LocationHeader:
      description: URI of the newly created resource.
      schema:
        type: string
        format: uri

  schemas:
    # ---- shared enums --------------------------------------------------------
    HelpTopic:
      description: |
        What the cook needs help with — the discriminator of help requests and of answers. In
        responses, new values may be added — treat an unknown value as a topic the client cannot
        display in detail.
      type: string
      enum:
        - MENU
        - PREPARATION_STEP
        - INGREDIENTS
        - CATASTROPHE

    HelpProviderType:
      description: |
        Who may answer: the community, the Grandma Avatar, or a Chef (meal planning only). Called
        `addressees` on a help request and `helpProviderType` on a help. In responses, new values
        may be added — treat an unknown value as `COMMUNITY`.
      type: string
      enum:
        - COMMUNITY
        - GRANDMA_AVATAR
        - CHEF

    HelpRequestStatus:
      description: |
        Lifecycle of a help request. `REQUESTED` — waiting for an answer the cook accepts; it can
        collect several helps. `CLOSED` — a help was accepted (terminal). `CANCELLED` — the cook
        cancelled it, or nobody answered before the deadline (terminal). New values may be added;
        treat an unknown value as "no help can be provided".
      type: string
      enum:
        - REQUESTED
        - CLOSED
        - CANCELLED

    HelpStatus:
      description: |
        Lifecycle of a help. `PROVIDED` — waiting for the requester's decision. `ACCEPTED` and
        `REJECTED` — the requester's decision (both terminal). New values may be added.
      type: string
      enum:
        - PROVIDED
        - ACCEPTED
        - REJECTED

    Unit:
      description: Unit of measure of a substitute ingredient — the closed set drawn on the Help glossary.
      type: string
      enum:
        - PIECE
        - CUP
        - TABLE_SPOON
        - TEA_SPOON
        - FLUID_OUNCES
        - PINT
        - QUART
        - POUND
        - KILOGRAM
        - GRAM
        - LITER
        - MILLILITER
        - PINCH

    Meal:
      description: The meal a menu proposal is meant for.
      type: string
      enum:
        - BREAKFAST
        - LUNCH
        - DINNER
        - SUPPER

    # ---- Help Request --------------------------------------------------------
    HelpRequest:
      description: A cook's request for help on one topic, with its current status.
      type: object
      required:
        - helpRequestId
        - requester
        - title
        - topic
        - description
        - addressees
        - pictures
        - status
        - answerDeadline
        - createdAt
        - updatedAt
        - selfLink
        - helpsLink
      properties:
        helpRequestId:
          description: Unique identifier of the help request, generated by the server.
          type: string
          format: uuid
        requester:
          description: The cook who asks for help, taken from the authenticated caller (Cook Profile context).
          type: string
          format: uuid
        title:
          description: Short headline of what the cook needs help with.
          type: string
          minLength: 1
          maxLength: 200
        topic:
          description: What the cook needs help with; every answer has the same topic.
          $ref: '#/components/schemas/HelpTopic'
        description:
          description: The cook's question in their own words.
          type: string
          minLength: 1
          maxLength: 4000
        recipeId:
          description: |
            The recipe the request is about (Recipe Catalog context). Present for Preparation step,
            Ingredients and Catastrophe.
          type: [string, "null"]
          format: uuid
        howToStepId:
          description: |
            The one recipe step the request is about (Recipe Catalog context). Present for
            Preparation step; optional for Catastrophe.
          type: [string, "null"]
          format: uuid
        ingredientId:
          description: The one ingredient the cook needs a substitute for (Recipe Catalog context). Only for Ingredients.
          type: [string, "null"]
          format: uuid
        addressees:
          description: |
            Who may answer — the community and/or the Grandma Avatar, or exactly one Chef for a Menu
            request.
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/HelpProviderType'
        chefId:
          description: The Chef the cook selected (Menu requests addressed to a Chef only).
          type: [string, "null"]
          format: uuid
        plannedMealDate:
          description: The date of the meal the menu is planned for (Menu requests addressed to a Chef only).
          type: [string, "null"]
          format: date
        pictures:
          description: Links to pictures of the mishap, held by the Media context (Catastrophe only, 0 to 10).
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        status:
          description: Where the help request stands in its lifecycle, maintained by the server.
          $ref: '#/components/schemas/HelpRequestStatus'
        answerDeadline:
          description: |
            When the system cancels the request if it is still `REQUESTED` — the request time, or
            the last rejection, plus the topic's timeout.
          type: string
          format: date-time
        createdAt:
          description: Timestamp when the cook raised the request, set by the server.
          type: string
          format: date-time
        updatedAt:
          description: Timestamp of the last change, set by the server.
          type: string
          format: date-time
        selfLink:
          description: Link to this help request.
          type: string
          format: uri
        helpsLink:
          description: Link to the helps given to this help request.
          type: string
          format: uri
      examples:
        - helpRequestId: 3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c0d
          requester: 8a2b4c6d-1e3f-4a5b-8c7d-9e0f1a2b3c4d
          title: Sunday scones, step 3
          topic: PREPARATION_STEP
          description: What means "warm"?
          recipeId: c4d5e6f7-8a9b-4c0d-9e1f-2a3b4c5d6e7f
          howToStepId: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
          ingredientId: null
          addressees:
            - COMMUNITY
            - GRANDMA_AVATAR
          chefId: null
          plannedMealDate: null
          pictures: []
          status: REQUESTED
          answerDeadline: '2026-10-24T15:00:00Z'
          createdAt: '2026-10-24T10:00:00Z'
          updatedAt: '2026-10-24T10:00:00Z'
          selfLink: https://larder.org/cooking-assistance/help-requests/3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c0d
          helpsLink: https://larder.org/cooking-assistance/help-requests/3f1c9a52-7d4e-4b8a-9c21-5e6f7a8b9c0d/helps

    HelpRequestCreate:
      description: |
        What a cook supplies when requesting help. `helpRequestId`, `requester`, `status` and
        `answerDeadline` are set by the server. The conditional rules below mirror the invariants;
        the server checks them as well (and the ones a schema cannot express, such as a step that
        exists in the recipe) and answers `422`.
      type: object
      required:
        - title
        - topic
        - description
        - addressees
      properties:
        title:
          description: Short headline of what the cook needs help with.
          type: string
          minLength: 1
          maxLength: 200
        topic:
          description: What the cook needs help with.
          $ref: '#/components/schemas/HelpTopic'
        description:
          description: The cook's question in their own words (INV-19).
          type: string
          minLength: 1
          maxLength: 4000
        recipeId:
          description: The recipe the request is about; required for Preparation step, Ingredients and Catastrophe.
          type: [string, "null"]
          format: uuid
        howToStepId:
          description: The one recipe step; required for Preparation step, optional for Catastrophe.
          type: [string, "null"]
          format: uuid
        ingredientId:
          description: The one ingredient to substitute; required for Ingredients.
          type: [string, "null"]
          format: uuid
        addressees:
          description: Who may answer — community and/or Grandma Avatar, or exactly one Chef for Menu (INV-20).
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/HelpProviderType'
        chefId:
          description: The selected Chef; required when a Chef is addressed (INV-03).
          type: [string, "null"]
          format: uuid
        plannedMealDate:
          description: The date of the planned meal; required when a Chef is addressed (INV-03).
          type: [string, "null"]
          format: date
        pictures:
          description: Links to pictures in the Media context; Catastrophe only, 0 to 10 (INV-24).
          type: array
          maxItems: 10
          default: []
          items:
            type: string
            format: uri
      allOf:
        - description: "INV-17, INV-21, INV-23: a recipe is required for every topic except Menu."
          if:
            required:
              - topic
            properties:
              topic:
                description: The topic of the request.
                not:
                  const: MENU
          then:
            required:
              - recipeId
            properties:
              recipeId:
                description: Must be given for this topic.
                type: string
                format: uuid
        - description: "INV-17: Preparation step needs exactly one step."
          if:
            required:
              - topic
            properties:
              topic:
                description: The topic of the request.
                const: PREPARATION_STEP
          then:
            required:
              - howToStepId
            properties:
              howToStepId:
                description: Must be given for a preparation step.
                type: string
                format: uuid
        - description: "A step only belongs to Preparation step and Catastrophe."
          if:
            required:
              - topic
            properties:
              topic:
                description: The topic of the request.
                enum:
                  - MENU
                  - INGREDIENTS
          then:
            properties:
              howToStepId:
                description: Must stay empty for this topic.
                type: "null"
        - description: "INV-21: Ingredients needs exactly one ingredient; no ingredient otherwise."
          if:
            required:
              - topic
            properties:
              topic:
                description: The topic of the request.
                const: INGREDIENTS
          then:
            required:
              - ingredientId
            properties:
              ingredientId:
                description: Must be given for Ingredients.
                type: string
                format: uuid
          else:
            properties:
              ingredientId:
                description: Must stay empty for any other topic.
                type: "null"
        - description: "INV-24: pictures only for Catastrophe."
          if:
            required:
              - topic
            properties:
              topic:
                description: The topic of the request.
                not:
                  const: CATASTROPHE
          then:
            properties:
              pictures:
                description: Must stay empty for any other topic.
                maxItems: 0
        - description: "INV-01, INV-03, SADR0001: a Chef only for Menu, exclusively, with the selected Chef and the meal date."
          if:
            required:
              - addressees
            properties:
              addressees:
                description: Who may answer.
                contains:
                  const: CHEF
          then:
            required:
              - chefId
              - plannedMealDate
            properties:
              addressees:
                description: A Chef is the only addressee.
                maxItems: 1
              topic:
                description: Chefs answer meal-planning requests only.
                const: MENU
              chefId:
                description: The selected Chef.
                type: string
                format: uuid
              plannedMealDate:
                description: The date of the planned meal.
                type: string
                format: date
      examples:
        - title: Sunday scones, step 3
          topic: PREPARATION_STEP
          description: What means "warm"?
          recipeId: c4d5e6f7-8a9b-4c0d-9e1f-2a3b4c5d6e7f
          howToStepId: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
          addressees:
            - COMMUNITY
            - GRANDMA_AVATAR
        - title: Burned scones
          topic: CATASTROPHE
          description: My Sunday scones are burned — can I still serve them?
          recipeId: c4d5e6f7-8a9b-4c0d-9e1f-2a3b4c5d6e7f
          addressees:
            - GRANDMA_AVATAR
          pictures:
            - https://larder.org/media/pictures/0f1e2d3c-4b5a-4968-8776-655443322110
        - title: Dinner planning
          topic: MENU
          description: Dinner for six on 30 October, one guest is vegetarian.
          addressees:
            - CHEF
          chefId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
          plannedMealDate: '2026-10-30'

    ChefReviewCreate:
      description: What a cook supplies when asking a Chef to review a Grandma Avatar menu.
      type: object
      required:
        - helpId
        - chefId
      properties:
        helpId:
          description: The Grandma Avatar help (a menu proposal) on this request that the Chef should review.
          type: string
          format: uuid
        chefId:
          description: The Chef who should review it.
          type: string
          format: uuid
      examples:
        - helpId: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e
          chefId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f

    HelpRequestPage:
      description: One page of help requests.
      type: object
      required:
        - items
        - page
      properties:
        items:
          description: The help requests on this page.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/HelpRequest'
        page:
          description: Position of this page within the whole result.
          $ref: '#/components/schemas/PageInfo'

    # ---- Help ----------------------------------------------------------------
    Help:
      description: One answer to one help request.
      type: object
      required:
        - helpId
        - helpRequestId
        - helpRequester
        - answerTitle
        - helpProviderType
        - answer
        - status
        - createdAt
        - updatedAt
        - selfLink
        - helpRequestLink
      properties:
        helpId:
          description: Unique identifier of the help, generated by the server.
          type: string
          format: uuid
        helpRequestId:
          description: The help request this help answers (exactly one, INV-16).
          type: string
          format: uuid
        helpRequester:
          description: The cook who asked for help, copied from the help request.
          type: string
          format: uuid
        answerTitle:
          description: Short headline of the answer.
          type: string
          minLength: 1
          maxLength: 200
        helpProviderType:
          description: Whether the help comes from the community, the Grandma Avatar or a Chef.
          $ref: '#/components/schemas/HelpProviderType'
        helpProvider:
          description: The cook or Chef who provided the help; empty when the Grandma Avatar answers.
          type: [string, "null"]
          format: uuid
        answer:
          description: The content of the help — exactly one answer of the request's topic.
          $ref: '#/components/schemas/Answer'
        status:
          description: Whether the requester has accepted or rejected the help yet.
          $ref: '#/components/schemas/HelpStatus'
        createdAt:
          description: Timestamp when the help was provided, set by the server.
          type: string
          format: date-time
        updatedAt:
          description: Timestamp of the requester's decision, or of the creation, set by the server.
          type: string
          format: date-time
        selfLink:
          description: Link to this help.
          type: string
          format: uri
        helpRequestLink:
          description: Link to the help request this help answers.
          type: string
          format: uri
      examples:
        - helpId: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e
          helpRequestId: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
          helpRequester: 8a2b4c6d-1e3f-4a5b-8c7d-9e0f1a2b3c4d
          answerTitle: Wheat flour without wheat flour
          helpProviderType: COMMUNITY
          helpProvider: 9d8c7b6a-5f4e-4d3c-8b2a-1f0e9d8c7b6a
          answer:
            topic: INGREDIENTS
            recipeId: c4d5e6f7-8a9b-4c0d-9e1f-2a3b4c5d6e7f
            ingredientId: e1f2a3b4-c5d6-4e7f-8a9b-0c1d2e3f4a5b
            substitutes:
              - name: Rye flour
                value: 150
                unit: GRAM
              - name: Wheat pastry flour
                value: 100
                unit: GRAM
          status: PROVIDED
          createdAt: '2026-10-24T11:12:00Z'
          updatedAt: '2026-10-24T11:12:00Z'
          selfLink: https://larder.org/cooking-assistance/helps/5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e
          helpRequestLink: https://larder.org/cooking-assistance/help-requests/9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b

    HelpCreate:
      description: |
        What a community cook or a Chef supplies when providing help. `helpId`, `helpRequestId`
        (from the path), `helpRequester`, `helpProvider`, `helpProviderType` (from the caller) and
        `status` are set by the server.
      type: object
      required:
        - answerTitle
        - answer
      properties:
        answerTitle:
          description: Short headline of the answer.
          type: string
          minLength: 1
          maxLength: 200
        answer:
          description: The content of the help; its topic must equal the request's topic.
          $ref: '#/components/schemas/Answer'
      examples:
        - answerTitle: Warm means about 30 °C
          answer:
            topic: PREPARATION_STEP
            recipeId: c4d5e6f7-8a9b-4c0d-9e1f-2a3b4c5d6e7f
            howToStepId: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
            description: Put the bowl next to the heater or in the oven with only the light on — about 30 °C.

    HelpPage:
      description: One page of helps.
      type: object
      required:
        - items
        - page
      properties:
        items:
          description: The helps on this page.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Help'
        page:
          description: Position of this page within the whole result.
          $ref: '#/components/schemas/PageInfo'

    Answer:
      description: |
        The content of a help — exactly one of four kinds, told apart by `topic`, which must equal
        the request's topic.
      oneOf:
        - $ref: '#/components/schemas/MenuProposal'
        - $ref: '#/components/schemas/PreparationStepExplanation'
        - $ref: '#/components/schemas/IngredientSubstitutes'
        - $ref: '#/components/schemas/CatastropheMitigation'
      discriminator:
        propertyName: topic
        mapping:
          MENU: '#/components/schemas/MenuProposal'
          PREPARATION_STEP: '#/components/schemas/PreparationStepExplanation'
          INGREDIENTS: '#/components/schemas/IngredientSubstitutes'
          CATASTROPHE: '#/components/schemas/CatastropheMitigation'

    IngredientSubstitutes:
      description: The answer to an Ingredients request — what to use instead of the one ingredient.
      type: object
      required:
        - topic
        - recipeId
        - ingredientId
        - substitutes
      properties:
        topic:
          description: Marks this answer as an ingredient substitute.
          type: string
          const: INGREDIENTS
        recipeId:
          description: The recipe; must be the same recipe as in the request (INV-10).
          type: string
          format: uuid
        ingredientId:
          description: The ingredient replaced; must be the same ingredient as in the request (INV-10).
          type: string
          format: uuid
        substitutes:
          description: One to three ingredients that together replace it (INV-12).
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/SubstituteIngredient'

    SubstituteIngredient:
      description: An ingredient to use instead, with its quantity — name, value and unit always travel together.
      type: object
      required:
        - name
        - value
        - unit
      properties:
        name:
          description: Name of the replacement ingredient, as the helper writes it.
          type: string
          minLength: 1
          maxLength: 200
        value:
          description: Quantity of the replacement ingredient; greater than zero.
          type: number
          exclusiveMinimum: 0
        unit:
          description: Unit the quantity is measured in.
          $ref: '#/components/schemas/Unit'

    PreparationStepExplanation:
      description: The answer to a Preparation step request — how to perform the one recipe step.
      type: object
      required:
        - topic
        - recipeId
        - howToStepId
        - description
      properties:
        topic:
          description: Marks this answer as a preparation step explanation.
          type: string
          const: PREPARATION_STEP
        recipeId:
          description: The recipe the step belongs to; must be the same recipe as in the request (INV-10).
          type: string
          format: uuid
        howToStepId:
          description: The step being explained; must be the same step as in the request (INV-10).
          type: string
          format: uuid
        description:
          description: The helper's explanation of how to perform the step.
          type: string
          minLength: 1
          maxLength: 8000
        images:
          description: Links to images that illustrate the step.
          type: array
          maxItems: 20
          default: []
          items:
            type: string
            format: uri

    CatastropheMitigation:
      description: The answer to a Catastrophe request — free text on how to rescue the dish.
      type: object
      required:
        - topic
        - recipeId
        - explanation
      properties:
        topic:
          description: Marks this answer as a catastrophe mitigation.
          type: string
          const: CATASTROPHE
        recipeId:
          description: The recipe concerned; must be the same recipe as in the request (INV-10).
          type: string
          format: uuid
        howToStepId:
          description: The step concerned; when the request named one, it must be the same (INV-10).
          type: [string, "null"]
          format: uuid
        explanation:
          description: What the cook should do to save the dish, in free text.
          type: string
          minLength: 1
          maxLength: 8000

    MenuProposal:
      description: The answer to a Menu request — a sequence of courses for a meal.
      type: object
      required:
        - topic
        - note
        - servings
        - meal
        - courses
      properties:
        topic:
          description: Marks this answer as a menu proposal.
          type: string
          const: MENU
        note:
          description: The helper's remarks on the menu as a whole.
          type: string
          minLength: 1
          maxLength: 4000
        servings:
          description: Number of people the menu is planned for; at least one.
          type: integer
          format: int32
          minimum: 1
        meal:
          description: The meal the menu is meant for.
          $ref: '#/components/schemas/Meal'
        howToServe:
          description: Optional advice on how to serve the menu.
          type: [string, "null"]
          maxLength: 4000
        courses:
          description: The courses of the menu, one to ten.
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/Course'

    Course:
      description: One course of a menu proposal.
      type: object
      required:
        - dish
        - recipeId
      properties:
        dish:
          description: |
            The serving step this course belongs to, starting at 1. Not unique — different courses can
            share a step when served in parallel.
          type: integer
          format: int32
          minimum: 1
        recipeId:
          description: The recipe to cook for this course (Recipe Catalog context).
          type: string
          format: uuid

    # ---- infrastructure ------------------------------------------------------
    PageInfo:
      description: Paging information of a list result.
      type: object
      required:
        - number
        - size
        - totalElements
        - totalPages
      properties:
        number:
          description: Zero-based number of this page.
          type: integer
          format: int32
          minimum: 0
        size:
          description: Maximum number of entries on a page.
          type: integer
          format: int32
          minimum: 1
        totalElements:
          description: Number of entries across all pages.
          type: integer
          format: int64
          minimum: 0
        totalPages:
          description: Number of pages available.
          type: integer
          format: int32
          minimum: 0

    Problem:
      description: |
        RFC 9457 Problem Details, returned with every error response as `application/problem+json`
        (ADR-CA-006). `code` names the violated rule, `rule` its invariant ID where one applies.
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          description: URI identifying the problem type, https://larder.org/problems/cook-assistance/<code in kebab-case>.
          type: string
          format: uri
        title:
          description: Short, human-readable summary of the problem type.
          type: string
        status:
          description: The HTTP status code of this response.
          type: integer
          format: int32
          minimum: 400
          maximum: 599
        detail:
          description: Human-readable explanation of this occurrence.
          type: string
        instance:
          description: URI reference of the resource or request this occurrence is about.
          type: string
          format: uri-reference
        code:
          description: |
            Machine-readable error code — the name of the violated rule for `403`, `409` and `422`, e.g.
            `StepNotInRecipe` or `HelpNotProvided`. New codes may be added.
          type: string
        rule:
          description: The invariant the request violated, e.g. `INV-18`, when one applies.
          type: [string, "null"]
          pattern: '^INV-[0-9]{2}$'

