asyncapi: 3.1.0
info:
  title: <API Name>
  version: 1.0.0
  description: |
    <One or more sentences describing what this event-driven API does and who uses it.>
    The API evolves additively within a major version: consumers must ignore
    unknown message types, unknown properties and unknown enumeration values.
  contact:
    name: <Owning team or person>
    url: <https://example.org>
    email: <team@example.org>

servers:
  production:
    host: "<broker-host:port>"          # e.g. events.example.com:9092 — no protocol scheme here
    protocol: "<kafka|mqtt|amqp|ws|...>"
    description: "Production broker"
    security:
      - $ref: '#/components/securitySchemes/user-password'

defaultContentType: application/json

channels:
  <resourceEvents>:                      # camelCase channel key
    address: "<resource-area/resources>" # kebab-case path segments
    messages:
      <resourceCreated>:
        $ref: '#/components/messages/<resourceCreated>'
      <resourceCompleted>:
        $ref: '#/components/messages/<resourceCompleted>'

operations:
  # action is from THIS application's perspective:
  #   send    = this app publishes the message
  #   receive = this app consumes the message
  publish<ResourceCreated>:
    action: send
    description: |
      <When this event is published and what it means for consumers.>
    channel:
      $ref: '#/channels/<resourceEvents>'
    messages:
      - $ref: '#/channels/<resourceEvents>/messages/<resourceCreated>'

  publish<ResourceCompleted>:
    action: send
    description: |
      <When this event is published and what it means for consumers.>
    channel:
      $ref: '#/channels/<resourceEvents>'
    messages:
      - $ref: '#/channels/<resourceEvents>/messages/<resourceCompleted>'

components:
  messages:
    <resourceCreated>:
      name: <ResourceCreated>            # PascalCase
      title: <Resource Created Event>    # human-readable
      summary: Indicates that a new <resource> has been created
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/<ResourceCreated>Payload'
      examples:                          # seed for consumer contract tests
        - name: <exampleName>
          summary: <One concrete situation in domain language>
          headers:
            correlationId: <uuid>
            messageId: <uuid>
            source: <source-system>
          payload:
            <resource>Id: <uuid>
            status: CREATED

    # One specific past-tense domain fact per message — never a generic
    # "<Resource>Updated"/"Changed" event with a change-type switch.
    <resourceCompleted>:
      name: <ResourceCompleted>
      title: <Resource Completed Event>
      summary: Indicates that a <resource> has been completed
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/<ResourceCompleted>Payload'
      examples:
        - name: <exampleName>
          summary: <One concrete situation in domain language>
          headers:
            correlationId: <uuid>
            messageId: <uuid>
            source: <source-system>
          payload:
            <resource>Id: <uuid>
            status: COMPLETED

  schemas:
    # Shared by EVERY message — cross-cutting tracing/routing metadata.
    MessageHeader:
      type: object
      required:
        - correlationId
        - messageId
        - source
      properties:
        correlationId:
          type: string
          format: uuid
          description: Identifier to trace the end-to-end journey
        messageId:
          type: string
          format: uuid
          description: Unique identifier for this message
        source:
          type: string
          description: Source system generating the event
          minLength: 2
          maxLength: 20

    <ResourceCreated>Payload:
      type: object
      required:
        - <resource>Id
        - status
      properties:
        <resource>Id:
          description: <What this identifier identifies, in domain language.>
          type: string
          format: uuid
        status:
          description: <Lifecycle state after this event; always CREATED here.>
          type: string
          enum: [CREATED]                # single-value enum models the state machine
        # ... domain fields with constraints (minLength/maxLength, format, etc.),
        #     each with a description saying what the value MEANS ...
        createdAt:
          description: <When the <resource> was created.>
          type: string
          format: date-time

    <ResourceCompleted>Payload:
      type: object
      required:
        - <resource>Id
        - status
      properties:
        <resource>Id:
          description: <What this identifier identifies, in domain language.>
          type: string
          format: uuid
        status:
          description: <Lifecycle state after this event; always COMPLETED here.>
          type: string
          enum: [COMPLETED]

  securitySchemes:
    user-password:
      type: userPassword
      description: Basic authentication for event broker
