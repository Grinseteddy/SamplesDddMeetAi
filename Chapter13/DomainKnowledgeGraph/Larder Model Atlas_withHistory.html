<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Larder Model Atlas</title>
<script src="https://cdn.jsdelivr.net/npm/n3@1.17.4/browser/n3.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..900,0..1,0..1,0..1&display=swap">
<style>
/* Layout: a whiteboard. One trunk of workshop artifacts on the left fans out at the
   context map into one swim lane per bounded context. Type runs from marker-casual
   (workshop stickies) to strict monospace (API specs) along the same ladder. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --band:#e6eaef; --ink:#1b2330; --muted:#5a6575; --line:#c3ccd7; --line-strong:#8e9bab;
  --accent:#0a7aa8; --accent-soft:#d3ecf6; --warn:#c2412d; --dim:.16;
  --t-brainstorm:#d6488a; --t-bmc:#22968a; --t-impact-map:#4b9636; --t-domain-story:#3274cf; --t-glossary:#c99700;
  --t-board:#e8721f; --t-context-map:#8460d2; --t-canvas-sync:#4352c4; --t-canvas-async:#9c48d2;
  --t-aggregate-glossary:#a87503; --t-openapi:#3f5d79; --t-asyncapi:#6f4aa8; --t-other:#6b7280;
  --t-wardley:#2f7f6f; --t-capability-map:#3d8a8a; --t-core-domain:#5b7f2a; --t-event-model:#c4561a; --t-bc-canvas:#5d4bb3; --t-adr-log:#8a5a44;
  --f:"Recursive", ui-sans-serif, system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151b; --surface:#1a2029; --band:#161b22; --ink:#e4e9f0; --muted:#95a1b3; --line:#2c3644; --line-strong:#5a6a80;
  --accent:#4cc0ec; --accent-soft:#12394a; --warn:#ff7a63; --dim:.2;
  --t-brainstorm:#ef6aa6; --t-bmc:#3cc0b2; --t-impact-map:#72be55; --t-domain-story:#5f9cf0; --t-glossary:#e8b923;
  --t-board:#ff9142; --t-context-map:#a888f0; --t-canvas-sync:#7a86f0; --t-canvas-async:#c07ef0;
  --t-aggregate-glossary:#d6a128; --t-openapi:#86a8c8; --t-asyncapi:#a487dd; --t-other:#9aa3b2; --t-wardley:#55b8a4; --t-capability-map:#62c0c0; --t-core-domain:#93c25a; --t-event-model:#ff8a4d; --t-bc-canvas:#9d8cf0; --t-adr-log:#c99682; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#1a2029; --band:#161b22; --ink:#e4e9f0; --muted:#95a1b3; --line:#2c3644; --line-strong:#5a6a80;
  --accent:#4cc0ec; --accent-soft:#12394a; --warn:#ff7a63; --dim:.2;
  --t-brainstorm:#ef6aa6; --t-bmc:#3cc0b2; --t-impact-map:#72be55; --t-domain-story:#5f9cf0; --t-glossary:#e8b923;
  --t-board:#ff9142; --t-context-map:#a888f0; --t-canvas-sync:#7a86f0; --t-canvas-async:#c07ef0;
  --t-aggregate-glossary:#d6a128; --t-openapi:#86a8c8; --t-asyncapi:#a487dd; --t-other:#9aa3b2; --t-wardley:#55b8a4; --t-capability-map:#62c0c0; --t-core-domain:#93c25a; --t-event-model:#ff8a4d; --t-bc-canvas:#9d8cf0; --t-adr-log:#c99682; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-variation-settings:"CASL" .3;margin:0}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100%;padding-inline:16px;box-sizing:border-box}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px 10px}
h1{font-size:1.35rem;margin:0;font-weight:800;font-variation-settings:"CASL" 1;letter-spacing:-.01em;text-wrap:balance}
.stats{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums;font-variation-settings:"MONO" 1}
.stats b{color:var(--ink);font-weight:600}
.search{position:relative;margin-left:auto;min-width:0;flex:1 1 240px;max-width:360px}
.search input{width:100%;box-sizing:border-box;font:inherit;font-size:.9rem;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.results{position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:320px;overflow:auto;box-shadow:0 8px 24px rgb(0 0 0 / .15)}
.results button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;font:inherit;font-size:.85rem;padding:7px 10px;border:0;background:none;color:var(--ink);cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--accent-soft);outline:none}
.results small{color:var(--muted);white-space:nowrap}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;min-height:0;padding-bottom:14px}
.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stage svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.stage svg.dragging{cursor:grabbing}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.zoom button,.chipbtn{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:5px 10px;cursor:pointer}
.zoom button:hover,.chipbtn:hover{border-color:var(--accent)}
.zoom button:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--accent)}
.hint{position:absolute;left:12px;bottom:10px;font-size:.75rem;color:var(--muted);pointer-events:none}
aside{min-height:0;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px}
aside h2{font-size:1.1rem;margin:0 0 4px;font-weight:750;text-wrap:balance;font-variation-settings:"CASL" .8}
aside h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 0 6px;font-weight:650}
aside p{overflow-wrap:anywhere;font-size:.86rem;line-height:1.5;margin:6px 0;max-width:62ch}
.kicker{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.legend button{display:flex;align-items:center;gap:8px;font:inherit;font-size:.8rem;background:none;border:0;color:var(--ink);padding:3px 2px;cursor:pointer;text-align:left}
.legend svg{width:22px;height:22px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.74rem;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);font-variation-settings:"MONO" 1}
.chip.conf-OnArtifact{border-color:var(--t-impact-map);color:var(--t-impact-map)}
.chip.conf-Implied{border-color:var(--t-glossary);color:var(--t-glossary)}
.chip.conf-Inferred{border-color:var(--warn);color:var(--warn)}
.list{display:flex;flex-direction:column;gap:2px;font-size:.84rem}
.list button,.lnk{font:inherit;text-align:left;background:none;border:0;padding:3px 4px;border-radius:5px;color:var(--ink);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.list button:hover,.lnk:hover{background:var(--accent-soft)}
.list button:focus-visible,.lnk:focus-visible{outline:2px solid var(--accent)}
.list small,.muted{color:var(--muted)}
.mono{font-variation-settings:"MONO" 1,"CASL" 0;font-size:.78rem}
.contra{border-left:3px solid var(--warn);padding:4px 0 4px 10px;margin:8px 0;font-size:.82rem;line-height:1.45}
.contra .vs{color:var(--warn);font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;margin:2px 0}
.src{font-size:.82rem;padding:5px 0;border-bottom:1px dashed var(--line)}
.src:last-child{border-bottom:0}
details summary{cursor:pointer;font-size:.84rem;padding:3px 0}
.back{margin-bottom:8px}

.titles{display:flex;flex-direction:column;gap:2px;min-width:0}
.graphname{font-size:.78rem;color:var(--muted);font-variation-settings:"MONO" 1;overflow-wrap:anywhere}
.loader{display:flex;gap:6px;align-items:center}
.chipbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:650}
.chipbtn.primary:hover{filter:brightness(1.08)}
.drop{position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:10px;background:color-mix(in srgb,var(--accent-soft) 85%,transparent);display:grid;place-items:center;font-weight:700;color:var(--ink);pointer-events:none;z-index:5}
.drop[hidden]{display:none}
.notice{border-left:3px solid var(--accent);padding:6px 10px;margin:0 0 10px;font-size:.84rem;background:var(--accent-soft);border-radius:0 6px 6px 0}
.notice.err{border-color:var(--warn)}
.lane-none text{font-style:italic}

.timebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:0 10px;font-size:.84rem}
.timebar input[type=range]{flex:1 1 220px;min-width:0;accent-color:var(--accent)}
.timelbl{font-variant-numeric:tabular-nums;min-width:0;flex:1 1 260px}
.timebar .sup{display:flex;align-items:center;gap:6px;color:var(--muted)}
.timebar .tl{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em}
.future,.gone{display:none}
.card.superseded{opacity:.55}
.card.superseded .bg{stroke-dasharray:5 4}
.card .supl{display:none;font-size:9.5px;fill:var(--warn);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.card.superseded .supl{display:block}
.card.superseded .sub{display:none}
.card .ver{font-size:10px;font-weight:800;fill:currentColor;font-variation-settings:"MONO" 1}
.dimmed .card.superseded:not(.hl){opacity:var(--dim)}
.diffarrow{fill:none;stroke:var(--accent);stroke-width:3}
.versions{display:flex;flex-direction:column;gap:2px}
.vrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px}
.vrow.here{background:var(--accent-soft)}
.vtxt{display:flex;flex-direction:column;min-width:0}
.vtxt small{color:var(--muted);font-size:.74rem}
.vnum{font-variation-settings:"MONO" 1;font-weight:800;font-size:.74rem;color:var(--accent);min-width:2.2em}
.vstep{padding:2px 0 4px 34px}
.diffstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.diffstats div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column}
.diffstats b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.diffstats span{font-size:.72rem;color:var(--muted)}
.plus{color:var(--t-impact-map)} .minus{color:var(--warn)}
.diffstats .plus b{color:var(--t-impact-map)} .diffstats .minus b{color:var(--warn)}
.chg{font-size:.82rem;padding:4px 0;border-bottom:1px dashed var(--line);line-height:1.45}
.chg .plus,.chg .minus{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.src.hist{display:flex;align-items:center;gap:6px}
.src.hist small{color:var(--muted);margin-left:auto;font-size:.74rem;white-space:nowrap}
/* svg */
.colhead{font-size:13px;font-weight:700;fill:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.colsub{font-size:11px;fill:var(--muted)}
.band{fill:var(--band)}
.ctx-chip rect{fill:var(--surface);stroke:var(--t-context-map);stroke-width:1.5}
.ctx-chip text{font-size:13px;font-weight:650;fill:var(--ink);font-variation-settings:"CASL" .6}
.ctx-chip .alias{font-size:10.5px;font-weight:400;fill:var(--muted)}
.ctx-chip{cursor:pointer}
.ctx-chip:hover rect,.ctx-chip.sel rect{stroke:var(--accent);stroke-width:2.5}
.card{cursor:pointer}
.card .bg{fill:var(--surface);stroke-width:1.4}
.card .tint{opacity:.13}
.card .ttl{font-size:12.5px;font-weight:700;fill:var(--ink)}
.card .sub{font-size:10.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.card.workshop text{font-variation-settings:"CASL" 1,"MONO" 0}
.card.design text{font-variation-settings:"CASL" .45,"MONO" 0}
.card.spec text{font-variation-settings:"CASL" 0,"MONO" 1}
.card:hover .bg{stroke-width:2.6}
.card:focus-visible{outline:none}
.card:focus-visible .bg{stroke:var(--accent);stroke-width:3}
.card.sel .bg{stroke:var(--accent);stroke-width:3}
.card .badge rect{fill:var(--accent)}
.card .badge text{fill:var(--surface);font-size:10.5px;font-weight:700;font-variation-settings:"MONO" 1}
.dimmed .card:not(.hl),.dimmed .ctx-chip:not(.hl){opacity:var(--dim)}
.dimmed .lineage,.dimmed .spine,.dimmed .fan{opacity:.25}
.lineage{fill:none;stroke:var(--line-strong);stroke-linecap:round}
.spine{fill:none;stroke:var(--line);stroke-width:2}
.fan{fill:none;stroke:var(--t-context-map);stroke-width:1.4;opacity:.55}
.rev{fill:none;stroke:var(--muted);stroke-width:1.3;stroke-dasharray:4 4}
.share{fill:none;stroke:var(--accent);stroke-linecap:round;opacity:.7}
.sharelbl{font-size:10.5px;fill:var(--accent);font-weight:700;font-variation-settings:"MONO" 1;paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.trace{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:1 7;stroke-linecap:round}
@media (prefers-reduced-motion:no-preference){.trace{animation:march 1.2s linear infinite}@keyframes march{to{stroke-dashoffset:-16}}}
@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:62vh auto}
  .app{height:auto}
  aside{overflow:visible}
  .search{max-width:none;margin-left:0}
}
</style>

<div class="app">
  <header>
    <div class="titles"><h1>Larder Model Atlas</h1><div class="graphname" id="gname"></div></div>
    <div class="stats" id="stats"></div>
    <div class="loader">
      <input type="file" id="file" accept=".ttl,.turtle,text/turtle" hidden>
      <button type="button" class="chipbtn primary" id="loadbtn">Load .ttl</button>
      <button type="button" class="chipbtn" id="resetbtn" hidden>Back to Larder</button>
    </div>
    <div class="search">
      <label for="q" class="muted" style="position:absolute;left:-9999px">Find a term, event, operation or question</label>
      <input id="q" type="search" placeholder="Find a term, event, endpoint…" autocomplete="off">
      <div class="results" id="results" hidden></div>
    </div>
  </header>
  <div class="timebar">
    <button type="button" class="chipbtn" id="play">▶ Replay</button>
    <label for="time" class="muted tl">Ingest order</label>
    <input type="range" id="time" min="1" max="1" value="1" step="1">
    <button type="button" class="chipbtn" id="latest">Latest</button>
    <span class="timelbl" id="timelbl"></span>
    <label class="sup"><input type="checkbox" id="showsup" checked> Show superseded versions</label>
  </div>
  <div class="main">
    <div class="stage">
      <svg id="svg" role="img" aria-label="Artifacts of the Larder modelling effort, from the brainstorm to the API specifications, split by bounded context">
        <defs id="defs"><marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker></defs>
        <g id="world"><g id="lBands"></g><g id="lLinks"></g><g id="lShare"></g><g id="lTrace"></g><g id="lNodes"></g></g>
      </svg>
      <div class="drop" id="drop" hidden><div>Drop a Turtle file (.ttl) to open it</div></div>
      <div class="hint">Drag to pan · scroll or use the buttons to zoom · click a card · drop a .ttl here</div>
      <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">−</button><button type="button" id="zfit">Fit</button></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>

function predName(p,inbound){
  if(p.startsWith('rel:'))return (inbound?'← ':'')+p.slice(4);
  if(p.startsWith('assert:')){const b=p.slice(7);return (inbound?(PRED_IN[b]||b+' (in)'):(PRED[b]||b))+' · inferred'}
  return inbound?(PRED_IN[p]||(PRED[p]||p)+' (in)'):(PRED[p]||p);
}

/* ---------- Turtle → model ---------- */
const DKG='https://w3id.org/dkg/ns#',RDF='http://www.w3.org/1999/02/22-rdf-syntax-ns#',RDFS='http://www.w3.org/2000/01/rdf-schema#',SKOS='http://www.w3.org/2004/02/skos/core#',OWL='http://www.w3.org/2002/07/owl#';
const local=iri=>iri.replace(/^.*[#\/]/,'');
const ARTCLS=new Set(['Artifact','Brainstorm','BusinessModelCanvas','WardleyMap','ImpactMap','DomainStory','VisualGlossary','EventStormingBoard','EventModel','CapabilityMap','CoreDomainChart','BoundedContextCanvas','ADRLog','ApiSpecification','SyncApiSpec','AsyncApiSpec'].map(x=>DKG+x));
const SKIP_P=new Set([RDF+'type',SKOS+'prefLabel',SKOS+'altLabel',RDFS+'comment',RDFS+'label',DKG+'source',DKG+'locator',DKG+'confidence',DKG+'absentFrom',SKOS+'example',DKG+'revisionOf',OWL+'imports']);

function buildModel(text){
  const quads=new N3.Parser().parse(text);
  const seqOf=new Map();{let k=0;for(const q of quads){for(const t of [q.subject,q.object])if(t.termType==='NamedNode'&&!seqOf.has(t.value))seqOf.set(t.value,k++)}}
  const S=new Map();
  for(const q of quads){if(q.subject.termType!=='NamedNode')continue;const s=q.subject.value;let m=S.get(s);if(!m)S.set(s,m=new Map());const p=q.predicate.value;(m.get(p)||m.set(p,[]).get(p)).push(q.object)}
  const objs=(s,p)=>S.get(s)?.get(p)||[];
  const val=(s,p)=>{const o=objs(s,p)[0];return o?o.value:''};
  const types=s=>objs(s,RDF+'type').map(o=>o.value);
  const id=iri=>local(iri);
  let title='';for(const[s]of S)if(types(s).includes(OWL+'Ontology')){title=val(s,RDFS+'label');break}
  // artifacts
  const artIris=new Set();
  for(const[s,m]of S){if(types(s).some(t=>ARTCLS.has(t))||m.has(DKG+'ingestedAt'))artIris.add(s)}
  for(const[s,m]of S)for(const o of (m.get(DKG+'source')||[]))if(o.termType==='NamedNode')artIris.add(o.value);
  // nodes
  const isNode=s=>{if(artIris.has(s))return false;const t=types(s);if(t.includes(DKG+'Assertion')||t.includes(DKG+'Relationship')||t.includes(OWL+'Ontology'))return false;const m=S.get(s);return m&&(m.has(SKOS+'prefLabel')||m.has(RDFS+'label')||m.has(DKG+'source'))};
  const nodes=new Map();
  for(const[s]of S){if(!isNode(s))continue;const t=types(s);
    nodes.set(s,{id:id(s),iri:s,label:val(s,SKOS+'prefLabel')||val(s,RDFS+'label')||id(s),cls:[...new Set(t.map(local))].sort(),
      alt:[...new Set(objs(s,SKOS+'altLabel').map(o=>o.value))].slice(0,6),conf:local(val(s,DKG+'confidence')),
      src:[...new Set(objs(s,DKG+'source').map(o=>id(o.value)))],loc:[...new Set(objs(s,DKG+'locator').map(o=>o.value))].slice(0,6),
      ctx:objs(s,DKG+'inContext').map(o=>id(o.value)),comment:val(s,RDFS+'comment').slice(0,400),
      ex:objs(s,SKOS+'example').map(o=>o.value).slice(0,3),absent:objs(s,DKG+'absentFrom').map(o=>id(o.value))})}
  const nodeById=new Map([...nodes.values()].map(n=>[n.id,n]));
  // artifacts with type
  const heldBy=new Map();for(const n of nodes.values())for(const s of n.src)(heldBy.get(s)||heldBy.set(s,[]).get(s)).push(n);
  const arts=new Map();
  for(const a of artIris){const t=types(a).map(local),fmt=val(a,DKG+'specFormat'),lab=val(a,RDFS+'label')||val(a,SKOS+'prefLabel')||id(a);
    const canvas=/canvas/i.test(fmt);let ty='other';
    if(t.includes('SyncApiSpec'))ty=canvas?'canvas-sync':'openapi';
    else if(t.includes('AsyncApiSpec'))ty=canvas?'canvas-async':'asyncapi';
    else if(t.includes('ApiSpecification'))ty=/async/i.test(fmt)?'asyncapi':'openapi';
    else if(t.includes('Brainstorm'))ty='brainstorm';else if(t.includes('BusinessModelCanvas'))ty='bmc';else if(t.includes('ImpactMap'))ty='impact-map';
    else if(t.includes('WardleyMap'))ty='wardley';else if(t.includes('CapabilityMap'))ty='capability-map';else if(t.includes('CoreDomainChart'))ty='core-domain';
    else if(t.includes('DomainStory'))ty='domain-story';else if(t.includes('EventStormingBoard'))ty='board';else if(t.includes('EventModel'))ty='event-model';
    else if(t.includes('BoundedContextCanvas'))ty='bc-canvas';else if(t.includes('ADRLog'))ty='adr-log';
    else if(t.includes('VisualGlossary')){const h=heldBy.get(id(a))||[];const tac=h.filter(n=>n.cls.some(c=>c==='Entity'||c==='ValueObject')).length;ty=h.length&&tac/h.length>.3?'aggregate-glossary':'glossary'}
    else if(/context\s*map/i.test(lab))ty='context-map';
    arts.set(id(a),{iri:a,id:id(a),type:ty,label:lab,comment:val(a,RDFS+'comment'),date:val(a,DKG+'ingestedAt'),revisionOf:objs(a,DKG+'revisionOf').map(o=>id(o.value)),n:(heldBy.get(id(a))||[]).length})}
  // edges
  const edges=[];
  for(const[s,m]of S){if(!nodes.has(s))continue;for(const[p,os]of m){if(SKIP_P.has(p))continue;for(const o of os)if(o.termType==='NamedNode'&&nodes.has(o.value))edges.push([id(s),local(p),id(o.value)])}}
  for(const[s]of S){const t=types(s);
    if(t.includes(DKG+'Relationship')){const f=val(s,DKG+'from'),to=val(s,DKG+'to');if(nodes.has(f)&&nodes.has(to)){const lab=[val(s,DKG+'verb'),val(s,DKG+'cardinality')].filter(Boolean).join(' ');edges.push([id(f),'rel:'+(lab||'→'),id(to)])}}
    if(t.includes(DKG+'Assertion')){const a=val(s,RDF+'subject'),p=val(s,RDF+'predicate'),o=val(s,RDF+'object');if(nodes.has(a)&&nodes.has(o))edges.push([id(a),'assert:'+local(p),id(o),val(s,RDFS+'comment'),local(val(s,DKG+'confidence'))])}}
  const desc=x=>{const t=types(x),src=objs(x,DKG+'source').map(o=>id(o.value));
    if(t.includes(DKG+'Relationship'))return{text:val(x,SKOS+'prefLabel')||[val(val(x,DKG+'from'),SKOS+'prefLabel'),val(x,DKG+'verb'),val(x,DKG+'cardinality'),val(val(x,DKG+'to'),SKOS+'prefLabel')].join(' '),nodes:[id(val(x,DKG+'from')),id(val(x,DKG+'to'))],src};
    if(t.includes(DKG+'Assertion'))return{text:val(x,RDFS+'comment')||id(x),nodes:[id(val(x,RDF+'subject')),id(val(x,RDF+'object'))],src};
    return{text:val(x,SKOS+'prefLabel')||id(x),nodes:[id(x)],src}};
  const supersedes=[];for(const[s,m]of S)for(const o of (m.get(DKG+'supersedes')||[]))if(o.termType==='NamedNode'){const d=desc(s),e=desc(o.value);supersedes.push({nw:d,old:e,cmt:val(s,RDFS+'comment')})}
  const contradictions=[];for(const[s,m]of S)for(const o of (m.get(DKG+'contradicts')||[]))if(o.termType==='NamedNode')contradictions.push([desc(s),desc(o.value)]);
  // contexts
  const ctxs=new Map();for(const[s]of S)if(types(s).includes(DKG+'BoundedContext'))ctxs.set(id(s),{id:id(s),label:val(s,SKOS+'prefLabel')||id(s),src:objs(s,DKG+'source').map(o=>id(o.value)),same:objs(s,DKG+'proposedSameAs').map(o=>id(o.value))});
  // context of each post-split artifact
  const apiCtx=new Map();
  for(const[s]of S)if(types(s).includes(DKG+'Api')){const c=objs(s,DKG+'inContext')[0];if(!c)continue;for(const a of objs(s,DKG+'source'))apiCtx.set(id(a.value),id(c.value));apiCtx.set(id(s),id(c.value))}
  const schemaCtx=sch=>{const api=val(sch,DKG+'exposedBy');return api?apiCtx.get(id(api)):undefined};
  const specVotes=new Map();
  for(const[s,m]of S){if(!types(s).includes(DKG+'Schema'))continue;const c=schemaCtx(s);if(!c)continue;for(const o of (m.get(DKG+'specifies')||[])){const k=id(o.value);const v=specVotes.get(k)||new Map();v.set(c,(v.get(c)||0)+1);specVotes.set(k,v)}}
  const top=v=>{let b=null,bn=0;for(const[k,n]of v)if(n>bn){b=k;bn=n}return b};
  for(const a of arts.values()){
    if(!POST_TYPES.has(a.type))continue;
    if(apiCtx.has(a.id)){a.ctx=apiCtx.get(a.id);a.ctxHow="the API's own context";continue}
    const held=heldBy.get(a.id)||[];const votes=new Map();
    if(a.type==='aggregate-glossary'){for(const n of held)if(n.cls.includes('AggregateRoot')){const v=specVotes.get(n.id);if(v)for(const[k,c]of v)votes.set(k,(votes.get(k)||0)+c)}
      if(votes.size){a.ctx=top(votes);a.ctxHow='placed by the API contracts that specify its aggregate root (the glossary names no context)';continue}
      for(const n of held)if(n.cls.includes('AggregateRoot'))for(const c of n.ctx)votes.set(c,(votes.get(c)||0)+1);
      if(votes.size){a.ctx=top(votes);a.ctxHow="placed by its aggregate root's context";continue}}
    for(const n of held)for(const c of n.ctx)votes.set(c,(votes.get(c)||0)+1);
    if(votes.size){a.ctx=top(votes);a.ctxHow='placed by the contexts of the nodes it holds'}
  }
  const share=new Map();
  for(const n of nodes.values()){const ss=n.src.filter(s=>arts.has(s)).sort();for(let i=0;i<ss.length;i++)for(let j=i+1;j<ss.length;j++){const k=ss[i]+'|'+ss[j];share.set(k,(share.get(k)||0)+1)}}
  {const order=[...arts.values()].sort((a,b)=>(seqOf.get(a.iri)??1e9)-(seqOf.get(b.iri)??1e9));order.forEach((a,i)=>{a.seq=i+1})}
  return {supersedes,title,artifacts:[...arts.values()],nodes:[...nodes.values()],edges,contradictions,share:[...share].map(([k,n])=>[...k.split('|'),n]),contexts:[...ctxs.values()],triples:quads.length};
}

function shortName(a){
  if(!a)return '';let l=a.label;
  if(a.type==='aggregate-glossary')return l.replace(/^Visual Glossary\s*[—-]\s*/,'').replace(/ aggregate$/,'');
  if(a.type.startsWith('canvas')||a.type==='openapi'||a.type==='asyncapi')return l.split(' — ')[0];
  l=l.replace(/\s*\(.*$/,'');
  if(a.type==='domain-story')return l.replace(/^Domain Story\s*/,'Story ').replace(/'/g,'').replace(' — copy with optional boxes',' (copy)');
  return l.replace('Brainstorm convergence mind map','Brainstorm').replace('Business Model Canvas Enhanced','Business Model Canvas').replace('EventStorming board, two photos','EventStorming board').replace('Impact Map with AI, step 3','Impact Map');
}
const primaryCls=n=>{const c=n.cls.filter(x=>!CLS_SKIP.has(x));return c.length?c:n.cls};

function index(data){
  DATA=data;
  A=new Map(DATA.artifacts.map(a=>[a.id,a]));
  N=new Map(DATA.nodes.map(n=>[n.id,n]));
  OUT=new Map();IN=new Map();
  for(const e of DATA.edges){const[s,,o]=e;(OUT.get(s)||OUT.set(s,[]).get(s)).push(e);(IN.get(o)||IN.set(o,[]).get(o)).push(e)}
  SHARE=new Map();for(const[a,b,n]of DATA.share){SHARE.set(a+'|'+b,n);SHARE.set(b+'|'+a,n)}
  byArt=new Map();for(const n of DATA.nodes)for(const s of n.src)(byArt.get(s)||byArt.set(s,[]).get(s)).push(n);
  ctxLabel=new Map(DATA.contexts.map(c=>[c.id,c.label]));ctxLabel.set(NONE,'No context named');
  // lanes: contexts holding post-split artifacts, plus contexts drawn on a context map
  const cmIds=new Set(DATA.artifacts.filter(a=>a.type==='context-map').map(a=>a.id));
  const used=new Set(DATA.artifacts.filter(isPost).map(a=>a.ctx).filter(Boolean));
  ALIAS=new Map();
  const want=DATA.contexts.filter(c=>used.has(c.id)||c.src.some(s=>cmIds.has(s)));
  const wantIds=new Set(want.map(c=>c.id));
  for(const c of DATA.contexts){ // a context with no lane of its own that is proposed-same as a lane → alias
    if(used.has(c.id))continue;
    const tgt=c.same.find(x=>wantIds.has(x)&&x!==c.id)||DATA.contexts.find(o=>o.same.includes(c.id)&&wantIds.has(o.id)&&o.id!==c.id)?.id;
    if(tgt&&!(wantIds.has(c.id)&&c.src.some(s=>cmIds.has(s)))){(ALIAS.get(tgt)||ALIAS.set(tgt,[]).get(tgt)).push(c.label);wantIds.delete(c.id)}
  }
  const rank=id=>{const i=CTX_PREF.findIndex(p=>id.endsWith(p)&&id.length-p.length<=4);return i<0?99:i};
  ROWIDS=[...wantIds].sort((a,b)=>rank(a)-rank(b)||(ctxLabel.get(a)||'').localeCompare(ctxLabel.get(b)||''));
  if(DATA.artifacts.some(a=>isPost(a)&&!a.ctx))ROWIDS.push(NONE);
  REVNEXT=new Map();for(const a of DATA.artifacts)for(const b of a.revisionOf)(REVNEXT.get(b)||REVNEXT.set(b,[]).get(b)).push(a.id);
  for(const n of DATA.nodes){const ss=n.src.map(s=>A.get(s)?.seq).filter(x=>x!=null);n.first=ss.length?Math.min(...ss):1}
  TMAX=Math.max(1,...DATA.artifacts.map(a=>a.seq||1));TIME=TMAX;
}

/* ---------- layout & draw ---------- */
const lBands=$('lBands'),lLinks=$('lLinks'),lShare=$('lShare'),lTrace=$('lTrace'),lNodes=$('lNodes'),world=$('world'),svg=$('svg');
function curve(x1,y1,x2,y2){const dx=Math.max(30,(x2-x1)/2);return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`}
function draw(){
  for(const g of [lBands,lLinks,lShare,lTrace,lNodes])g.innerHTML='';
  rows=ROWIDS.map(id=>{const arts=DATA.artifacts.filter(a=>isPost(a)&&(a.ctx||NONE)===id);const per={};for(const a of arts){const c=colOf(a);(per[c]||(per[c]=[])).push(a)}
    const maxN=Math.max(1,...Object.values(per).map(v=>v.length));return{id,arts,per,h:Math.max(80,maxN*(CH+GAP)-GAP+26)}});
  let y=TOP;for(const r of rows){r.y=y;y+=r.h}
  const trunkMax=Math.max(1,...COLS.slice(0,SPLIT).map((c,i)=>DATA.artifacts.filter(a=>colOf(a)===i).length));
  const TOTAL_H=Math.max(y,TOP+trunkMax*(CH+GAP)+20),MID=TOP+(TOTAL_H-TOP)/2;

    const h=arts.length*(CH+GAP)-GAP;let yy=MID-h/2;for(const a of arts){pos.set(a.id,{x:colX(c),y:yy});yy+=CH+GAP}}
  for(const r of rows)for(const c in r.per){const list=r.per[c].sort((a,b)=>a.type.localeCompare(b.type)||a.label.localeCompare(b.label));
    const h=list.length*(CH+GAP)-GAP;let yy=r.y+(r.h-h)/2;for(const a of list){pos.set(a.id,{x:colX(+c),y:yy});yy+=CH+GAP}}
  ctxPos=new Map(rows.map(r=>[r.id,{x:colX(SPLIT),y:r.y+r.h/2-22,w:CW,h:44}]));
  WORLD_W=colX(COLS.length-1)+CW+LEFT;WORLD_H=TOTAL_H+30;

  rows.forEach((r,i)=>{if(i%2===0)el('rect',{class:'band',x:colX(SPLIT)-12,y:r.y,width:WORLD_W-colX(SPLIT)+12-LEFT+6,height:r.h,rx:8},lBands)});
  COLS.forEach((c,i)=>{el('text',{class:'colhead',x:colX(i),y:32},lBands).textContent=c.title.toUpperCase();
    el('text',{class:'colsub',x:colX(i),y:50},lBands).textContent=i<SPLIT?(i===SPLIT-1?'where the split happens':'whole domain'):'one lane per context'});
  el('line',{x1:colX(SPLIT)-24,x2:colX(SPLIT)-24,y1:16,y2:TOTAL_H,stroke:'var(--line)','stroke-dasharray':'2 6'},lBands);
  const R=id=>{const p=pos.get(id);return[p.x+CW,p.y+CH/2]},Lf=id=>{const p=pos.get(id);return[p.x,p.y+CH/2]};
  // trunk lineage
  const trunk=DATA.artifacts.filter(a=>colOf(a)>=0&&colOf(a)<SPLIT);
  for(const a of trunk){const c=colOf(a);if(c<=0)continue;let best=null,bn=0;
    for(const b of trunk){if(colOf(b)>=c)continue;const n=SHARE.get(a.id+'|'+b.id)||0;if(n>bn||(n===bn&&n>0&&best&&colOf(b)>colOf(best))){best=b;bn=n}}
    if(best){const[x1,y1]=R(best.id),[x2,y2]=Lf(a.id);el('path',{class:'lineage','data-a':best.id,'data-b':a.id,d:curve(x1,y1,x2,y2),'stroke-width':(1+Math.log2(bn)).toFixed(1)},lLinks).appendChild(el('title')).textContent=`${bn} nodes shared with ${shortName(best)}`}}
  // fan from the context map(s)
  const cms=DATA.artifacts.filter(a=>a.type==='context-map'&&pos.has(a.id)).sort((a,b)=>(b.seq||0)-(a.seq||0));
  const fanFrom=cms[0]?R(cms[0].id):[colX(SPLIT)-40,MID];
  for(const r of rows){const p=ctxPos.get(r.id);el('path',{class:'fan','data-ctx':r.id,d:curve(fanFrom[0],fanFrom[1],p.x,p.y+p.h/2)},lLinks)}
  for(const r of rows){const p=ctxPos.get(r.id);let prev=[[p.x+p.w,p.y+p.h/2,null]];
    for(let c=SPLIT+1;c<COLS.length;c++){const list=r.per[c]||[];if(!list.length)continue;const next=[];
      for(const a of list){const[x2,y2]=Lf(a.id);for(const[x1,y1,from]of prev)el('path',{class:'spine','data-a':from||'','data-b':a.id,'data-ctx':r.id,d:curve(x1,y1,x2,y2)},lLinks);next.push([...R(a.id),a.id])}prev=next}}
  for(const a of DATA.artifacts)for(const b of a.revisionOf){if(!pos.has(b)||!pos.has(a.id))continue;const pa=pos.get(a.id),pb=pos.get(b);
    if(colOf(a)===colOf(A.get(b))){const x=pa.x+CW+6;el('path',{class:'rev','data-a':b,'data-b':a.id,d:`M${x},${pb.y+CH/2} C${x+22},${pb.y+CH/2} ${x+22},${pa.y+CH/2} ${x},${pa.y+CH/2}`},lLinks)}
    else{const x1=pb.x+CW/2,x2=pa.x+CW/2,top=Math.min(pa.y,pb.y)-14;el('path',{class:'rev','data-a':b,'data-b':a.id,d:`M${x1},${pb.y} C${x1},${top} ${x2},${top} ${x2},${pa.y}`},lLinks)}}
  ctxEls=new Map();
  for(const r of rows){const p=ctxPos.get(r.id);const g=el('g',{class:'ctx-chip'+(r.id===NONE?' lane-none':''),transform:`translate(${p.x},${p.y})`,tabindex:0,role:'button','aria-label':'Bounded context '+ctxLabel.get(r.id)},lNodes);
    el('rect',{width:p.w,height:p.h,rx:22},g);const alias=ALIAS.get(r.id);
    let lab=ctxLabel.get(r.id)||r.id;if(lab.length>22)lab=lab.slice(0,21)+'…';
    el('text',{x:16,y:alias?19:27},g).textContent=lab;
    if(alias){let s='also: '+alias.join(', ');if(s.length>28)s=s.slice(0,27)+'…';el('text',{class:'alias',x:16,y:34},g).textContent=s}
    g.addEventListener('click',()=>selectContext(r.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectContext(r.id)}});ctxEls.set(r.id,g)}
  cardEls=new Map();
  for(const a of DATA.artifacts){const p=pos.get(a.id);if(!p)continue;const fam=TYPES[a.type]?.family||'workshop';
    const g=el('g',{class:`card ${fam}`,transform:`translate(${p.x},${p.y})`,tabindex:0,role:'button','aria-label':`${TYPES[a.type]?.name}: ${shortName(a)}, ${a.n} nodes`},lNodes);
    g.style.color=`var(--t-${a.type})`;const rx=a.type==='brainstorm'||a.type==='board'?3:8;
    el('rect',{class:'bg',width:CW,height:CH,rx,stroke:'currentColor'},g);el('rect',{class:'tint',width:CW,height:CH,rx,fill:'currentColor'},g);
    el('use',{href:'#g-'+(GLYPH[a.type]?a.type:'other'),x:10,y:CH/2-13,width:26,height:26,fill:'currentColor',stroke:'currentColor'},g);
    let nm=shortName(a);if(nm.length>21)nm=nm.slice(0,20)+'…';
    el('text',{class:'ttl',x:44,y:25},g).textContent=nm;
    el('text',{class:'sub',x:44,y:42},g).textContent=`${(TYPES[a.type]?.name||a.type).replace('API Product Canvas · ','canvas · ')} · ${a.n}`;
    const b=el('g',{class:'badge',transform:`translate(${CW-30},-8)`},g);b.style.display='none';el('rect',{width:32,height:17,rx:8.5},b);
    g._badge=b;g._bt=el('text',{x:16,y:12.5,'text-anchor':'middle'},b);
    const ch=chainOf(a.id);if(ch.length>1){const vi=ch.indexOf(a.id)+1;el('text',{class:'ver',x:CW-8,y:CH-8,'text-anchor':'end'},g).textContent='v'+vi}
    const st=el('text',{class:'supl',x:44,y:CH-5},g);st.textContent='superseded';
    g.addEventListener('click',()=>selectArtifact(a.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectArtifact(a.id)}});cardEls.set(a.id,g)}
  const gn=$('gname');gn.textContent=(DATA.title?DATA.title+' · ':'')+SOURCE_NAME;
  $('stats').innerHTML=`<b>${A.size}</b> artifacts · <b>${DATA.nodes.length}</b> nodes · <b>${DATA.edges.length}</b> links · <b>${rows.filter(r=>r.id!==NONE).length}</b> contexts`;
  applyTime();fit();
}

/* ---------- time ---------- */
function chainOf(id){let root=id,guard=0;while(A.get(root)?.revisionOf?.length&&guard++<50){const p=A.get(root).revisionOf.find(x=>A.has(x));if(!p)break;root=p}
  const out=[],seen=new Set(),q=[root];while(q.length){const x=q.shift();if(seen.has(x))continue;seen.add(x);out.push(x);for(const y of (REVNEXT.get(x)||[]))q.push(y)}
  return out.sort((a,b)=>(A.get(a).seq||0)-(A.get(b).seq||0))}
const supersededAt=(id,k)=>(REVNEXT.get(id)||[]).some(b=>(A.get(b)?.seq||1e9)<=k);
function ctxFirst(id){const n=N.get(id);const lane=DATA.artifacts.filter(a=>isPost(a)&&(a.ctx||NONE)===id).map(a=>a.seq);return Math.min(n?n.first:1e9,...(lane.length?lane:[1e9]))}
function applyTime(){
  const k=TIME;
  for(const[id,g]of cardEls){const a=A.get(id),vis=a.seq<=k,sup=vis&&supersededAt(id,k);
    g.classList.toggle('future',!vis);g.classList.toggle('superseded',sup&&SHOWSUP);g.classList.toggle('gone',sup&&!SHOWSUP)}
  for(const[id,g]of ctxEls)g.classList.toggle('future',ctxFirst(id)>k);
  const hiddenCard=i=>{const g=cardEls.get(i);return !g||g.classList.contains('future')||g.classList.contains('gone')};
  for(const p of lLinks.querySelectorAll('path')){const ids=[p.dataset.a,p.dataset.b].filter(Boolean);
    p.classList.toggle('future',ids.some(hiddenCard)||(p.dataset.ctx&&ctxEls.get(p.dataset.ctx)?.classList.contains('future')))}
  const nNodes=DATA.nodes.filter(n=>n.first<=k).length,nArts=DATA.artifacts.filter(a=>a.seq<=k).length;
  $('stats').innerHTML=`<b>${nArts}</b> artifacts · <b>${nNodes}</b> nodes · <b>${DATA.edges.length}</b> links · <b>${rows.filter(r=>r.id!==NONE&&ctxFirst(r.id)<=k).length}</b> contexts`;
  const t=$('time');t.max=TMAX;t.value=k;
  const cur=DATA.artifacts.find(a=>a.seq===k);
  $('timelbl').innerHTML=cur?`<b>Step ${k} of ${TMAX}</b> · ${esc(cur.date||'undated')} · ${esc(shortName(cur))}${k===TMAX?' <span class="muted">(latest)</span>':''}`:'';
}
function setTime(k,keepPanel){TIME=Math.max(1,Math.min(TMAX,k));reset();applyTime();if(!keepPanel)renderOverview()}
$('time').addEventListener('input',e=>{stopPlay();setTime(+e.target.value)});
$('showsup').addEventListener('change',e=>{SHOWSUP=e.target.checked;applyTime()});
function stopPlay(){if(PLAY){clearInterval(PLAY);PLAY=null;$('play').textContent='▶ Replay'}}
$('play').onclick=()=>{if(PLAY){stopPlay();return}if(TIME>=TMAX)setTime(1);$('play').textContent='❚❚ Pause';
  PLAY=setInterval(()=>{if(TIME>=TMAX){stopPlay();return}setTime(TIME+1)},window.matchMedia('(prefers-reduced-motion: reduce)').matches?1400:700)};
$('latest').onclick=()=>{stopPlay();setTime(TMAX)};

/* ---------- pan & zoom ---------- */
let view={s:1,x:0,y:0};
const apply=()=>world.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.s})`);
function fit(){if(!WORLD_W)return;const r=svg.getBoundingClientRect();if(!r.width)return;const s=Math.min(r.width/WORLD_W,r.height/WORLD_H)*0.98;view={s,x:(r.width-WORLD_W*s)/2,y:Math.max(4,(r.height-WORLD_H*s)/2)};apply()}
function zoomAt(f,cx,cy){const ns=Math.min(4,Math.max(.1,view.s*f));const k=ns/view.s;view.x=cx-(cx-view.x)*k;view.y=cy-(cy-view.y)*k;view.s=ns;apply()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
let drag=null;
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.card,.ctx-chip'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')});
svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;view.x=drag.vx+dx;view.y=drag.vy+dy;apply()});
svg.addEventListener('pointerup',()=>{if(drag&&!drag.moved)clearSelection();drag=null;svg.classList.remove('dragging')});
$('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.3,r.width/2,r.height/2)};
$('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.3,r.width/2,r.height/2)};
$('zfit').onclick=fit;
new ResizeObserver(()=>fit()).observe(svg);

/* ---------- highlighting ---------- */
function reset(){lShare.innerHTML='';lTrace.innerHTML='';world.classList.remove('dimmed');
  for(const g of cardEls.values()){g.classList.remove('hl','sel');g._badge.style.display='none'}for(const g of ctxEls.values())g.classList.remove('hl','sel')}
const center=id=>{const p=pos.get(id);return[p.x+CW/2,p.y+CH/2]};
function badge(id,txt){const g=cardEls.get(id);if(!g)return;g._badge.style.display='';g._bt.textContent=txt}
function clearSelection(){reset();renderOverview()}
function selectArtifact(id){
  reset();const a=A.get(id);world.classList.add('dimmed');cardEls.get(id)?.classList.add('hl','sel');
  const links=[];for(const b of A.values()){if(b.id===id)continue;const n=SHARE.get(id+'|'+b.id);if(n){links.push([b,n]);cardEls.get(b.id)?.classList.add('hl');badge(b.id,n)}}
  if(isPost(a))ctxEls.get(a.ctx||NONE)?.classList.add('hl');
  if(pos.has(id)){const[cx,cy]=center(id);for(const[b,n]of links){if(!pos.has(b.id))continue;const[bx,by]=center(b.id);el('path',{class:'share',d:`M${cx},${cy} Q${(cx+bx)/2},${Math.min(cy,by)-40-Math.abs(cx-bx)*.08} ${bx},${by}`,'stroke-width':(1+Math.log2(n)).toFixed(1)},lShare)}}
  renderArtifact(a,links.sort((x,y)=>y[1]-x[1]));
}
function selectContext(id){
  reset();world.classList.add('dimmed');ctxEls.get(id)?.classList.add('hl','sel');
  const arts=DATA.artifacts.filter(a=>isPost(a)&&(a.ctx||NONE)===id);for(const a of arts)cardEls.get(a.id)?.classList.add('hl');
  const inCtx=(IN.get(id)||[]).filter(e=>e[1]==='inContext').map(e=>N.get(e[0])).filter(Boolean);
  for(const n of inCtx)for(const s of n.src)if(cardEls.has(s)&&!isPost(A.get(s)))cardEls.get(s).classList.add('hl');
  renderContext(id,arts,inCtx);
}
function selectNode(nid){
  reset();const n=N.get(nid);if(!n)return;world.classList.add('dimmed');
  const holders=n.src.filter(s=>cardEls.has(s));for(const s of holders){cardEls.get(s).classList.add('hl');badge(s,'●')}
  const nb=new Set();for(const e of (OUT.get(nid)||[]))nb.add(e[2]);for(const e of (IN.get(nid)||[]))nb.add(e[0]);
  const reach=new Map();for(const m of nb){const mm=N.get(m);if(!mm)continue;for(const s of mm.src)if(!holders.includes(s))reach.set(s,(reach.get(s)||0)+1)}
  for(const[s,k]of reach){cardEls.get(s)?.classList.add('hl');badge(s,'+'+k)}
  for(const c of n.ctx)ctxEls.get(c)?.classList.add('hl');
  const pts=holders.map(center).sort((p,q)=>p[0]-q[0]||p[1]-q[1]);
  if(pts.length>1){let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const[x1,y1]=pts[i-1],[x2,y2]=pts[i];d+=` C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`}el('path',{class:'trace',d},lTrace)}
  renderNode(n,holders,reach);
}

/* ---------- panel ---------- */
const panel=$('panel');
const artBtn=id=>{const a=A.get(id);if(!a)return `<span class="mono muted">${esc(id)}</span>`;return `<button class="lnk" data-art="${esc(id)}">${glyphSvg(a.type,16)}<span>${esc(shortName(a))}</span></button>`};
const nodeBtn=(id,extra='')=>{const n=N.get(id);if(!n)return `<span class="mono muted">${esc(id)}</span>`;return `<button data-node="${esc(id)}"><span>${esc(nodeName(n))}</span><small>${esc(primaryCls(n)[0]||'')}${extra}</small></button>`};
panel.addEventListener('click',e=>{const b=e.target.closest('[data-art],[data-node],[data-ctx],[data-back],[data-type],[data-cmp],[data-step]');if(!b)return;
  if(b.dataset.cmp){const[o,n]=b.dataset.cmp.split('|');selectCompare(o,n)}else if(b.dataset.step){stopPlay();setTime(+b.dataset.step,true);selectArtifact(b.dataset.art)}else if(b.dataset.art)selectArtifact(b.dataset.art);else if(b.dataset.node)selectNode(b.dataset.node);else if(b.dataset.ctx)selectContext(b.dataset.ctx);
  else if(b.dataset.type)highlightType(b.dataset.type);else clearSelection();panel.scrollTop=0});
function highlightType(t){reset();world.classList.add('dimmed');for(const a of A.values())if(a.type===t)cardEls.get(a.id)?.classList.add('hl')}
const backBtn='<button class="chipbtn back" data-back="1">← Overview</button>';
function groupNodes(list){const m=new Map();for(const n of list){const k=primaryCls(n)[0]||'—';(m.get(k)||m.set(k,[]).get(k)).push(n)}return[...m].sort((a,b)=>b[1].length-a[1].length)}
function nodeGroups(list){return groupNodes(list).map(([k,v])=>`<details ${v.length<=8?'open':''}><summary><b>${esc(k)}</b> <span class="muted">${v.length}</span></summary><div class="list">${v.sort((a,b)=>a.label.localeCompare(b.label)).map(n=>nodeBtn(n.id)).join('')}</div></details>`).join('')}
const srcNames=src=>src.map(s=>esc(shortName(A.get(s))||s)).join(', ');
function renderOverview(){
  const single=DATA.nodes.filter(n=>n.src.length===1).length;
  const q=DATA.nodes.filter(n=>n.cls.includes('Question')||n.cls.includes('Hotspot'));
  const counts={};for(const a of A.values())counts[a.type]=(counts[a.type]||0)+1;
  const TERMY=new Set(['Term','BusinessObject','WorkObject','AggregateRoot','DomainEvent','ReadModel','Entity','Aggregate','Concept']);
  const seen=new Set();const tops=[...DATA.nodes].filter(n=>n.cls.some(c=>TERMY.has(c))).sort((a,b)=>b.src.length-a.src.length).filter(n=>{const k=n.label.toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).slice(0,8);
  const unplaced=DATA.artifacts.filter(a=>isPost(a)&&!a.ctx).length;
  const placedBy=DATA.artifacts.filter(a=>a.ctx&&a.ctxHow&&!a.ctxHow.startsWith("the API")).length;
  panel.innerHTML=`${notice?`<div class="notice${notice.err?' err':''}">${notice.html}</div>`:''}
  <div class="kicker">Overview</div>
  <h2>From the first sticky to the contract</h2>
  ${TIME<TMAX?`<div class="notice">Showing the graph as of <b>step ${TIME} of ${TMAX}</b>: ${esc(shortName(DATA.artifacts.find(a=>a.seq===TIME)))}. Later artifacts are hidden; superseded versions are dashed.</div>`:''}
  <p>The left side holds what the whole team drew together. At the context map the model splits: each lane on the right is one bounded context, carrying its canvases, aggregate glossaries and specifications. Lines on the left join each artifact to the earlier one it shares most terms with.</p>
  <p class="muted">${single} of ${DATA.nodes.length} nodes rest on a single artifact.${placedBy?` ${placedBy} artifact${placedBy>1?'s were':' was'} placed in a lane by inference; the panel says how.`:''}${unplaced?` ${unplaced} could not be placed and sit in the “No context named” lane.`:''}</p>
  <h3>Artifact types</h3>
  <div class="legend">${Object.keys(TYPES).filter(t=>counts[t]).map(t=>`<button data-type="${t}">${glyphSvg(t)}<span>${esc(TYPES[t].name)} <span class="muted">${counts[t]}</span></span></button>`).join('')}</div>
  <h3>Follow a term through the ladder</h3>
  <div class="chips">${tops.map(n=>`<button class="chipbtn" data-node="${esc(n.id)}">${esc(nodeName(n))} <span class="muted">${n.src.length}</span></button>`).join('')}</div>
  <h3>Contradictions · ${DATA.contradictions.length}</h3>
  ${DATA.contradictions.map(([a,b])=>`<div class="contra"><div>${esc(a.text)}</div><div class="muted">${srcNames(a.src)}</div><div class="vs">versus</div><div>${esc(b.text)}</div><div class="muted">${srcNames(b.src)}</div>${a.nodes[0]&&N.has(a.nodes[0])?`<div style="margin-top:4px">${nodeBtn(a.nodes[0])}</div>`:''}</div>`).join('')||'<p class="muted">None recorded.</p>'}
  <h3>Open questions · ${q.length}</h3>
  <details><summary>Show all</summary><div class="list">${q.sort((a,b)=>a.label.localeCompare(b.label)).map(n=>nodeBtn(n.id,' · '+n.src.length+' src')).join('')}</div></details>`;
}
function versionsHtml(a){
  const ch=chainOf(a.id);if(ch.length<2)return '';
  const rowsH=ch.map((id,i)=>{const v=A.get(id),here=id===a.id,sup=supersededAt(id,TMAX);
    return `<div class="vrow${here?' here':''}"><span class="vnum">v${i+1}</span>${glyphSvg(v.type,16)}<div class="vtxt"><button class="lnk" data-art="${esc(id)}">${esc(shortName(v))}</button><small>${esc(TYPES[v.type]?.name||v.type)} · step ${v.seq} · ${esc(v.date||'undated')}${sup?' · superseded':' · current'}</small></div></div>`+
      (i<ch.length-1?`<div class="vstep"><button class="chipbtn" data-cmp="${esc(id)}|${esc(ch[i+1])}">Compare v${i+1} → v${i+2}</button></div>`:'')}).join('');
  const later=ch.filter(id=>A.get(id).seq>a.seq);
  return `<h3>Versions · ${ch.length}</h3>${later.length?`<div class="notice">This version was later re-ingested as <b>${esc(shortName(A.get(later[later.length-1])))}</b>. Compare them to see what changed.</div>`:''}<div class="versions">${rowsH}</div>`;
}
function diffOf(oldId,newId){
  const O=new Set((byArt.get(oldId)||[]).map(n=>n.id)),W=new Set((byArt.get(newId)||[]).map(n=>n.id));
  const carried=[...O].filter(x=>W.has(x)).map(x=>N.get(x)),added=[...W].filter(x=>!O.has(x)).map(x=>N.get(x)),dropped=[...O].filter(x=>!W.has(x)).map(x=>N.get(x));
  const recorded=new Set(DATA.nodes.filter(n=>n.absent.includes(newId)).map(n=>n.id));
  const relinked=[];
  for(const n of carried){for(const e of (OUT.get(n.id)||[])){const t=e[2];if(W.has(t)&&!O.has(t))relinked.push({n,e,t:N.get(t),kind:'now'});else if(O.has(t)&&!W.has(t))relinked.push({n,e,t:N.get(t),kind:'was'})}}
  const redrawn=(DATA.supersedes||[]).filter(x=>x.nw.src.includes(newId)&&x.old.src.includes(oldId));
  return {carried,added,dropped,recorded,relinked,redrawn};
}
function selectCompare(oldId,newId){
  reset();world.classList.add('dimmed');const d=diffOf(oldId,newId);
  for(const id of [oldId,newId])cardEls.get(id)?.classList.add('hl','sel');
  badge(oldId,'−'+d.dropped.length);badge(newId,'+'+d.added.length);
  // what the new version touches elsewhere: artifacts sharing terms with its added or re-linked nodes
  const touch=new Map();for(const n of [...d.added,...d.relinked.map(r=>r.t)])for(const s of n.src)if(s!==oldId&&s!==newId)touch.set(s,(touch.get(s)||0)+1);
  for(const s of touch.keys())cardEls.get(s)?.classList.add('hl');
  if(pos.has(oldId)&&pos.has(newId)){const[ax,ay]=center(oldId),[bx,by]=center(newId);el('path',{class:'diffarrow',d:`M${ax},${ay} Q${(ax+bx)/2},${Math.min(ay,by)-70} ${bx},${by}`,'marker-end':'url(#arrowhead)'},lShare);
    for(const s of touch.keys()){if(!pos.has(s))continue;const[sx,sy]=center(s);el('path',{class:'share',d:`M${bx},${by} Q${(bx+sx)/2},${Math.min(by,sy)-40} ${sx},${sy}`,'stroke-width':1.5},lShare)}}
  renderDiff(A.get(oldId),A.get(newId),d,touch);
}
function renderDiff(o,w,d,touch){
  const sec=(title,list,open)=>list.length?`<details ${open?'open':''}><summary><b>${title}</b> <span class="muted">${list.length}</span></summary>${nodeGroups(list)}</details>`:'';
  const rel=d.relinked.map(r=>`<div class="chg"><button class="lnk" data-node="${esc(r.n.id)}">${esc(nodeName(r.n))}</button> <span class="muted">${esc(predName(r.e[1],false))}</span> ${r.kind==='now'?'<span class="plus">now</span>':'<span class="minus">was</span>'} <button class="lnk" data-node="${esc(r.t.id)}">${esc(nodeName(r.t))}</button></div>`).join('');
  const red=d.redrawn.map(x=>`<div class="chg"><span class="minus">was</span> ${esc(x.old.text)}<br><span class="plus">now</span> ${esc(x.nw.text)}${x.cmt?` <span class="muted">— ${esc(x.cmt)}</span>`:''}</div>`).join('');
  const recordedList=d.dropped.filter(n=>d.recorded.has(n.id)),silent=d.dropped.filter(n=>!d.recorded.has(n.id));
  panel.innerHTML=`${backBtn}<div class="kicker">Compare versions</div>
  <h2>${esc(shortName(o))} → ${esc(shortName(w))}</h2>
  <p class="muted">${esc(TYPES[o.type]?.name||o.type)}, step ${o.seq} (${esc(o.date||'undated')}) → ${esc(TYPES[w.type]?.name||w.type)}, step ${w.seq} (${esc(w.date||'undated')})</p>
  <div class="diffstats"><div><b>${d.carried.length}</b><span>carried over</span></div><div class="plus"><b>+${d.added.length}</b><span>added</span></div><div class="minus"><b>−${d.dropped.length}</b><span>not in newer</span></div><div><b>${d.relinked.length+d.redrawn.length}</b><span>changed</span></div></div>
  <div class="chips" style="margin-top:8px"><button class="chipbtn" data-step="${o.seq}" data-art="${esc(o.id)}">Show the map at step ${o.seq} (older)</button><button class="chipbtn" data-step="${w.seq}" data-art="${esc(w.id)}">Show the map at step ${w.seq} (newer)</button></div>
  ${red?`<h3>Redrawn · ${d.redrawn.length}</h3>${red}`:''}
  ${rel?`<h3>Re-linked · ${d.relinked.length}</h3>${rel}`:''}
  <h3>Contents</h3>
  ${sec('Added in the newer version',d.added,d.added.length<=20)}
  ${sec('Recorded as dropped (absentFrom)',recordedList,true)}
  ${sec('Only in the older version (not restated)',silent,false)}
  ${sec('Carried over',d.carried,false)}
  <h3>Dependencies the newer version touches · ${touch.size}</h3>
  <div class="list">${[...touch].sort((a,b)=>b[1]-a[1]).map(([s,n])=>`<button data-art="${esc(s)}">${glyphSvg(A.get(s)?.type,16)}<span>${esc(shortName(A.get(s))||s)}</span><small>${n} term${n>1?'s':''}</small></button>`).join('')||'<span class="muted">None outside the two versions.</span>'}</div>`;
}
function renderArtifact(a,links){
  const nodes=byArt.get(a.id)||[];const absent=DATA.nodes.filter(n=>n.absent.includes(a.id));const revBy=DATA.artifacts.filter(b=>b.revisionOf.includes(a.id));
  panel.innerHTML=`${backBtn}
  <div class="kicker"><span class="sw" style="background:var(--t-${a.type})"></span>${esc(TYPES[a.type]?.name||a.type)}${a.date?' · ingested '+esc(a.date):''}</div>
  <h2>${esc(shortName(a))}</h2><p class="mono muted">${esc(a.label)}</p>${a.comment?`<p>${esc(a.comment)}</p>`:''}
  ${isPost(a)?(a.ctx?`<p>Bounded context: <button class="lnk" data-ctx="${esc(a.ctx)}">${esc(ctxLabel.get(a.ctx)||a.ctx)}</button> <span class="muted">— ${esc(a.ctxHow)}</span></p>`:'<p class="muted">No bounded context could be worked out for this artifact.</p>'):''}
  ${a.revisionOf.length?`<p>Revision of ${a.revisionOf.map(artBtn).join(' ')}</p>`:''}${revBy.length?`<p>Revised by ${revBy.map(b=>artBtn(b.id)).join(' ')}</p>`:''}
  ${versionsHtml(a)}
  <h3>Shares terms with · ${links.length}</h3>
  <div class="list">${links.slice(0,14).map(([b,n])=>`<button data-art="${esc(b.id)}">${glyphSvg(b.type,16)}<span>${esc(shortName(b))}</span><small>${n} shared</small></button>`).join('')||'<span class="muted">Nothing shared — an island.</span>'}</div>
  <h3>Holds ${nodes.length} nodes</h3>${nodeGroups(nodes)}
  ${absent.length?`<h3>Dropped in this revision · ${absent.length}</h3><div class="list">${absent.map(n=>nodeBtn(n.id)).join('')}</div>`:''}`;
}
function renderContext(id,arts,inCtx){
  const alias=ALIAS.get(id);
  panel.innerHTML=`${backBtn}<div class="kicker"><span class="sw" style="background:var(--t-context-map)"></span>Bounded context</div>
  <h2>${esc(ctxLabel.get(id))}</h2>${alias?`<p class="muted">Also drawn as ${alias.map(esc).join(', ')} (proposed same).</p>`:''}
  <h3>Artifacts in this lane · ${arts.length}</h3><div class="list">${arts.sort((a,b)=>colOf(a)-colOf(b)).map(a=>`<button data-art="${esc(a.id)}">${glyphSvg(a.type,16)}<span>${esc(shortName(a))}</span><small>${esc(TYPES[a.type]?.name||a.type)}</small></button>`).join('')}</div>
  <h3>Nodes placed in this context · ${inCtx.length}</h3>${nodeGroups(inCtx)}`;
}
function renderNode(n,holders,reach){
  const groups=new Map();
  for(const e of (OUT.get(n.id)||[])){const k=predName(e[1],false);(groups.get(k)||groups.set(k,[]).get(k)).push([e[2],e])}
  for(const e of (IN.get(n.id)||[])){const k=predName(e[1],true);(groups.get(k)||groups.set(k,[]).get(k)).push([e[0],e])}
  const contra=DATA.contradictions.filter(([a,b])=>a.nodes.includes(n.id)||b.nodes.includes(n.id));
  panel.innerHTML=`${backBtn}<div class="kicker">${n.cls.map(esc).join(' · ')}</div><h2>${esc(n.label)}</h2>
  <div class="chips">${n.conf?`<span class="chip conf-${esc(n.conf)}">${esc(n.conf)}</span>`:''}<span class="chip">${esc(n.id)}</span>${n.ctx.map(c=>`<button class="chipbtn" data-ctx="${esc(c)}">${esc(ctxLabel.get(c)||c)}</button>`).join('')}</div>
  ${n.alt.length?`<p class="muted">Also spelled: ${n.alt.map(esc).join(' · ')}</p>`:''}${n.comment?`<p>${esc(n.comment)}</p>`:''}${n.ex.length?`<p class="mono">e.g. ${n.ex.map(esc).join(' · ')}</p>`:''}
  <h3>History · appears in ${n.src.length} artifact${n.src.length===1?'':'s'}</h3>${[...n.src].sort((x,y)=>(A.get(x)?.seq||0)-(A.get(y)?.seq||0)).map((s,i)=>`<div class="src hist"><span class="vnum">${A.get(s)?.seq??'?'}</span>${artBtn(s)}<small>${i===0?'first drawn':'restated'} · ${esc(A.get(s)?.date||'')}</small></div>`).join('')}
  ${n.loc.length?`<p class="mono muted">${n.loc.map(esc).join(' · ')}</p>`:''}${n.absent.length?`<p>Dropped in ${n.absent.map(artBtn).join(' ')}</p>`:''}
  ${reach.size?`<p class="muted">Its neighbours reach ${reach.size} further artifact${reach.size===1?'':'s'} (marked +n on the map).</p>`:''}
  ${contra.map(([a,b])=>`<div class="contra"><div>${esc(a.text)}</div><div class="vs">versus</div><div>${esc(b.text)}</div></div>`).join('')}
  <h3>Connections</h3>${[...groups].map(([k,v])=>`<details ${v.length<=6?'open':''}><summary><b>${esc(k)}</b> <span class="muted">${v.length}</span></summary><div class="list">${v.map(([id,e])=>nodeBtn(id,e[1].startsWith('assert')&&e[4]?' · '+esc(e[4]):'')).join('')}</div></details>`).join('')||'<p class="muted">No connections — an orphan.</p>'}`;
}

/* ---------- search ---------- */
const q=$('q'),res=$('results');
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();if(s.length<2){res.hidden=true;return}
  const hits=DATA.nodes.filter(n=>(n.label+' '+n.alt.join(' ')+' '+n.id).toLowerCase().includes(s)).sort((a,b)=>(b.src.length-a.src.length)||a.label.length-b.label.length).slice(0,14);
  res.innerHTML=hits.map(n=>`<button data-node="${esc(n.id)}"><span>${esc(nodeName(n))}</span><small>${esc(primaryCls(n)[0]||'')} · ${n.src.length}</small></button>`).join('')||'<button disabled><span class="muted">Nothing matches</span></button>';res.hidden=false});
res.addEventListener('click',e=>{const b=e.target.closest('[data-node]');if(!b)return;selectNode(b.dataset.node);res.hidden=true;q.value=''});
q.addEventListener('keydown',e=>{if(e.key==='Escape'){res.hidden=true;q.blur()}if(e.key==='Enter')res.querySelector('[data-node]')?.click()});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))res.hidden=true});

/* ---------- loading ---------- */
const BUILTIN=()=>new TextDecoder().decode(Uint8Array.from(atob($('ttl64').textContent.trim()),c=>c.charCodeAt(0)));
function open(text,name,builtin){
  try{
    if(typeof N3==='undefined')throw new Error('The Turtle parser did not load. Check the connection and reload the page.');
    const m=buildModel(text);
    if(!m.artifacts.length)throw new Error('No artifacts found. The file parsed, but nothing in it is a dkg:Artifact or carries dkg:source — is it a domain knowledge graph?');
    SOURCE_NAME=name;index(m);
    notice=builtin?null:{html:`Opened <b>${esc(name)}</b>: ${m.triples.toLocaleString()} triples, ${m.artifacts.length} artifacts, ${m.nodes.length} nodes.`};
    $('resetbtn').hidden=!!builtin;draw();renderOverview();
  }catch(err){
    notice={err:true,html:`Could not open <b>${esc(name)}</b>. ${esc(err.message||err)}`};
    if(DATA)renderOverview();else panel.innerHTML=`<div class="notice err">${notice.html}</div>`;
  }
}
function readFile(f){if(!f)return;const r=new FileReader();r.onload=()=>open(String(r.result),f.name,false);r.onerror=()=>{notice={err:true,html:`Could not read <b>${esc(f.name)}</b>.`};renderOverview()};r.readAsText(f)}
$('loadbtn').onclick=()=>$('file').click();
$('file').onchange=e=>{readFile(e.target.files[0]);e.target.value=''};
$('resetbtn').onclick=()=>open(BUILTIN(),'Larder graph (built in)',true);
const stage=document.querySelector('.stage'),drop=$('drop');let depth=0;
stage.addEventListener('dragenter',e=>{if([...(e.dataTransfer?.types||[])].includes('Files')){e.preventDefault();depth++;drop.hidden=false}});
stage.addEventListener('dragover',e=>{if([...(e.dataTransfer?.types||[])].includes('Files'))e.preventDefault()});
stage.addEventListener('dragleave',()=>{if(--depth<=0){depth=0;drop.hidden=true}});
stage.addEventListener('drop',e=>{e.preventDefault();depth=0;drop.hidden=true;readFile(e.dataTransfer.files[0])});

open(BUILTIN(),'Larder graph (built in)',true);
})();
</script>
