x-design-assumptions:
- The canvas governs operations and paths; the glossary governs fields and cardinalities. Field descriptions are
  draft interpretations for domain expert review.
- 'Authentication and audience are unspecified. Proposed default: public-client OAuth2 authorization code with PKCE,
  recipes:read and recipes:write scopes. Authorization and token URLs under auth.example.com are placeholders and
  MUST be replaced before deployment.'
- A required version header is a house-style addition, not a canvas requirement.
- Recipe, ingredient, and howToStep IDs are server-generated UUIDs. The recipe owner is the authenticated principal
  mapped to an owner UUID and cannot be transferred through this API.
- Only the recipe owner can mutate it or any nested resource. Applying this to nested POST operations is inferred;
  the canvas explicitly marks PATCH, PUT, and DELETE.
- Preparation time is provisionally an HH:MM duration, with 02:00 interpreted as two hours. Confirm the time unit
  before implementation.
- Search uses exact meal/diet values and case-insensitive exact ingredient names; all supplied ingredient names
  must match. Filters combine with AND. Pagination and sorting are unspecified and intentionally omitted.
- PATCH uses application/merge-patch+json. Omitted fields remain unchanged; null removes optional values. Ingredients
  and howToSteps arrays are changed through their nested endpoints, not recipe PATCH.
- The glossary spelling Gramm is preserved as GRAMM. Meal, diet, and unit leaf terms are treated as closed enumerations.
- The plural /meals path is preserved from the canvas but returns or replaces one meal, reflecting glossary cardinality
  1.
- Download recipe means GET the complete JSON recipe. The canvas supplies no separate binary or PDF export operation.
- Create/update link responses use a JSON href property; create responses also supply Location. The canvas does
  not specify a link representation.
- Positive ingredient quantities and servings, nonempty text, unique ingredient/step IDs within a recipe, and unique
  positive step sequence numbers are proposed domain rules. Sequence numbers need not be contiguous.
- Removing the last ingredient or last step is rejected with 400 to preserve glossary minimum cardinalities. Aggregate
  deletion removes its owned children.
- The canvas recipe DELETE omits 404; this draft adds 404 for consistency with the other item operations. Obvious
  response-label typos are interpreted as singular resources.
