      description: Collection of recipe ingredients response
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                description: List of ingredients for the specified recipe.
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'

    HowToStepResponse:
