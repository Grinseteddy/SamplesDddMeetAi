# Local infrastructure for Larder. Development only: credentials are placeholders.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: larder
      POSTGRES_USER: larder_admin
      POSTGRES_PASSWORD: larder_admin
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/docker-entrypoint-initdb.d:ro

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: larder
      RABBITMQ_DEFAULT_PASS: larder
    ports:
      - "5672:5672"
      - "15672:15672"

  # S3-compatible bucket for the Media context (ADR0001: Media wraps an external bucket).
  # RustFS with a volume, so images survive restarts like the database does (the MinIO images are not
  # pullable here; S3Mock does not reload its files after a restart and serves only the tests).
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: larder
      RUSTFS_SECRET_KEY: larder-local
    ports:
      - "9090:9000"
    volumes:
      - s3-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # Local dev realm "larder": public client larder-dev, test user cook/cook,
    # every access token carries all API scopes and a fixed cookId claim.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  s3-data:
