<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ADR & Principles browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#1b1f24; --muted:#6b7280; --rule:#e5e7eb; --bg:#ffffff; --side:#f7f8fa;
          --ok:#1a7f4b; --okbg:#e6f4ec; --bad:#b42318; --badbg:#fdecea; --warn:#9a6700; --warnbg:#fff4d6;
          --cite:#1f5fbf; --citebg:#e8effb; --dead:#6b7280; --deadbg:#f1f2f4; --defect:#7a2e9e; --defectbg:#f3e8fa; }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); display:grid; grid-template-columns:280px 1fr; min-height:100vh }
  aside { background:var(--side); border-right:1px solid var(--rule); padding:16px; overflow:auto; position:sticky; top:0; height:100vh }
  main { padding:24px 32px; max-width:1100px }
  h1 { font-size:16px; margin:0 0 12px } h2 { font-size:15px; margin:22px 0 8px } h3 { font-size:13px; color:var(--muted); font-weight:600; margin:18px 0 6px; text-transform:uppercase; letter-spacing:.04em }
  .side-sec { margin-top:14px } .side-sec h3 { margin:0 0 4px }
  .nav a { display:block; padding:4px 8px; border-radius:6px; color:var(--ink); text-decoration:none; font-size:13px; cursor:pointer }
  .nav a:hover { background:#e9ecf0 } .nav a.active { background:#dfe6ef; font-weight:600 }
  .nav .sub { color:var(--muted); font-size:11.5px; margin-left:2px }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--rule); background:#fff; margin:2px 4px 2px 0; cursor:pointer; white-space:nowrap }
  .pill:hover { border-color:#9aa3ad }
  .pill.ok { background:var(--okbg); border-color:#bfe3cf; color:var(--ok) }
  .pill.bad { background:var(--badbg); border-color:#f3c2bd; color:var(--bad) }
  .pill.warn { background:var(--warnbg); border-color:#f0dfa8; color:var(--warn) }
  .pill.cite { background:var(--citebg); border-color:#c4d4f2; color:var(--cite) }
  .pill.dead { background:var(--deadbg); color:var(--dead) }
  .pill.defect { background:var(--defectbg); border-color:#dcc4ea; color:var(--defect) }
  .tag { font-size:11px; color:var(--muted); margin-right:6px }
  .card { border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:10px 0; background:#fff }
  .card.bad { border-color:#f3c2bd; background:#fff9f8 } .card.warn { border-color:#f0dfa8; background:#fffdf5 } .card.defect { border-color:#dcc4ea; background:#fcf8fe }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:4px 14px; font-size:13px } .kv dt { color:var(--muted) } .kv dd { margin:0 }
  blockquote { margin:6px 0; padding:6px 12px; border-left:3px solid var(--rule); color:#374151; font-size:13px }
  table { border-collapse:collapse; width:100%; font-size:13px; margin:8px 0 } th, td { border-bottom:1px solid var(--rule); padding:7px 8px; text-align:left; vertical-align:top } th { color:var(--muted); font-weight:500; font-size:11.5px }
  .muted { color:var(--muted) } .small { font-size:12px } .num { font-variant-numeric:tabular-nums }
  .stat { display:inline-block; min-width:120px; padding:10px 14px; border:1px solid var(--rule); border-radius:10px; margin:4px 8px 4px 0; cursor:pointer } .stat b { display:block; font-size:22px } .stat.bad b { color:var(--bad) } .stat.ok b { color:var(--ok) } .stat.warn b { color:var(--warn) } .stat.dead b { color:var(--dead) } .stat.defect b { color:var(--defect) }
  .matrix td.c { text-align:center } .matrix .cell { display:inline-block; width:22px; height:22px; border-radius:6px; line-height:22px; font-size:12px; cursor:pointer } .matrix .h { background:var(--okbg); color:var(--ok) } .matrix .o { background:var(--badbg); color:var(--bad) } .matrix .oa { background:var(--warnbg); color:var(--warn) } .matrix .ci { outline:2px solid var(--cite) } .matrix th.rot { writing-mode:vertical-rl; transform:rotate(180deg); height:130px; font-size:11px }
  .crumbs { font-size:12px; color:var(--muted); margin-bottom:8px } .crumbs a { color:var(--cite); cursor:pointer }
  input[type=file] { font-size:12px; width:100% } .drop { border:1px dashed #b7c0cb; border-radius:8px; padding:10px; font-size:12px; color:var(--muted); text-align:center }
  .legend span { margin-right:10px } .status { font-size:11px; padding:1px 6px; border-radius:4px; background:#eef0f3; color:#374151 }
  .status.superseded { text-decoration:line-through; color:var(--muted) }
  #panel { position:fixed; right:0; top:0; bottom:0; width:360px; background:#fff; border-left:1px solid var(--rule); box-shadow:-6px 0 18px rgba(0,0,0,.06); padding:18px; overflow:auto; transform:translateX(100%); transition:transform .15s } #panel.open { transform:none } #panel .close { float:right; cursor:pointer; color:var(--muted) }
  pre { white-space:pre-wrap; font-size:12px; background:#f7f8fa; padding:8px; border-radius:6px }
</style>
</head>

@prefix dkg:  <https://w3id.org/dkg/ns#> .
@prefix :     <https://w3id.org/dkg/graph/larder#> .
@prefix rdf:  <http://www.w3.org/1999/02/22-rdf-syntax-ns#> .
@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .
@prefix owl:  <http://www.w3.org/2002/07/owl#> .
@prefix skos: <http://www.w3.org/2004/02/skos/core#> .
@prefix xsd:  <http://www.w3.org/2001/XMLSchema#> .

<https://w3id.org/dkg/graph/larder>
    a owl:Ontology ;
    owl:imports <https://w3id.org/dkg/ns> , <https://w3id.org/dkg/ns/adr> ;
    rdfs:label "Larder — ADR & principles knowledge graph (seed; base IRI matches the project's existing graph so this file can be merged into it)" .

##############################################################################
# Artifacts
##############################################################################

:Art_Principles_Larder a dkg:PrinciplesDocument , dkg:Artifact ;
    rdfs:label "LarderArchitecturalPrinciples.md" ;
    rdfs:comment "9 entries under 8 IDs; all Adopted, all last amended 2026-09-10." ;
    dkg:defect "Two entries share the ID AP0005: 'Automatic Testing' and 'Micro-UIs'. Disambiguated in IRIs only (AP0005a / AP0005b); the document needs renumbering." ;
    dkg:ingestedAt "2026-09-13"^^xsd:date .

:Art_ADR_ADR0001 a dkg:ADRDocument , dkg:Artifact ; rdfs:label "ADR0001-Monolith.md" ; dkg:ingestedAt "2026-09-13"^^xsd:date .
:Art_ADR_ADR0002 a dkg:ADRDocument , dkg:Artifact ; rdfs:label "ADR0002-Database.md" ; dkg:ingestedAt "2026-09-13"^^xsd:date ;
    dkg:defect "Consequences table columns are headed 'Modular Monolith / Microservices / Monolith' — copied from ADR0001 — although the options compared are three database layouts." .
:Art_ADR_ADR0003 a dkg:ADRDocument , dkg:Artifact ; rdfs:label "ADR0003-AsynchronousCommunication.md" ; dkg:ingestedAt "2026-09-13"^^xsd:date .
:Art_ADR_ADR0004 a dkg:ADRDocument , dkg:Artifact ; rdfs:label "ADR0004-SynchronousCommunicationViaMicroUi.md" ; dkg:ingestedAt "2026-09-13"^^xsd:date .
:Art_ADR_ADR0005 a dkg:ADRDocument , dkg:Artifact ; rdfs:label "ADR0005-Orchestrator.md" ; dkg:ingestedAt "2026-09-13"^^xsd:date .

:Art_ADRLog_SadrsLarder a dkg:ADRLog ;
    rdfs:label "SadrsLarder.md — small ADR log" ;
    rdfs:comment "7 rows, SADR0001–SADR0007, one author. Same IRIs as the project's existing graph uses for these rows." ;
    dkg:ingestedAt "2026-09-13"^^xsd:date .

##############################################################################
# Principles
##############################################################################

:Prin_AP0001_MonolithFirst a dkg:Principle ;
    skos:prefLabel "Monolith before Microservices" ; dkg:principleId "AP0001" ;
    dkg:statement "We will always start with a deployment monolith before cutting services out. However, the modules are modular regarding DDD principles." ;
    dkg:rationale "In the beginning, we do not know exactly the load and performance issues the single services have to face. Therefore, we will cut later with more experience." ;
    dkg:implication "We will have later costs for cutting out services. The teams need to be disciplined to follow the strict boundaries of the Bounded Contexts." ;
    dkg:scope "deployment shape and service cutting" ; dkg:testable true ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0001" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0002_AsyncBetweenContexts a dkg:Principle ;
    skos:prefLabel "Asynchronous Communication before Synchronous" ; dkg:principleId "AP0002" ;
    dkg:statement "For communication between Bounded Contexts asynchronous communication is preferred." ;
    dkg:rationale "Asynchronous communication guarantees the loose coupling between Bounded Contexts." ;
    dkg:implication "Loose coupling guarantees that we can later maintain and operate our application without large downtimes." ;
    dkg:scope "communication between Bounded Contexts" ; dkg:testable true ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0002" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0003_DDD a dkg:Principle ;
    skos:prefLabel "Using DDD" ; dkg:principleId "AP0003" ;
    dkg:statement "For design of our functional architecture, we will apply the principles of DDD." ;
    dkg:rationale "Architecture coming out of the blue does not support the business requirements functionally." ;
    dkg:implication "We need to support the functions required by business. Moreover, we need to support the maintenance of those functions for the upcoming years." ;
    dkg:scope "functional architecture design (a method principle)" ; dkg:testable true ;
    rdfs:comment "Testable only weakly: a decision either visibly starts from bounded-context / domain-event language or it does not." ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0003" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0004_Residuality a dkg:Principle ;
    skos:prefLabel "Using Residuality" ; dkg:principleId "AP0004" ;
    dkg:statement "For design of our technical architecture, we will apply the principles of Residuality Theory." ;
    dkg:rationale "Stressing an architecture with randomly selected stressors creates more sustaining architectures." ;
    dkg:implication "We do not know what future brings, therefore, we need the robust and best equipped architecture." ;
    dkg:scope "technical architecture design" ; dkg:testable true ;
    rdfs:comment "Checkable only once a decision documents a stressor analysis; none of ADR0001–0005 does." ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0004" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0005a_AutomaticTesting a dkg:Principle ;
    skos:prefLabel "Automatic Testing" ; dkg:principleId "AP0005" ;
    dkg:statement "We can test our system by 95% automatically." ;
    dkg:rationale "Manual tests are too slow to allow us to test our system manually." ;
    dkg:implication "We need to follow a Test-Driven-Approach consequently." ;
    dkg:scope "testing approach" ; dkg:testable true ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0005 (first entry)" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0005b_MicroUIs a dkg:Principle ;
    skos:prefLabel "Micro-UIs" ; dkg:principleId "AP0005" ;
    dkg:statement "The Bounded Context publish their own UI as micro-UIs." ;
    dkg:rationale "The teams developing the Bounded Contexts must be as independent as possible. The UIs are part of the Bounded Contexts projects. The micro UIs can use a common platform, so that they appear out of one hand." ;
    dkg:implication "Using a large monolithic frontend would us slow down." ;
    dkg:scope "UI ownership and team independence" ; dkg:testable true ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0005 (second entry)" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0006_SyncForUIs a dkg:Principle ;
    skos:prefLabel "Synchronous communication for UIs" ; dkg:principleId "AP0006" ;
    dkg:statement "UI communication is done synchronously." ;
    dkg:rationale "UIs require synchronous communication." ;
    dkg:implication "UIs must communicate with humans, who expect to get immediate answers." ;
    dkg:scope "UI communication" ; dkg:testable true ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0006" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0007_Monitoring a dkg:Principle ;
    skos:prefLabel "Monitoring" ; dkg:principleId "AP0007" ;
    dkg:statement "The system can be monitored to identify system-critical states reliable and fast." ;
    dkg:rationale "The operation of the software must be almost completely automated. We need to get a reliable alarm system based on a reliable monitoring system" ;
    dkg:implication "Using a large monolithic frontend would us slow down." ;
    dkg:defect "Implications text is identical to AP0005 (Micro-UIs) and unrelated to monitoring — copy-paste error, preserved verbatim." ;
    dkg:scope "operations / observability" ; dkg:testable true ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0007" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0008_FineGrainedAccess a dkg:Principle ;
    skos:prefLabel "Fine grained access rights" ; dkg:principleId "AP0008" ;
    dkg:statement "Domain artifacts are controlled by a fine-grained access control." ;
    dkg:rationale "The software will increase with time, and we need to respect the personal and author rights of our users." ;
    dkg:implication "With more coarse grained rights, we could contradict legal regulations." ;
    dkg:scope "access control on domain artifacts and user data" ; dkg:testable true ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0008" ; dkg:confidence dkg:OnArtifact .

# AP0002 vs AP0006 examined for tension: dissolved by scope (between contexts vs UI-facing);
# ADR0003 / ADR0004 respect that split. No dkg:inTensionWith emitted on purpose.

##############################################################################
# Decisions — full-form ADRs
##############################################################################

:Q_DeploymentShape_ADR0001 a dkg:Question ;
    skos:prefLabel "Which deployment shape for Larder's Bounded Contexts — modular monolith, microservices, or plain monolith?" ;
    dkg:source :Art_ADR_ADR0001 ; dkg:locator "Context / Options considered" ; dkg:confidence dkg:Implied .

:D_ADR0001 a dkg:Decision ;
    skos:prefLabel "Using Monolith" ; dkg:decisionId "ADR0001" ; dkg:sourceFormat "full-form" ;
    dkg:status "Adopted" ; dkg:decidedAt "2026-09-10"^^xsd:date ; dkg:decidedBy "Annegret Junker, Architect" ;
    dkg:decidedOption "We will implement Larder as Monolith." ;
    dkg:rationale "We defined Bounded Contexts of the Larder application. Those Bounded Contexts are modules in our application." ;
    dkg:consideredOption "Modular monolith" , "Microservices" , "Monolith" ;
    dkg:consequence "Implementation: higher effort" , "Maintenance: higher effort" , "Operation: small effort" , "Enhancements: small effort" ;
    dkg:defect "Bolded Decision line reads 'Monolith', but the document's own Options section marks plain Monolith as contradicting AP0001; the module list, per-module schema and ADR0002 are consistent only with 'Modular monolith'. Cross-check taken on the modular reading; the line needs correcting." ;
    dkg:answers :Q_DeploymentShape_ADR0001 ;
    dkg:cites :Prin_AP0001_MonolithFirst ;
    dkg:honors :Prin_AP0001_MonolithFirst , :Prin_AP0003_DDD ;
    dkg:source :Art_ADR_ADR0001 ; dkg:locator "ADR0001" ; dkg:confidence dkg:OnArtifact .

:As_ADR0001_honors_AP0001 a dkg:Assertion ;
    rdf:subject :D_ADR0001 ; rdf:predicate dkg:honors ; rdf:object :Prin_AP0001_MonolithFirst ;
    dkg:citedBy "explicit" ;
    rdfs:comment "Modular monolith option: 'Easy to maintain and to operate (see AP0001)'. Holds on the modular reading only — see the defect on D_ADR0001." ;
    dkg:source :Art_ADR_ADR0001 ; dkg:confidence dkg:OnArtifact .
:As_ADR0001_honors_AP0003 a dkg:Assertion ;
    rdf:subject :D_ADR0001 ; rdf:predicate dkg:honors ; rdf:object :Prin_AP0003_DDD ;
    dkg:citedBy "incidental" ;
    rdfs:comment "Context: modules are the Bounded Contexts from the DDD analysis; AP0003 never named." ;
    dkg:source :Art_ADR_ADR0001 ; dkg:confidence dkg:Implied .

:Q_DatabaseLayout_ADR0002 a dkg:Question ;
    skos:prefLabel "One database instance with a schema per Bounded Context, one instance per context, or one shared database?" ;
    dkg:source :Art_ADR_ADR0002 ; dkg:locator "Options considered" ; dkg:confidence dkg:Implied .

:D_ADR0002 a dkg:Decision ;
    skos:prefLabel "Using One Database Instance" ; dkg:decisionId "ADR0002" ; dkg:sourceFormat "full-form" ;
    dkg:status "Adopted" ; dkg:decidedAt "2026-09-10"^^xsd:date ; dkg:decidedBy "Annegret Junker, Architect" ;
    dkg:decidedOption "We will use one database instance for Larder." ;
    dkg:rationale "The Bounded Contexts modules in the modular monolith need databases. The modules use one database instance with decoupled schemas. Each module gets its own database user who can only access the belonging schema." ;
    dkg:consideredOption "One database instance with schemas per Bounded Context" , "One database instance per Bounded Contexts" , "One database for all" ;
    dkg:consequence "Implementation: more discipline" , "Maintenance: easier" , "Operation: secure" , "Enhancements: small effort" ;
    dkg:answers :Q_DatabaseLayout_ADR0002 ;
    dkg:cites :Prin_AP0001_MonolithFirst ;
    dkg:honors :Prin_AP0001_MonolithFirst ;
    dkg:source :Art_ADR_ADR0002 ; dkg:locator "ADR0002" ; dkg:confidence dkg:OnArtifact .

:As_ADR0002_honors_AP0001 a dkg:Assertion ;
    rdf:subject :D_ADR0002 ; rdf:predicate dkg:honors ; rdf:object :Prin_AP0001_MonolithFirst ;
    dkg:citedBy "explicit" ;
    rdfs:comment "Chosen option cites AP0001 twice; both rejected options are marked as contradicting it. AP0008 considered and not asserted: schema/DB-user isolation is module-level, not the user-rights scope AP0008 states." ;
    dkg:source :Art_ADR_ADR0002 ; dkg:confidence dkg:OnArtifact .

:Q_AsyncBorders_ADR0003 a dkg:Question ;
    skos:prefLabel "How do Cooking Assistance ↔ Notification and Cooking Assistance ↔ Grandma Avatar communicate — asynchronously (RabbitMQ or Kafka) or synchronously?" ;
    dkg:source :Art_ADR_ADR0003 ; dkg:locator "Context" ; dkg:confidence dkg:Implied .

:D_ADR0003 a dkg:Decision ;
    skos:prefLabel "Using Asynchronous Communication" ; dkg:decisionId "ADR0003" ; dkg:sourceFormat "full-form" ;
    dkg:status "Adopted" ; dkg:decidedAt "2026-09-10"^^xsd:date ; dkg:decidedBy "Annegret Junker, Architect" ;
    dkg:decidedOption "We will use asynchronous communication with RabbitMQ." ;
    dkg:rationale "Cooking Assistance and Notification and Cooking Assistance and Grandma Avatar need asynchronous communication based on the DDD analysis (Context Map)." ;
    dkg:consideredOption "Asynchronous communication via RabbitMQ" , "Asynchronous communication via Kafka" , "Using of synchronous communication" ;
    dkg:consequence "Implementation: medium effort" , "Available skills: available" , "Functional: suited" ;
    rdfs:comment "RabbitMQ vs Kafka is not a principle question — both options cite AP0002; the deciding factor was skill availability." ;
    dkg:answers :Q_AsyncBorders_ADR0003 ;
    dkg:cites :Prin_AP0002_AsyncBetweenContexts ;
    dkg:honors :Prin_AP0002_AsyncBetweenContexts , :Prin_AP0003_DDD ;
    dkg:source :Art_ADR_ADR0003 ; dkg:locator "ADR0003" ; dkg:confidence dkg:OnArtifact .

:As_ADR0003_honors_AP0002 a dkg:Assertion ;
    rdf:subject :D_ADR0003 ; rdf:predicate dkg:honors ; rdf:object :Prin_AP0002_AsyncBetweenContexts ;
    dkg:citedBy "explicit" ;
    rdfs:comment "'It is supported by principles (see AP0002)'; rejected synchronous option 'contradicts AP0002'." ;
    dkg:source :Art_ADR_ADR0003 ; dkg:confidence dkg:OnArtifact .
:As_ADR0003_honors_AP0003 a dkg:Assertion ;
    rdf:subject :D_ADR0003 ; rdf:predicate dkg:honors ; rdf:object :Prin_AP0003_DDD ;
    dkg:citedBy "incidental" ;
    rdfs:comment "'based on the DDD analysis', with the Context Map cited — AP0003 itself never named." ;
    dkg:source :Art_ADR_ADR0003 ; dkg:confidence dkg:Implied .

:Q_UIProtocol_ADR0004 a dkg:Question ;
    skos:prefLabel "Which protocol for UI-facing communication — REST, GraphQL, or asynchronous WebHooks?" ;
    dkg:source :Art_ADR_ADR0004 ; dkg:locator "Options considered" ; dkg:confidence dkg:Implied .

:D_ADR0004 a dkg:Decision ;
    skos:prefLabel "Synchronous Communication per UI" ; dkg:decisionId "ADR0004" ; dkg:sourceFormat "full-form" ;
    dkg:status "Adopted" ; dkg:decidedAt "2026-09-10"^^xsd:date ; dkg:decidedBy "Annegret Junker, Architect" ;
    dkg:decidedOption "We will use synchronous communication for User Interfaces." ;
    dkg:rationale "Most of the Bounded Contexts need user interactions that should be done synchronously via REST API." ;
    dkg:consideredOption "Synchronous via REST API" , "Synchronous via GraphQL" , "Using of asynchronous communication with WebHooks" ;
    dkg:consequence "Implementation: small effort" , "Security: fine grained" ;
    dkg:answers :Q_UIProtocol_ADR0004 ;
    dkg:cites :Prin_AP0006_SyncForUIs , :Prin_AP0008_FineGrainedAccess ;
    dkg:honors :Prin_AP0006_SyncForUIs , :Prin_AP0008_FineGrainedAccess ;
    dkg:source :Art_ADR_ADR0004 ; dkg:locator "ADR0004" ; dkg:confidence dkg:OnArtifact .

:As_ADR0004_honors_AP0006 a dkg:Assertion ;
    rdf:subject :D_ADR0004 ; rdf:predicate dkg:honors ; rdf:object :Prin_AP0006_SyncForUIs ;
    dkg:citedBy "explicit" ;
    rdfs:comment "REST and GraphQL options both 'supported by principles (see AP0006)'; WebHooks 'contradicts AP0006'." ;
    dkg:source :Art_ADR_ADR0004 ; dkg:confidence dkg:OnArtifact .

<script>
/* =========================== Turtle parser =========================== */
const DKG = 'https://w3id.org/dkg/ns#', RDF_ = 'http://www.w3.org/1999/02/22-rdf-syntax-ns#',
      RDFS_ = 'http://www.w3.org/2000/01/rdf-schema#', SKOS_ = 'http://www.w3.org/2004/02/skos/core#';
function parseTurtle(text) {
  const prefixes = {}; let base = ''; const triples = [];
  let i = 0; const n = text.length;
  const ws = () => { for (;;) { while (i < n && /\s/.test(text[i])) i++; if (text[i] === '#') { while (i < n && text[i] !== '\n') i++; } else break; } };
  const err = m => { throw new Error(m + ' at ' + i + ': ' + text.slice(i, i + 40)); };
  function iriRef() { const e = text.indexOf('>', i); const v = text.slice(i + 1, e); i = e + 1; return { t: 'iri', v: v.startsWith('#') ? base + v : (/^[a-z][a-z0-9+.-]*:/i.test(v) ? v : base + v) }; }
  function pname() { let s = i; while (i < n && /[A-Za-z0-9_\-.:\u00C0-\uFFFF%]/.test(text[i])) i++; let tok = text.slice(s, i); if (tok.endsWith('.')) { tok = tok.slice(0, -1); i--; }
    const c = tok.indexOf(':'); if (c < 0) { if (tok === 'true' || tok === 'false') return { t: 'lit', v: tok, dt: 'http://www.w3.org/2001/XMLSchema#boolean' }; err('bad token ' + tok); }
    const p = tok.slice(0, c), l = tok.slice(c + 1); if (!(p in prefixes)) err('unknown prefix ' + p); return { t: 'iri', v: prefixes[p] + l }; }
  function literal() { let q = text.startsWith('"""', i) ? '"""' : text.startsWith("'''", i) ? "'''" : text[i]; i += q.length; let s = ''; 
    for (;;) { if (text.startsWith(q, i)) { i += q.length; break; } let ch = text[i++]; if (ch === '\\') { const e = text[i++]; s += ({ n: '\n', t: '\t', r: '\r', '"': '"', "'": "'", '\\': '\\' })[e] ?? (e === 'u' ? (() => { const h = text.substr(i, 4); i += 4; return String.fromCharCode(parseInt(h, 16)); })() : e); } else s += ch; }
    const lit = { t: 'lit', v: s }; if (text[i] === '@') { let s2 = ++i; while (/[A-Za-z0-9-]/.test(text[i])) i++; lit.lang = text.slice(s2, i); }
    else if (text.startsWith('^^', i)) { i += 2; lit.dt = (text[i] === '<' ? iriRef() : pname()).v; } return lit; }
  function term() { ws(); const c = text[i];
    if (c === '<') return iriRef(); if (c === '"' || c === "'") return literal();
    if (/[-+0-9.]/.test(c)) { let s = i; while (/[-+0-9.eE]/.test(text[i])) i++; let v = text.slice(s, i); if (v.endsWith('.') ) { v = v.slice(0,-1); i--; } return { t: 'lit', v, dt: /[.eE]/.test(v) ? 'http://www.w3.org/2001/XMLSchema#decimal' : 'http://www.w3.org/2001/XMLSchema#integer' }; }
    if (c === '[') { i++; ws(); if (text[i] === ']') { i++; return { t: 'bnode', v: '_:b' + (triples.length) + Math.random() }; } const b = { t: 'bnode', v: '_:b' + triples.length + '_' + Math.random().toString(36).slice(2) }; predObjList(b); ws(); if (text[i] !== ']') err('] expected'); i++; return b; }
    if (c === '(') { i++; const items = []; for (;;) { ws(); if (text[i] === ')') { i++; break; } items.push(term()); } let head = { t: 'iri', v: RDF_ + 'nil' };
      for (let k = items.length - 1; k >= 0; k--) { const b = { t: 'bnode', v: '_:l' + Math.random().toString(36).slice(2) }; triples.push([b, { t: 'iri', v: RDF_ + 'first' }, items[k]]); triples.push([b, { t: 'iri', v: RDF_ + 'rest' }, head]); head = b; } return head; }
    if (text.startsWith('a', i) && /\s/.test(text[i + 1] || ' ')) { i++; return { t: 'iri', v: RDF_ + 'type' }; }
    return pname(); }
  function predObjList(subj) { for (;;) { ws(); if (text[i] === ']' || text[i] === '.' || i >= n) return; const p = term(); for (;;) { const o = term(); triples.push([subj, p, o]); ws(); if (text[i] === ',') { i++; continue; } break; } ws(); if (text[i] === ';') { i++; ws(); if (text[i] === ';') continue; continue; } return; } }
  for (;;) { ws(); if (i >= n) break;
    if (text.startsWith('@prefix', i) || /^prefix\s/i.test(text.slice(i, i + 7))) { i += 7; ws(); const e = text.indexOf(':', i); const p = text.slice(i, e).trim(); i = e + 1; ws(); const ref = iriRef(); prefixes[p] = ref.v; ws(); if (text[i] === '.') i++; continue; }
    if (text.startsWith('@base', i) || /^base\s/i.test(text.slice(i, i + 5))) { i += 5; ws(); base = iriRef().v; ws(); if (text[i] === '.') i++; continue; }
    const s = term(); predObjList(s); ws(); if (text[i] === '.') i++; else err('. expected'); }
  return { triples, prefixes };
}

/* =========================== Graph model =========================== */
const state = { nodes: new Map(), principles: [], decisions: [], artifacts: [], questions: [], assertions: [], fileName: '', view: null };
const local = iri => iri.includes('#') ? iri.split('#').pop() : iri.split('/').pop();
const P = s => DKG + s;
function build(text, name) {
  const { triples } = parseTurtle(text);
  const nodes = new Map();
  const get = id => { if (!nodes.has(id)) nodes.set(id, { id, types: new Set(), lits: [], out: [], in: [] }); return nodes.get(id); };
  for (const [s, p, o] of triples) { const sn = get(s.v); if (o.t === 'lit') sn.lits.push({ p: p.v, v: o.v, dt: o.dt }); else { const on = get(o.v); sn.out.push({ p: p.v, o: o.v }); on.in.push({ p: p.v, s: s.v }); if (p.v === RDF_ + 'type') sn.types.add(o.v); } }
  const subclass = new Map(); for (const [s, p, o] of triples) if (p.v === RDFS_ + 'subClassOf' && o.t !== 'lit') { if (!subclass.has(s.v)) subclass.set(s.v, new Set()); subclass.get(s.v).add(o.v); }
  const isA = (nd, cls) => { const seen = new Set(); const st = [...nd.types]; while (st.length) { const t = st.pop(); if (t === P(cls)) return true; if (seen.has(t)) continue; seen.add(t); for (const sup of (subclass.get(t) || [])) st.push(sup); } return false; };
  Object.assign(state, { nodes, fileName: name, isA });
  state.principles = [...nodes.values()].filter(x => isA(x, 'Principle')).sort((a, b) => local(a.id).localeCompare(local(b.id)));
  state.decisions = [...nodes.values()].filter(x => isA(x, 'Decision')).sort((a, b) => (lit(a, 'decidedAt') || '').localeCompare(lit(b, 'decidedAt') || '') || local(a.id).localeCompare(local(b.id)));
  state.artifacts = [...nodes.values()].filter(x => isA(x, 'Artifact') || [...x.types].some(t => /PrinciplesDocument|ADRDocument|ADRLog/.test(t)));
  state.questions = [...nodes.values()].filter(x => isA(x, 'Question'));
  state.assertions = [...nodes.values()].filter(x => x.types.has(P('Assertion')));
  state.reif = new Map(); for (const a of state.assertions) { const s = a.out.find(e => e.p === RDF_ + 'subject')?.o, p = a.out.find(e => e.p === RDF_ + 'predicate')?.o, o = a.out.find(e => e.p === RDF_ + 'object')?.o; if (s && p && o) state.reif.set(s + '|' + p + '|' + o, a); }
}
const lit = (nd, prop, ns = DKG) => nd?.lits.find(l => l.p === ns + prop)?.v;
const lits = (nd, prop, ns = DKG) => nd ? nd.lits.filter(l => l.p === ns + prop).map(l => l.v) : [];
const label = nd => lit(nd, 'prefLabel', SKOS_) || lit(nd, 'label', RDFS_) || local(nd.id);
const outs = (nd, prop) => nd.out.filter(e => e.p === P(prop)).map(e => state.nodes.get(e.o));
const ins = (nd, prop) => nd.in.filter(e => e.p === P(prop)).map(e => state.nodes.get(e.s));
const reif = (s, p, o) => state.reif.get(s.id + '|' + P(p) + '|' + o.id);
const ack = (d, p) => { const a = reif(d, 'overrides', p); const v = a && lit(a, 'acknowledged'); return v === undefined ? null : v === 'true'; };
const citedBy = (d, p) => { const a = reif(d, 'honors', p); return (a && lit(a, 'citedBy')) || 'unspecified'; };
const isActive = d => /^(adopted|accepted)$/i.test(lit(d, 'status') || '');

/* =========================== Findings =========================== */
function findings() {
  const f = { unack: [], ack: [], dead: [], uncited: [], untestable: [], noPrin: [], tensions: [], defects: [], conflicts: [], openQ: [] };
  for (const p of state.principles) {
    const t = lit(p, 'testable'); if (t === 'false') { f.untestable.push(p); continue; }
    const eng = [...ins(p, 'honors'), ...ins(p, 'overrides'), ...ins(p, 'cites')];
    if (!eng.length) f.dead.push(p); else if (!ins(p, 'cites').length) f.uncited.push(p);
    for (const q of outs(p, 'inTensionWith')) f.tensions.push([p, q]);
    for (const d of lits(p, 'defect')) f.defects.push([p, d]);
  }
  for (const d of state.decisions) {
    for (const p of outs(d, 'overrides')) (ack(d, p) ? f.ack : f.unack).push([d, p]);
    if (!outs(d, 'cites').length) f.noPrin.push([d, outs(d, 'honors').length + outs(d, 'overrides').length > 0]);
    for (const x of lits(d, 'defect')) f.defects.push([d, x]);
  }
  for (const a of state.artifacts) for (const x of lits(a, 'defect')) f.defects.push([a, x]);
  const byQ = new Map(); for (const d of state.decisions) for (const q of outs(d, 'answers')) { if (!byQ.has(q.id)) byQ.set(q.id, []); byQ.get(q.id).push(d); }
  for (const [qid, ds] of byQ) { const act = ds.filter(isActive); if (act.length > 1 && new Set(act.map(d => lit(d, 'decidedOption'))).size > 1) f.conflicts.push([state.nodes.get(qid), act]); }
  for (const q of state.questions) if (!ins(q, 'answers').length) f.openQ.push(q);
  return f;
}

/* =========================== Rendering =========================== */
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt !== undefined) e.textContent = txt; return e; };
function pill(nd, cls, extra) { const p = el('span', 'pill ' + (cls || ''), label(nd) + (extra ? ' · ' + extra : '')); p.title = local(nd.id); p.onclick = e => { e.stopPropagation(); go(nd); }; return p; }
function short(s, n = 160) { return s && s.length > n ? s.slice(0, n - 1) + '…' : s; }
function statusTag(d) { const s = lit(d, 'status') || '—'; return el('span', 'status ' + s.toLowerCase(), s); }

function renderOverview() {
  const m = document.getElementById('main'); m.innerHTML = '';
  const f = findings();
  m.appendChild(el('h1', null, 'Overview — ' + (state.fileName || 'no graph loaded')));
  m.appendChild(el('div', 'muted small', `${state.principles.length} principles · ${state.decisions.length} decisions · ${state.artifacts.length} artifacts · ${state.questions.length} questions · ${state.assertions.length} assertions`));
  const stats = el('div'); const stat = (n, t, cls, view) => { const s = el('div', 'stat ' + cls); s.appendChild(el('b', null, String(n))); s.appendChild(el('span', 'small', t)); s.onclick = () => setView(view); stats.appendChild(s); };
  stat(f.unack.length, 'unacknowledged overrides', 'bad', 'conflicts'); stat(f.ack.length, 'acknowledged exceptions', 'warn', 'conflicts'); stat(f.tensions.length, 'principle tensions', 'warn', 'gaps');
  stat(f.dead.length, 'dead-letter principles', 'dead', 'gaps'); stat(f.noPrin.filter(x => !x[1]).length + f.noPrin.filter(x => x[1]).length, 'decisions citing no principle', 'dead', 'gaps');
  stat(f.defects.length, 'source defects', 'defect', 'gaps'); stat(f.openQ.length, 'open questions', 'warn', 'questions');
  m.appendChild(stats);
  m.appendChild(el('h2', null, 'Conflicts')); if (!f.unack.length && !f.ack.length) m.appendChild(el('p', 'muted', 'No decision overrides a principle.'));
  for (const [d, p] of f.unack) m.appendChild(conflictCard(d, p, false)); for (const [d, p] of f.ack) m.appendChild(conflictCard(d, p, true));
  m.appendChild(el('h2', null, 'Compliance matrix')); m.appendChild(matrix());
}
function conflictCard(d, p, isAck) {
