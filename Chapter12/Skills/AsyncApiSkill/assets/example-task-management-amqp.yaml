asyncapi: 3.1.0
info:
  title: Task Management System (RabbitMQ)
  version: 1.0.0
  description: |
    Async API specification for the Task Management System over RabbitMQ (AMQP 0-9-1).
    The service publishes task lifecycle events to a topic exchange for Creators,
    Freelancers, and Assignees, and consumes assignment requests from a work queue.
  contact:
    name: Task Management Team
    url: https://taskmanagement.org
    email: team@taskmanagement.org

servers:
  production:
    host: "rabbitmq.taskmanagement.com:5671"
    protocol: "amqps"
    protocolVersion: "0.9.1"
    description: "Production RabbitMQ broker (TLS)"
    security:
      - $ref: '#/components/securitySchemes/user-password'
  development:
    host: "localhost:5672"
    protocol: "amqp"
    protocolVersion: "0.9.1"
    description: "Local RabbitMQ broker"
    security:
      - $ref: '#/components/securitySchemes/user-password'

defaultContentType: application/json

channels:
  # PUBLISHER side: the address is the ROUTING KEY, the binding names the EXCHANGE.
  # One channel carries all lifecycle events; the {eventType} parameter selects
  # the routing key (task.created, task.assigned, ...).
  taskEvents:
    address: "task.{eventType}"
    description: Task lifecycle events, routed by event type on the task-management topic exchange
    parameters:
      eventType:
        description: Lifecycle event type, used as the last routing-key segment
        enum: [created, assigned, processed, completed]
    messages:
      taskCreated:
        $ref: '#/components/messages/taskCreated'
      taskAssigned:
        $ref: '#/components/messages/taskAssigned'
      taskProcessed:
        $ref: '#/components/messages/taskProcessed'
      taskCompleted:
        $ref: '#/components/messages/taskCompleted'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: task-management
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: "0.3.0"

  # CONSUMER side: the address is the QUEUE name, the binding describes the queue.
  # (The broker-side binding of this queue to an exchange is deployment
  # configuration, not part of the API contract.)
  assignmentRequests:
    address: "task-management.assignment-requests"
    description: Work queue of assignment requests waiting for the Task Management Service
    messages:
      assignmentRequested:
        $ref: '#/components/messages/assignmentRequested'
    bindings:
      amqp:
        is: queue
        queue:
          name: task-management.assignment-requests
          durable: true
          exclusive: false
          autoDelete: false
          vhost: /
        bindingVersion: "0.3.0"

operations:
  publishTaskCreated:
    action: send
    description: Published once a task has been persisted; routed as task.created
    channel:
      $ref: '#/channels/taskEvents'
    messages:
      - $ref: '#/channels/taskEvents/messages/taskCreated'
    bindings:
      amqp:
        deliveryMode: 2
        mandatory: true
        timestamp: true
        bindingVersion: "0.3.0"

  publishTaskAssigned:
    action: send
    description: Published once a freelancer accepts a task; routed as task.assigned
    channel:
      $ref: '#/channels/taskEvents'
    messages:
      - $ref: '#/channels/taskEvents/messages/taskAssigned'
    bindings:
      amqp:
        deliveryMode: 2
        mandatory: true
        timestamp: true
        bindingVersion: "0.3.0"

  publishTaskProcessed:
    action: send
    description: Published on each progress update; routed as task.processed
    channel:
      $ref: '#/channels/taskEvents'
    messages:
      - $ref: '#/channels/taskEvents/messages/taskProcessed'
    bindings:
      amqp:
        deliveryMode: 1
        mandatory: false
        timestamp: true
        bindingVersion: "0.3.0"

  publishTaskCompleted:
    action: send
    description: Published when the assignee marks the task done; routed as task.completed
    channel:
      $ref: '#/channels/taskEvents'
    messages:
      - $ref: '#/channels/taskEvents/messages/taskCompleted'
    bindings:
      amqp:
        deliveryMode: 2
        mandatory: true
        timestamp: true
        bindingVersion: "0.3.0"

  consumeAssignmentRequested:
    action: receive
    description: |
      Consumes assignment requests from the work queue. The message is acknowledged
      only after the assignment has been recorded, so a crash mid-processing redelivers it.
    channel:
      $ref: '#/channels/assignmentRequests'
    messages:
      - $ref: '#/channels/assignmentRequests/messages/assignmentRequested'
    bindings:
      amqp:
        ack: true
        bindingVersion: "0.3.0"

components:
  messages:
    taskCreated:
      name: TaskCreated
      title: Task Created Event
      summary: Indicates that a new task has been created
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/TaskCreatedPayload'
      bindings:
        amqp:
          contentEncoding: identity
          messageType: TaskCreated
          bindingVersion: "0.3.0"

    taskAssigned:
      name: TaskAssigned
      title: Task Assigned Event
      summary: Indicates that a task has been assigned to a freelancer
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/TaskAssignedPayload'
      bindings:
        amqp:
          contentEncoding: identity
          messageType: TaskAssigned
          bindingVersion: "0.3.0"

    taskProcessed:
      name: TaskProcessed
      title: Task Processed Event
      summary: Indicates that a task is being processed
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/TaskProcessedPayload'
      bindings:
        amqp:
          contentEncoding: identity
          messageType: TaskProcessed
          bindingVersion: "0.3.0"

    taskCompleted:
      name: TaskCompleted
      title: Task Completed Event
      summary: Indicates that a task has been completed
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/TaskCompletedPayload'
      bindings:
        amqp:
          contentEncoding: identity
          messageType: TaskCompleted
          bindingVersion: "0.3.0"

    assignmentRequested:
      name: AssignmentRequested
      title: Assignment Requested Command
      summary: Asks the Task Management Service to assign a task to a freelancer
      headers:
        $ref: '#/components/schemas/MessageHeader'
      payload:
        $ref: '#/components/schemas/AssignmentRequestedPayload'
      bindings:
        amqp:
          contentEncoding: identity
          messageType: AssignmentRequested
          bindingVersion: "0.3.0"

  schemas:
    MessageHeader:
      type: object
      required:
        - correlationId
        - messageId
        - source
      properties:
        correlationId:
          type: string
          format: uuid
          description: Identifier to trace end-to-end task journey
        messageId:
          type: string
          format: uuid
          description: Unique identifier for this message
        source:
          type: string
          description: Source system generating the event
          minLength: 2
          maxLength: 20

    TaskCreatedPayload:
      type: object
      required:
        - taskId
        - title
        - status
        - creatorId
      properties:
        taskId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        status:
          type: string
          enum: [NEW]
        dueDate:
          type: string
          format: date-time
        creatorId:
          type: string
          format: uuid
        inboxId:
          type: string
          format: uuid

    TaskAssignedPayload:
      type: object
      required:
        - taskId
        - freelancerId
        - assigneeId
        - status
      properties:
        taskId:
          type: string
          format: uuid
        freelancerId:
          type: string
          format: uuid
        assigneeId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ASSIGNED]

    TaskProcessedPayload:
      type: object
      required:
        - taskId
        - status
      properties:
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [IN_PROGRESS]
        progress:
          type: integer
          minimum: 0
          maximum: 100

    TaskCompletedPayload:
      type: object
      required:
        - taskId
        - status
        - completedBy
      properties:
        taskId:
          type: string
          format: uuid
        status:
          type: string
          enum: [DONE]
        completedBy:
          type: string
          format: uuid
        completedAt:
          type: string
          format: date-time

    AssignmentRequestedPayload:
      type: object
      required:
        - taskId
        - freelancerId
        - requestedBy
      properties:
        taskId:
          type: string
          format: uuid
        freelancerId:
          type: string
          format: uuid
        requestedBy:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time

  securitySchemes:
    user-password:
      type: userPassword
      description: RabbitMQ username/password (PLAIN SASL) for the broker connection