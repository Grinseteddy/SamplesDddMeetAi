<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ADR & Principles browser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --ink:#1b1f24; --muted:#6b7280; --rule:#e5e7eb; --bg:#ffffff; --side:#f7f8fa;
          --ok:#1a7f4b; --okbg:#e6f4ec; --bad:#b42318; --badbg:#fdecea; --warn:#9a6700; --warnbg:#fff4d6;
          --cite:#1f5fbf; --citebg:#e8effb; --dead:#6b7280; --deadbg:#f1f2f4; --defect:#7a2e9e; --defectbg:#f3e8fa; }
  * { box-sizing:border-box }
  body { margin:0; font:14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); display:grid; grid-template-columns:280px 1fr; min-height:100vh }
  aside { background:var(--side); border-right:1px solid var(--rule); padding:16px; overflow:auto; position:sticky; top:0; height:100vh }
  main { padding:24px 32px; max-width:1100px }
  h1 { font-size:16px; margin:0 0 12px } h2 { font-size:15px; margin:22px 0 8px } h3 { font-size:13px; color:var(--muted); font-weight:600; margin:18px 0 6px; text-transform:uppercase; letter-spacing:.04em }
  .side-sec { margin-top:14px } .side-sec h3 { margin:0 0 4px }
  .nav a { display:block; padding:4px 8px; border-radius:6px; color:var(--ink); text-decoration:none; font-size:13px; cursor:pointer }
  .nav a:hover { background:#e9ecf0 } .nav a.active { background:#dfe6ef; font-weight:600 }
  .nav .sub { color:var(--muted); font-size:11.5px; margin-left:2px }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--rule); background:#fff; margin:2px 4px 2px 0; cursor:pointer; white-space:nowrap }
  .pill:hover { border-color:#9aa3ad }
  .pill.ok { background:var(--okbg); border-color:#bfe3cf; color:var(--ok) }
  .pill.bad { background:var(--badbg); border-color:#f3c2bd; color:var(--bad) }
  .pill.warn { background:var(--warnbg); border-color:#f0dfa8; color:var(--warn) }
  .pill.cite { background:var(--citebg); border-color:#c4d4f2; color:var(--cite) }
  .pill.dead { background:var(--deadbg); color:var(--dead) }
  .pill.defect { background:var(--defectbg); border-color:#dcc4ea; color:var(--defect) }
  .tag { font-size:11px; color:var(--muted); margin-right:6px }
  .card { border:1px solid var(--rule); border-radius:10px; padding:14px 16px; margin:10px 0; background:#fff }
  .card.bad { border-color:#f3c2bd; background:#fff9f8 } .card.warn { border-color:#f0dfa8; background:#fffdf5 } .card.defect { border-color:#dcc4ea; background:#fcf8fe }
  .kv { display:grid; grid-template-columns:150px 1fr; gap:4px 14px; font-size:13px } .kv dt { color:var(--muted) } .kv dd { margin:0 }
  blockquote { margin:6px 0; padding:6px 12px; border-left:3px solid var(--rule); color:#374151; font-size:13px }
  table { border-collapse:collapse; width:100%; font-size:13px; margin:8px 0 } th, td { border-bottom:1px solid var(--rule); padding:7px 8px; text-align:left; vertical-align:top } th { color:var(--muted); font-weight:500; font-size:11.5px }
  .muted { color:var(--muted) } .small { font-size:12px } .num { font-variant-numeric:tabular-nums }
  .stat { display:inline-block; min-width:120px; padding:10px 14px; border:1px solid var(--rule); border-radius:10px; margin:4px 8px 4px 0; cursor:pointer } .stat b { display:block; font-size:22px } .stat.bad b { color:var(--bad) } .stat.ok b { color:var(--ok) } .stat.warn b { color:var(--warn) } .stat.dead b { color:var(--dead) } .stat.defect b { color:var(--defect) }
  .matrix td.c { text-align:center } .matrix .cell { display:inline-block; width:22px; height:22px; border-radius:6px; line-height:22px; font-size:12px; cursor:pointer } .matrix .h { background:var(--okbg); color:var(--ok) } .matrix .o { background:var(--badbg); color:var(--bad) } .matrix .oa { background:var(--warnbg); color:var(--warn) } .matrix .ci { outline:2px solid var(--cite) } .matrix th.rot { writing-mode:vertical-rl; transform:rotate(180deg); height:130px; font-size:11px }
  .crumbs { font-size:12px; color:var(--muted); margin-bottom:8px } .crumbs a { color:var(--cite); cursor:pointer }
  input[type=file] { font-size:12px; width:100% } .drop { border:1px dashed #b7c0cb; border-radius:8px; padding:10px; font-size:12px; color:var(--muted); text-align:center }
  .legend span { margin-right:10px } .status { font-size:11px; padding:1px 6px; border-radius:4px; background:#eef0f3; color:#374151 }
  .status.superseded { text-decoration:line-through; color:var(--muted) }
  #panel { position:fixed; right:0; top:0; bottom:0; width:360px; background:#fff; border-left:1px solid var(--rule); box-shadow:-6px 0 18px rgba(0,0,0,.06); padding:18px; overflow:auto; transform:translateX(100%); transition:transform .15s } #panel.open { transform:none } #panel .close { float:right; cursor:pointer; color:var(--muted) }
  pre { white-space:pre-wrap; font-size:12px; background:#f7f8fa; padding:8px; border-radius:6px }
</style>

##############################################################################
# 3. Principles
##############################################################################

:Prin_AP0001_MonolithBeforeMicroservices a dkg:Principle ;
    skos:prefLabel "Monolith before Microservices" ;
    dkg:principleId "AP0001" ;
    dkg:statement "We will always start with a deployment monolith before cutting services out. However, the modules are modular regarding DDD principles." ;
    dkg:rationale "In the beginning, we do not know exactly the load and performance issues the single services have to face. Therefore, we will cut later with more experience." ;
    dkg:implication "We will have later costs for cutting out services. The teams need to be disciplined to follow the strict boundaries of the Bounded Contexts." ;
    dkg:scope "deployment shape; 'the modules are modular regarding DDD principles'" ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:testable true ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0001" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0002_AsyncBetweenContexts a dkg:Principle ;
    skos:prefLabel "Asynchronous Communication before Synchronous" ;
    dkg:principleId "AP0002" ;
    dkg:statement "For communication between Bounded Contexts asynchronous communication is preferred." ;
    dkg:rationale "Asynchronous communication guarantees the loose coupling between Bounded Contexts." ;
    dkg:implication "Loose coupling guarantees that we can later maintain and operate our application without large downtimes." ;
    dkg:scope "between Bounded Contexts" ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:testable true ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0002" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0003_UsingDDD a dkg:Principle ;
    skos:prefLabel "Using DDD" ;
    dkg:principleId "AP0003" ;
    dkg:statement "For design of our functional architecture, we will apply the principles of DDD." ;
    dkg:rationale "Architecture coming out of the blue does not support the business requirements functionally." ;
    dkg:implication "We need to support the functions required by business. Moreover, we need to support the maintenance of those functions for the upcoming years." ;
    dkg:scope "functional architecture" ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:testable true ;
    rdfs:comment "Close call on testability. Checkable in a weak sense: a decision that cuts modules along something other than Bounded Contexts, or names a module no DDD artifact has, would fail it. Kept testable on that reading (dkg:Inferred judgement)." ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0003" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0004_UsingResiduality a dkg:Principle ;
    skos:prefLabel "Using Residuality" ;
    dkg:principleId "AP0004" ;
    dkg:statement "For design of our technical architecture, we will apply the principles of Residuality Theory." ;
    dkg:rationale "Stressing an architecture with randomly selected stressors creates more sustaining architectures." ;
    dkg:implication "We do not know what future brings, therefore, we need the robust and best equipped architecture." ;
    dkg:scope "technical architecture" ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:testable true ;
    rdfs:comment "Testable as a process rule: an ADR either records the stressors it was tested against or it does not. None of the five does." ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0004" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0005a_AutomaticTesting a dkg:Principle ;
    skos:prefLabel "Automatic Testing" ;
    dkg:principleId "AP0005" ;
    dkg:statement "We can test our system by 95% automatically." ;
    dkg:rationale "Manual tests are too slow to allow us to test our system manually." ;
    dkg:implication "We need to follow a Test-Driven-Approach consequently." ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:testable true ;
    dkg:defect "Shares the ID AP0005 with the Micro-UIs entry that follows it in the document." ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0005 (first occurrence)" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0005b_MicroUIs a dkg:Principle ;
    skos:prefLabel "Micro-UIs" ;
    dkg:principleId "AP0005" ;
    dkg:statement "The Bounded Context publish their own UI as micro-UIs." ;
    dkg:rationale "The teams developing the Bounded Contexts must be as independent as possible. The UIs are part of the Bounded Contexts projects. The micro UIs can use a common platform, so that they appear out of one hand." ;
    dkg:implication "Using a large monolithic frontend would us slow down." ;
    dkg:scope "UIs of Bounded Contexts" ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:testable true ;
    dkg:defect "Shares the ID AP0005 with the Automatic Testing entry that precedes it in the document." ;
    dkg:mentions :Con_UserInterface ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0005 (second occurrence)" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0006_SyncForUIs a dkg:Principle ;
    skos:prefLabel "Synchronous communication for UIs" ;
    dkg:principleId "AP0006" ;
    dkg:statement "UI communication is done synchronously." ;
    dkg:rationale "UIs require synchronous communication." ;
    dkg:implication "UIs must communicate with humans, who expect to get immediate answers." ;
    dkg:scope "UI communication" ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:testable true ;
    dkg:mentions :Con_UserInterface ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0006" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0007_Monitoring a dkg:Principle ;
    skos:prefLabel "Monitoring" ;
    dkg:principleId "AP0007" ;
    dkg:statement "The system can be monitored to identify system-critical states reliable and fast." ;
    dkg:rationale "The operation of the software must be almost completely automated. We need to get a reliable alarm system based on a reliable monitoring system" ;
    dkg:implication "Using a large monolithic frontend would us slow down." ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:testable true ;
    dkg:defect "Implications line is a verbatim copy of AP0005 Micro-UIs' Implications and does not concern monitoring." ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0007" ; dkg:confidence dkg:OnArtifact .

:Prin_AP0008_FineGrainedAccessRights a dkg:Principle ;
    skos:prefLabel "Fine grained access rights" ;
    dkg:principleId "AP0008" ;
    dkg:statement "Domain artifacts are controlled by a fine-grained access control." ;
    dkg:rationale "The software will increase with time, and we need to respect the personal and author rights of our users." ;
    dkg:implication "With more coarse grained rights, we could contradict legal regulations." ;
    dkg:scope "domain artifacts" ;
    dkg:status "Adopted" ; dkg:amendedAt "2026-09-10"^^xsd:date ;
    dkg:testable true ;
    dkg:source :Art_Principles_Larder ; dkg:locator "AP0008" ; dkg:confidence dkg:OnArtifact .

# Principle-vs-principle: AP0002 (async) and AP0006 (sync) look opposed but are
# scoped apart — "between Bounded Contexts" vs "UI communication". No

# 4. Questions the full-form ADRs answer (minted from their Context sections)
##############################################################################

:Q_DeploymentShape_ADR0001 a dkg:Question ;
    skos:prefLabel "Which deployment shape do Larder's Bounded Contexts take — modular monolith, microservices, or monolith?" ;
    dkg:source :Art_ADR_ADR0001 ; dkg:locator "Context" ; dkg:confidence dkg:Implied .

  for (const d of ds) { const tr = el('tr'); tr.appendChild(el('td', 'num', lit(d, 'decisionId') || '')); const td = el('td'); td.appendChild(pill(d)); if (lits(d, 'defect').length) td.appendChild(el('span', 'pill defect', 'defect')); td.appendChild(el('div', 'muted small', short(lit(d, 'decidedOption'), 120))); tr.appendChild(td); const s = el('td'); s.appendChild(statusTag(d)); tr.appendChild(s); tr.appendChild(el('td', 'small num', lit(d, 'decidedAt') || ''));
    for (const prop of ['cites', 'honors', 'overrides']) { const c = el('td'); outs(d, prop).forEach(p => c.appendChild(pill(p, prop === 'overrides' ? (ack(d, p) ? 'warn' : 'bad') : prop === 'honors' ? 'ok' : 'cite', prop === 'honors' ? citedBy(d, p) : ''))); tr.appendChild(c); }
    const q = el('td', 'small'); outs(d, 'answers').forEach(x => { const s2 = el('div', null, short(label(x), 90)); s2.style.cursor = 'pointer'; s2.onclick = () => openPanel(x); q.appendChild(s2); }); tr.appendChild(q); t.appendChild(tr); } return t; }
function renderList(kind) { const m = document.getElementById('main'); m.innerHTML = ''; if (kind === 'principles') { m.appendChild(el('h1', null, 'Principles')); m.appendChild(principleTable(state.principles)); } else { m.appendChild(el('h1', null, 'Decisions')); m.appendChild(decisionTable(state.decisions)); } }
function renderGaps() { const m = document.getElementById('main'); m.innerHTML = ''; const f = findings(); m.appendChild(el('h1', null, 'Governance gaps'));
  const sec = (t, items, fn, empty) => { m.appendChild(el('h2', null, t + ' (' + items.length + ')')); if (!items.length) { m.appendChild(el('p', 'muted', empty)); return; } items.forEach(x => m.appendChild(fn(x))); };
  sec('Source defects', f.defects, ([nd, txt]) => { const c = el('div', 'card defect'); c.appendChild(pill(nd, 'defect')); c.appendChild(el('div', 'small', txt)); return c; }, 'None recorded.');
  sec('Principle tensions', f.tensions, ([p, q]) => { const c = el('div', 'card warn'); c.appendChild(pill(p, 'warn')); c.appendChild(el('span', 'tag', '↔')); c.appendChild(pill(q, 'warn')); return c; }, 'No two principles pull opposite ways as written.');
  sec('Dead-letter principles', f.dead, p => { const c = el('div', 'card'); c.appendChild(pill(p, 'dead')); c.appendChild(el('div', 'muted small', short(lit(p, 'statement'), 200))); return c; }, 'Every testable principle is engaged by at least one decision.');
  sec('Principles honored but never cited by ID', f.uncited, p => { const c = el('div', 'card'); c.appendChild(pill(p)); const d = el('div'); ins(p, 'honors').forEach(x => d.appendChild(pill(x, 'ok', citedBy(x, p)))); ins(p, 'overrides').forEach(x => d.appendChild(pill(x, ack(x, p) ? 'warn' : 'bad'))); c.appendChild(d); return c; }, 'None.');
  sec('Untestable principles', f.untestable, p => { const c = el('div', 'card'); c.appendChild(pill(p, 'dead')); c.appendChild(el('div', 'small', lit(p, 'statement') || '')); return c; }, 'None.');
  sec('Decisions citing no principle', f.noPrin, ([d, eng]) => { const c = el('div', 'card'); c.appendChild(pill(d, eng ? 'warn' : '')); c.appendChild(el('span', 'tag', eng ? 'engages principles incidentally, names none' : 'engages no principle at all')); return c; }, 'Every decision cites at least one principle.');
  sec('Active decisions answering one question two ways', f.conflicts, ([q, ds]) => { const c = el('div', 'card bad'); c.appendChild(el('div', 'small', label(q))); ds.forEach(d => c.appendChild(pill(d, 'bad'))); return c; }, 'None.'); }
function renderConflicts() { const m = document.getElementById('main'); m.innerHTML = ''; const f = findings(); m.appendChild(el('h1', null, 'Conflicts')); if (!f.unack.length && !f.ack.length) m.appendChild(el('p', 'muted', 'No decision overrides a principle.')); m.appendChild(el('h2', null, 'Unacknowledged (' + f.unack.length + ')')); f.unack.forEach(([d, p]) => m.appendChild(conflictCard(d, p, false))); m.appendChild(el('h2', null, 'Acknowledged exceptions (' + f.ack.length + ')')); f.ack.forEach(([d, p]) => m.appendChild(conflictCard(d, p, true))); }
function renderQuestions() { const m = document.getElementById('main'); m.innerHTML = ''; m.appendChild(el('h1', null, 'Questions')); const f = findings(); m.appendChild(el('h2', null, 'Open (' + f.openQ.length + ')')); f.openQ.forEach(q => m.appendChild(questionRow(q))); const closed = state.questions.filter(q => ins(q, 'answers').length); m.appendChild(el('h2', null, 'Answered (' + closed.length + ')')); closed.forEach(q => m.appendChild(questionRow(q))); }
function crumbs(m, a, b) { const c = el('div', 'crumbs'); const l = el('a', null, a); l.onclick = () => setView(a.toLowerCase()); c.appendChild(l); c.appendChild(document.createTextNode(' › ' + b)); m.appendChild(c); }
function openPanel(nd, other) { const b = document.getElementById('panel-body'); b.innerHTML = ''; b.appendChild(el('h2', null, label(nd))); b.appendChild(el('div', 'muted small', [...nd.types].map(local).join(', ') + ' · ' + local(nd.id)));
  if (other) { const a = reif(nd, 'honors', other) || reif(nd, 'overrides', other); b.appendChild(el('h3', null, 'Verdict')); if (a) b.appendChild(assertionCard(a)); else { const d = el('div'); d.appendChild(pill(other)); b.appendChild(d); } }
  b.appendChild(el('h3', null, 'Literals')); const pre = el('pre'); pre.textContent = nd.lits.map(l => local(l.p) + ': ' + l.v).join('\n'); b.appendChild(pre);
  const links = el('div'); b.appendChild(el('h3', null, 'Links')); for (const e of nd.out) { const o = state.nodes.get(e.o); if (!o || e.p === RDF_ + 'type') continue; links.appendChild(el('span', 'tag', local(e.p) + ' →')); links.appendChild(pill(o)); links.appendChild(el('br')); } for (const e of nd.in) { const s = state.nodes.get(e.s); if (!s) continue; links.appendChild(el('span', 'tag', '← ' + local(e.p))); links.appendChild(pill(s)); links.appendChild(el('br')); } b.appendChild(links);
  const full = el('a', null, 'open full page'); full.style.cursor = 'pointer'; full.style.color = 'var(--cite)'; full.onclick = () => { closePanel(); go(nd); }; b.appendChild(full); document.getElementById('panel').classList.add('open'); }
function closePanel() { document.getElementById('panel').classList.remove('open'); }
function go(nd) { closePanel(); state.view = { kind: 'node', id: nd.id }; if (state.isA(nd, 'Principle')) renderPrinciple(nd); else if (state.isA(nd, 'Decision')) renderDecision(nd); else if (state.artifacts.includes(nd)) renderArtifact(nd); else openPanel(nd); highlight(); try { window.scrollTo(0, 0) } catch (_) {}; }
function setView(v) { closePanel(); state.view = { kind: 'view', id: v }; ({ overview: renderOverview, principles: () => renderList('principles'), decisions: () => renderList('decisions'), conflicts: renderConflicts, gaps: renderGaps, questions: renderQuestions, artifacts: () => renderList('decisions') })[v]?.(); highlight(); try { window.scrollTo(0, 0) } catch (_) {}; }
function highlight() { document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.dataset.id === state.view?.id)); }
function nav() { const nv = document.getElementById('nav-views'); nv.innerHTML = ''; [['overview', 'Overview & matrix'], ['conflicts', 'Conflicts'], ['gaps', 'Governance gaps'], ['questions', 'Questions'], ['principles', 'All principles'], ['decisions', 'All decisions']].forEach(([id, t]) => { const a = el('a', null, t); a.dataset.id = id; a.onclick = () => setView(id); nv.appendChild(a); });
  const f = findings(); const np = document.getElementById('nav-prin'); np.innerHTML = ''; for (const p of state.principles) { const a = el('a'); a.dataset.id = p.id; a.appendChild(el('span', null, (lit(p, 'principleId') || local(p.id)) + ' ')); a.appendChild(el('span', 'sub', short(label(p), 34))); if (f.dead.includes(p)) a.appendChild(el('span', 'sub', ' ∅')); if (ins(p, 'overrides').some(d => !ack(d, p))) a.appendChild(el('span', 'sub', ' ✗')); a.onclick = () => go(p); np.appendChild(a); }
  const nd = document.getElementById('nav-dec'); nd.innerHTML = ''; for (const d of state.decisions) { const a = el('a'); a.dataset.id = d.id; a.appendChild(el('span', null, (lit(d, 'decisionId') || local(d.id)) + ' ')); a.appendChild(el('span', 'sub', short(label(d), 34))); if (outs(d, 'overrides').some(p => !ack(d, p))) a.appendChild(el('span', 'sub', ' ✗')); if (!isActive(d)) a.style.opacity = .6; a.onclick = () => go(d); nd.appendChild(a); }
  const na = document.getElementById('nav-art'); na.innerHTML = ''; for (const x of state.artifacts) { const a = el('a', null, short(label(x), 40)); a.dataset.id = x.id; a.onclick = () => go(x); na.appendChild(a); } }
function loadText(text, name) { build(text, name); document.getElementById('loaded').textContent = name + ' — ' + state.principles.length + ' principles, ' + state.decisions.length + ' decisions'; nav(); setView('overview'); }
document.getElementById('file').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => loadText(t, f.name)); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
/* An embedded sample can be placed in a <script type="text/turtle" id="sample"> element; it loads on open. */
(function () { const s = document.getElementById('sample'); if (s && s.textContent.trim()) loadText(s.textContent, s.dataset.name || 'embedded graph'); else { document.getElementById('main').innerHTML = '<h1>ADR &amp; Principles browser</h1><p class="muted">Open a <code>.ttl</code> written by <code>adr-and-principles-ingester</code> (or any graph in the dkg vocabulary that carries <code>dkg:Principle</code> and <code>dkg:Decision</code> nodes). Everything shown is derived from the triples — verdicts, evidence, dead letters, defects — nothing is stored in this page.</p>'; nav(); } })();
</script>
